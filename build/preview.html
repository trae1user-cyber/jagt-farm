    return { headers: ["Date", "Animal", "Method", "Result", "Vet"], rows, footers: [`${rows.length} checks`, "", "", "", ""] };
  });
  R("calving-list", "repro", "Calving List", async () => {
    const { calvs, name } = await build();
    const rows = [...calvs].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((c) => [fmt(c.Date), name(c.AnimalID), c.CalfID || "—", c.CalfGender || "—", c.CalfWeight ? `${c.CalfWeight} kg` : "—", c.CalvingType || "—"]);
    return { headers: ["Date", "Mother", "Calf", "Gender", "Weight", "Type"], rows, footers: [`${rows.length} calvings`, "", "", "", "", ""] };
  });
  R("expected-calving", "repro", "Expected Calvings", async () => {
    const { pregs, ais, name } = await build();
    const gest = Number((await JF.Store.settings.allMap()).GestationDays ?? 283);
    const rows = [];
    for (const p of pregs.filter((x) => x.Result === "Positive")) {
      const ai = ais.find((x) => x.id === p.InseminationID || x.InseminationID === p.InseminationID);
      const calvDate = JF.Utils.addDays(ai?.Date || p.Date, gest);
      const left = JF.Utils.daysBetween(JF.Utils.today(), calvDate);
      rows.push([name(p.AnimalID), fmt(p.Date), p.InseminationID || "—", fmt(calvDate), left >= 0 ? `${left} days` : `${-left} days overdue`]);
    }
    return { headers: ["Animal", "Positive PD", "Linked AI", "Expected Calving", "Remaining"], rows, footers: [`${rows.length} expected`, "", "", "", ""] };
  });
  R("repro-perf", "repro", "Reproductive Performance", async () => {
    const { pregs, ais, calvs, animals } = await build();
    const posCount = pregs.filter((p) => p.Result === "Positive").length;
    const conception = pregs.length ? Math.round((posCount / pregs.length) * 100) : 0;
    // Calving interval: gap between consecutive calvings per animal (average)
    const byA = {};
    calvs.forEach((c) => { if (c.AnimalID) (byA[c.AnimalID] = byA[c.AnimalID] || []).push(new Date(c.Date)); });
    const gaps = [];
    Object.values(byA).forEach((ds) => {
      ds.sort((a, b) => a - b);
      for (let i = 1; i < ds.length; i++) gaps.push(Math.round((ds[i] - ds[i - 1]) / 86400000));
    });
    const avgCI = gaps.length ? Math.round(gaps.reduce((a, b) => a + b, 0) / gaps.length) : null;
    const rows = [
      ["Conception rate (pos PD / total PD)", `${conception}%`, `${posCount}/${pregs.length}`],
      ["Total inseminations", String(ais.length), `${ais.length} services`],
      ["Calvings recorded", String(calvs.length), ""],
      ["Average calving interval", avgCI ? `${avgCI} days` : "—", "needs 2+ calvings per animal"],
      ["Heifers / pregnant / open", `${animals.filter((a) => a.CurrentStatus === "Heifer").length} / ${animals.filter((a) => a.CurrentStatus === "Pregnant").length} / ${animals.filter((a) => a.CurrentStatus === "Open").length}`, "current herd state"],
    ];
    return { headers: ["Metric", "Value", "Basis"], rows };
  });

  // Health (5)
  R("treatments", "health", "Treatment List", async () => {
    const { healths, name } = await build();
    const rows = [...healths].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((h) => [fmt(h.Date), name(h.AnimalID), h.Problem || "—", h.Diagnosis || "—", h.Medicine || "—", h.TreatmentCost ? money(h.TreatmentCost) : "—", h.RecoveryStatus || "Open"]);
    return { headers: ["Date", "Animal", "Problem", "Diagnosis", "Medicine", "Cost", "Status"], rows, footers: [`${rows.length} cases`, "", "", "", "", "", ""] };
  });
  R("disease-freq", "health", "Disease Frequency", async () => {
    const { healths } = await build();
    const map = {};
    healths.forEach((h) => {
      const key = h.Diagnosis || h.Problem || "Unknown";
      map[key] = map[key] || { cases: 0, animals: new Set(), cost: 0 };
      map[key].cases++; if (h.AnimalID) map[key].animals.add(h.AnimalID);
      map[key].cost += Number(h.TreatmentCost || 0);
    });
    const rows = Object.entries(map).sort((a, b) => b[1].cases - a[1].cases)
      .map(([k, v]) => [k, String(v.cases), String(v.animals.size), money(v.cost)]);
    return { headers: ["Diagnosis / Problem", "Cases", "Animals Affected", "Total Cost"], rows, footers: [`${rows.length} conditions`, "", "", ""] };
  });
  R("vaccination", "health", "Vaccination List + Compliance", async () => {
    const { vax, name, active } = await build();
    const rows = [...vax].sort((a, b) => new Date(b.DateGiven) - new Date(a.DateGiven))
      .map((v) => [fmt(v.DateGiven), name(v.AnimalID), v.Vaccine || "—", v.BatchNumber || "—", v.NextDueDate ? fmt(v.NextDueDate) : "—"]);
    const covered = new Set(vax.map((v) => v.AnimalID).filter(Boolean));
    const compliance = active.length ? Math.round((covered.size / active.length) * 100) : 0;
    rows.unshift([`— Compliance: ${compliance}% of active herd has ≥1 vaccination record —`, "", "", "", ""]);
    return { headers: ["Date", "Animal", "Vaccine", "Batch", "Next Due"], rows, footers: [`${vax.length} vaccinations`, "", "", "", ""] };
  });
  R("deworming", "health", "Deworming List + Compliance", async () => {
    const { dews, name, active } = await build();
    const rows = [...dews].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((d) => [fmt(d.Date), name(d.AnimalID), d.Medicine || "—", d.Dose || "—", d.NextDueDate ? fmt(d.NextDueDate) : "—"]);
    const covered = new Set(dews.map((d) => d.AnimalID).filter(Boolean));
    const compliance = active.length ? Math.round((covered.size / active.length) * 100) : 0;
    rows.unshift([`— Compliance: ${compliance}% of active herd has ≥1 deworming record —`, "", "", "", ""]);
    return { headers: ["Date", "Animal", "Medicine", "Dose", "Next Due"], rows, footers: [`${dews.length} dewormings`, "", "", "", ""] };
  });
  R("health-expenses", "health", "Health Expenses by Category", async () => {
    const { journal } = await build();
    const HEALTH = ["Veterinary Expense", "Medicine Expense", "Vaccination Expense", "Deworming Expense"];
    const map = {};
    journal.filter((e) => HEALTH.includes(e.DebitAccount)).forEach((e) => {
      map[e.DebitAccount] = (map[e.DebitAccount] || 0) + Number(e.Amount || 0);
    });
    const rows = Object.entries(map).map(([k, v]) => [k, money(v)]);
    const total = Object.values(map).reduce((s, v) => s + v, 0);
    return { headers: ["Expense Account", "Total"], rows, footers: ["Total", money(total)] };
  });

  // Financial (9 + cash/bank book + per-animal = 11 registered under fin; spec counts 9)
  R("expenses", "fin", "Expense Statement", async () => {
    const { expenses } = await build();
    const rows = [...expenses].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((e) => [fmt(e.Date), e.Category || "—", e.Description || "—", e.Vendor || "—", e.AnimalID || "—", e.PaymentMethod || "—", money(e.Amount)]);
    const total = expenses.reduce((s, e) => s + Number(e.Amount || 0), 0);
    return { headers: ["Date", "Category", "Description", "Vendor", "Animal", "Payment", "Amount"], rows, footers: ["Total", "", "", "", "", "", money(total)] };
  });
  R("purchase-register", "fin", "Purchase Register", async () => {
    const { purchases } = await build();
    const rows = purchases.map((p) => [fmt(p.Date), p.Seller || "—", p.AnimalID || "—", money(p.PurchasePrice), money(p.TransportationCost), money(p.VeterinaryCheckCost), money(p.TotalCost)]);
    const total = purchases.reduce((s, p) => s + Number(p.TotalCost || 0), 0);
    return { headers: ["Date", "Seller", "Animal", "Price", "Transport", "Vet Check", "Total"], rows, footers: ["Total", "", "", "", "", "", money(total)] };
  });
  R("sale-register", "fin", "Sale Register", async () => {
    const { sales } = await build();
    const rows = sales.map((s) => [fmt(s.Date), s.Buyer || "—", s.AnimalID || "—", money(s.SalePrice), money((Number(s.Transportation || 0) + Number(s.Commission || 0) + Number(s.OtherCost || 0))), money(s.NetSale)]);
    const total = sales.reduce((st, s) => st + Number(s.NetSale || 0), 0);
    return { headers: ["Date", "Buyer", "Animal", "Price", "Deductions", "Net"], rows, footers: ["Total", "", "", "", "", money(total)] };
  });
  R("journal", "fin", "Journal", async () => {
    const { journal } = await build();
    const rows = [...journal].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((j) => [fmt(j.Date), j.Description || j.TransactionType || "Entry", j.DebitAccount || "—", j.CreditAccount || "—", money(j.Amount), j.ReferenceID || "—"]);
    const total = journal.reduce((s, j) => s + Number(j.Amount || 0), 0);
    return { headers: ["Date", "Description", "Dr", "Cr", "Amount", "Reference"], rows, footers: ["Total", "", "", "", money(total), ""] };
  });
  R("ledger", "fin", "General Ledger (account summary)", async () => {
    const { journal } = await build();
    const totals = JF.FinanceCalc.accountTotals(journal);
    const rows = Object.entries(totals).sort((a, b) => a[0].localeCompare(b[0])).map(([acct, b]) => {
      const net = b.dr - b.cr;
      return [acct, money(b.dr), money(b.cr), net >= 0 ? `${money(net)} Dr` : `${money(-net)} Cr`];
    });
    return { headers: ["Account", "Total Dr", "Total Cr", "Net Balance"], rows };
  });
  R("trialbalance", "fin", "Trial Balance", async () => {
    const { journal } = await build();
    const tb = JF.FinanceCalc.trialBalance(journal);
    const rows = tb.rows.map((r) => [r.account, r.dr ? money(r.dr) : "—", r.cr ? money(r.cr) : "—"]);
    rows.push(tb.balanced ? ["✓ BALANCED", money(tb.totalDr), money(tb.totalCr)] : [`⚠ DIFFERENCE: ${money(Math.abs(tb.difference))}`, money(tb.totalDr), money(tb.totalCr)]);
    return { headers: ["Account", "Debit", "Credit"], rows };
  });
  R("pnl", "fin", "Profit & Loss", async () => {
    const { journal } = await build();
    const p = JF.FinanceCalc.pnl(journal);
    const rows = [["INCOME", "", ""], ...p.income.map((x) => ["", x.account, money(x.amount)]), ["Total income", "", money(p.totalIncome)], ["", "", ""], ["EXPENSES", "", ""], ...p.expenses.map((x) => ["", x.account, money(x.amount)]), ["Total expenses", "", money(p.totalExpense)], ["", "", ""], ["NET PROFIT / (LOSS)", "", money(p.net)]];
    return { headers: ["Section", "Line", "Amount"], rows };
  });
  R("balancesheet", "fin", "Balance Sheet", async () => {
    const { journal } = await build();
    const b = JF.FinanceCalc.balanceSheet(journal);
    const rows = [
      ["ASSETS", "", ""], ...b.assets.map((x) => ["", x.account, money(x.amount)]), ["Total assets", "", money(b.totalAssets)], ["", "", ""],
      ["LIABILITIES", "", ""], ...b.liabilities.map((x) => ["", x.account, money(x.amount)]), ["Total liabilities", "", money(b.totalLiabilities)], ["", "", ""],
      ["EQUITY", "", ""], ...b.equity.map((x) => ["", x.account, money(x.amount)]), ["Total equity", "", money(b.totalEquity)], ["", "", ""],
      [b.balanced ? "✓ BALANCED (A = L + E)" : `⚠ DIFFERENCE: ${money(Math.abs(b.difference))}`, "", ""],
    ];
    return { headers: ["Section", "Line", "Amount"], rows };
  });
  R("cashbook", "fin", "Cash Book", async () => {
    const { journal } = await build();
    const cb = JF.FinanceCalc.cashBook(journal, "Cash");
    const rows = [];
    rows.push(["", "OPENING BALANCE", "", money(cb.opening), ""]);
    cb.receipts.forEach((r) => rows.push([fmt(r.date), r.particulars, r.ref, money(r.amount), r.contra ? "contra" : ""]));
    cb.payments.forEach((p) => rows.push([fmt(p.date), p.particulars, p.ref, "", money(p.amount)]));
    rows.push(["", `RECEIPTS ${money(cb.totalReceipts)} · PAYMENTS ${money(cb.totalPayments)}`, "", "", ""]);
    rows.push(["", "CLOSING BALANCE", "", money(cb.closing), ""]);
    return { headers: ["Date", "Particulars", "Ref", "Receipt (Dr)", "Payment (Cr)"], rows };
  });
  R("bankbook", "fin", "Bank Book", async () => {
    const { journal } = await build();
    const cb = JF.FinanceCalc.cashBook(journal, "Bank");
    const rows = [];
    rows.push(["", "OPENING BALANCE", "", money(cb.opening), ""]);
    cb.receipts.forEach((r) => rows.push([fmt(r.date), r.particulars, r.ref, money(r.amount), r.contra ? "contra" : ""]));
    cb.payments.forEach((p) => rows.push([fmt(p.date), p.particulars, p.ref, "", money(p.amount)]));
    rows.push(["", `RECEIPTS ${money(cb.totalReceipts)} · PAYMENTS ${money(cb.totalPayments)}`, "", "", ""]);
    rows.push(["", "CLOSING BALANCE", "", money(cb.closing), ""]);
    return { headers: ["Date", "Particulars", "Ref", "Receipt (Dr)", "Payment (Cr)"], rows };
  });
  R("per-animal-cost", "fin", "Per-Animal Cost", async () => {
    const { journal, name } = await build();
    const map = {};
    journal.filter((e) => e.AnimalID && (e.DebitAccount || "").includes("Expense")).forEach((e) => {
      map[e.AnimalID] = (map[e.AnimalID] || 0) + Number(e.Amount || 0);
    });
    const rows = Object.entries(map).sort((a, b) => b[1] - a[1]).map(([id, v]) => [name(id), money(v)]);
    return { headers: ["Animal", "Total Expense Posted"], rows, footers: [`${rows.length} animals with costs`, ""] };
  });

  const fmt = (d) => JF.Utils.formatDate(d);

  /* ---------- Landing ---------- */
  const GROUPS = [
    { id: "animal", title: "Animal Reports", icon: "animals", eyebrow: "🐄 ANIMAL" },
    { id: "repro", title: "Reproduction Reports", icon: "heart", eyebrow: "🔄 REPRODUCTION" },
    { id: "health", title: "Health Reports", icon: "health", eyebrow: "🩺 HEALTH" },
    { id: "fin", title: "Financial Reports", icon: "finance", eyebrow: "💰 FINANCIAL" },
  ];

  const landing = () => {
    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "📊 Reports Center"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, "All Reports"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          `${Object.keys(G).length} live reports built from your records — print or export any of them.`),
      ]),
    ]));
    page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-2" }, GROUPS.map((g) => {
      const slugs = Object.entries(G).filter(([, v]) => v.group === g.id);
      return JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__header" }, [
          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "card__eyebrow" }, g.eyebrow),
            JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } }, `${g.title} `,
              JF.Utils.el("span", { class: "chip" }, `${slugs.length} reports`)),
          ]),
          JF.Utils.el("div", { class: "stat-icon", html: JF.Utils.svgIcon(g.icon, 20, 20) }),
        ]),
        JF.Utils.el("div", { class: "divider" }),
        JF.Utils.el("div", { style: { display: "flex", flexDirection: "column", gap: "var(--space-3)" } },
          slugs.map(([slug, def]) => JF.Utils.el("a", {
            href: `#reports/${slug}`, class: "chip",
            style: { justifyContent: "space-between", padding: "10px var(--space-4)", width: "100%", cursor: "pointer", borderRadius: "var(--radius-md)", fontSize: "var(--fs-sm)", fontWeight: 500 },
            html: `<span>${def.title}</span>${JF.Utils.svgIcon("arrowRight", 14, 14)}`,
          }))),
      ]);
    })));
    return page;
  };

  /* ---------- Report page ---------- */
  const csvBtn = (headers, rows) => JF.Utils.el("button", {
    class: "btn btn--ghost btn--sm", onclick: () => {
      const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const lines = [headers.map(esc).join(",")];
      rows.forEach((tr) => lines.push([...tr.children].map((c) => c.innerText).map(esc).join(",")));
      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "report.csv";
      a.click();
      JF.Toast.show("CSV exported (client-side stub).", "success");
    },
  }, "Export CSV");

  const reportPage = async (slug) => {
    const def = G[slug];
    const page = JF.Utils.el("div", { class: "page" });
    let result;
    try { result = await def.run(); }
    catch (e) { console.error("Report failed:", slug, e); result = { headers: ["Error"], rows: [[String(e.message || e)]] }; }
    const { headers, rows, footers } = result;
    page.appendChild(JF.Utils.el("a", { class: "eyebrow", href: "#reports", style: { marginBottom: "var(--space-3)", cursor: "pointer", display: "inline-block" }, html: "← All reports" }));
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "📊 REPORT"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, def.title),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        csvBtn(headers, rows),
        JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => window.print() }, "Print"),
      ]),
    ]));

    const t = JF.Utils.el("table", { class: "table" });
    t.appendChild(JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, headers.map((h) => JF.Utils.el("th", {}, h)))));
    t.appendChild(JF.Utils.el("tbody", {}, rows.length
      ? rows.map((r) => JF.Utils.el("tr", {}, r.map((c) => typeof c === "string" && /[<>]/.test(c) ? td(c) : JF.Utils.el("td", {}, c))))
      : [JF.Utils.el("tr", {}, JF.Utils.el("td", { colspan: String(headers.length), style: "text-align:center;padding:24px;color:var(--color-ink-400)" }, "No data for this report."))]));
    if (footers) t.appendChild(JF.Utils.el("tfoot", {}, JF.Utils.el("tr", { style: "font-weight:bold;background:var(--color-bg-soft)" }, footers.map((f) => JF.Utils.el("td", { html: String(f) })))));
    page.appendChild(JF.Utils.el("div", { class: "table-container card" }, t));
    return page;
  };

  const render = async (path = []) => {
    const root = $();
    JF.Utils.clear(root);
    const slug = path?.[1];
    if (slug && G[slug]) root.appendChild(await reportPage(slug));
    else if (slug) root.appendChild(JF.Utils.el("div", { class: "page" },
      JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-7)" } }, `Unknown report "${slug}".`)));
    else root.appendChild(landing());
  };

  return { render, REPORTS: G };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Analytics = (function () {
  const $ = () => document.getElementById("view-container");

  const sectionHeader = (eyebrow, title, desc, icon, accent = "") => JF.Utils.el("div", { class: "section__head" }, [
    JF.Utils.el("div", { class: "hero-stat", style: { gridTemplateColumns: "56px 1fr" } }, [
      JF.Utils.el("div", { class: "stat-icon" + (accent ? ` ${accent}` : ""), style: { width: 48, height: 48 }, html: JF.Utils.svgIcon(icon, 24, 24) }),
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "card__eyebrow" }, eyebrow),
        JF.Utils.el("h2", { class: "section__title", style: { margin: 0 } }, title),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "4px" } }, desc),
      ]),
    ]),
  ]);

  const kpi = (label, value, icon, accent = "") => JF.Utils.el("div", { class: "card card--stat" }, [
    JF.Utils.el("div", { class: "stat-icon" + (accent ? ` ${accent}` : ""), html: JF.Utils.svgIcon(icon, 18, 18) }),
    JF.Utils.el("div", {}, [
      JF.Utils.el("div", { class: "stat-number stat-number--sm" }, value),
      JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
    ]),
  ]);

  const bar = (label, val, pct, color) => JF.Utils.el("div", { style: "margin-bottom:12px" }, [
    JF.Utils.el("div", { style: "display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px" }, [
      JF.Utils.el("span", {}, label),
      JF.Utils.el("span", { style: "font-weight:600" }, val),
    ]),
    JF.Utils.el("div", { style: "height:8px;background:var(--color-bg-soft);border-radius:4px;overflow:hidden" }, [
      JF.Utils.el("div", { style: `height:100%;width:${Math.max(0, Math.min(100, pct))}%;background:${color};border-radius:4px` }),
    ]),
  ]);

  const render = async () => {
    const root = $();
    JF.Utils.clear(root);

    // Everything real: no seed, no defaults-as-data, no hardcoded percentages.
    const [animals, heats, insem, preg, calv, healths, vax, dews, expenses, sales, journal, reminders] = await Promise.all([
      JF.Store.animals.list().catch(() => []),
      JF.Store.heat.list().catch(() => []),
      JF.Store.insemination.list().catch(() => []),
      JF.Store.pregnancy.list().catch(() => []),
      JF.Store.calving.list().catch(() => []),
      JF.Store.health.list().catch(() => []),
      JF.Store.vaccination.list().catch(() => []),
      JF.Store.deworming.list().catch(() => []),
      JF.Store.expenses.list().catch(() => []),
      JF.Store.sales.list().catch(() => []),
      JF.Store.journal.list().catch(() => []),
      JF.Store.reminders.list().catch(() => []),
    ]);

    const active = animals.filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus));
    const females = active.filter((a) => (a.Gender || "Female") === "Female");
    const adultFemales = females.filter((a) => !["Calf"].includes(a.CurrentStatus));
    const byStatus = (s) => active.filter((a) => a.CurrentStatus === s).length;
    const pct = (n, d) => (d > 0 ? Math.round((n / d) * 100) : 0);
    const money = JF.Utils.money;

    // --- Reproduction, all from records ---
    const posPreg = preg.filter((p) => p.Result === "Positive").length;
    const negPreg = preg.filter((p) => p.Result === "Negative").length;
    const decidedPD = posPreg + negPreg;
    const pdRate = pct(posPreg, decidedPD);
    // AI → PD conversion measured on PDs actually recorded.
    const heatDetectionRate = adultFemales.length ? pct(heats.length, heats.length + insem.length + adultFemales.length) : 0;

    // Calving interval across the whole herd (from calving records).
    let intervals = [];
    const byCow = {};
    calv.forEach((c) => { (byCow[c.AnimalID] = byCow[c.AnimalID] || []).push(c.Date || c.CalvingDate); });
    Object.values(byCow).forEach((dates) => {
      dates.sort();
      for (let i = 1; i < dates.length; i++) {
        const g = JF.Utils.daysBetween(dates[i - 1], dates[i]);
        if (g > 150 && g < 700) intervals.push(g);
      }
    });
    const avgCalvingInterval = intervals.length ? Math.round(intervals.reduce((s, g) => s + g, 0) / intervals.length) : null;

    let board = [];
    try { board = await JF.LifeCycle.calvingBoard(); } catch (e) {}

    // --- Health compliance, from records ---
    const recovered = healths.filter((h) => h.RecoveryStatus === "Recovered").length;
    const openCases = healths.filter((h) => ["Open", "Under Treatment", "Follow-up Required"].includes(h.RecoveryStatus)).length;
    const yearAgo = JF.Utils.addDays(JF.Utils.todayISO(), -365);
    const recentDews = dews.filter((x) => (x.Date || x.DateGiven) >= yearAgo).length;
    const recentVax = vax.filter((x) => x.DateGiven >= yearAgo).length;
    const dewormCompliance = adultFemales.length ? Math.min(100, pct(recentDews, adultFemales.length)) : 0;

    // --- Finance, from journal (double-entry source of truth) ---
    const expenseJ = journal.filter((e) => (e.DebitAccount || "").includes("Expense") || e.TransactionType === "expense");
    const incomeJ = journal.filter((e) => (e.CreditAccount || "").includes("Sales") || e.TransactionType === "sales");
    const totalExpense = expenseJ.reduce((s, e) => s + Number(e.Amount || 0), 0);
    const totalIncome = incomeJ.reduce((s, e) => s + Number(e.Amount || 0), 0);
    const medicalJ = expenseJ.filter((e) => /Veterinar|Medicin|Vaccin|Deworm/i.test(e.DebitAccount || ""));
    const medicalSpend = medicalJ.reduce((s, e) => s + Number(e.Amount || 0), 0);

    let medRows = [];
    try { medRows = await JF.LifeCycle.medicalEconomics(); } catch (e) {}
    const costWatch = medRows.filter((r) => r.lc.verdict === "cost-watch");

    const overdue = reminders.filter((r) => r.Status === "Overdue" || (r.Status !== "Completed" && r.Status !== "Dismissed" && JF.Utils.daysBetween(JF.Utils.todayISO(), r.DueDate) < 0)).length;

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "📈 Analytics"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, "Farm Analysis"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Every number below is computed from your own entries — nothing is estimated or filled in. Empty until you record data."),
      ]),
    ]));

    /* ---------- Reproduction ---------- */
    page.appendChild(JF.Utils.el("div", { class: "section" }, [
      sectionHeader("🔄 REPRODUCTION", "Reproductive Performance", "PD outcomes, calving rhythm and pending calvings — from your AI, PD and calving records.", "heart", "stat-icon--oxblood"),
      JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        kpi("PD Success Rate", decidedPD ? `${pdRate}%` : "—", "heart", "stat-icon--oxblood"),
        kpi("Calvings Recorded", String(calv.length), "baby", ""),
        kpi("Avg Calving Interval", avgCalvingInterval ? `${avgCalvingInterval}d` : "—", "calendar", "stat-icon--wheat"),
        kpi("Pending Calvings", String(board.length), "pregnancy", "stat-icon--danger"),
      ]),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Pregnancy checks"),
          bar("Positive", `${posPreg}`, decidedPD ? pct(posPreg, decidedPD) : 0, "var(--color-success-600)"),
          bar("Negative", `${negPreg}`, decidedPD ? pct(negPreg, decidedPD) : 0, "var(--color-danger-500)"),
          bar("Pending / Recheck", `${preg.length - decidedPD}`, pct(preg.length - decidedPD, preg.length || 1), "var(--color-wheat-600)"),
        ]),
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Breeding activity"),
          bar("Heats observed", `${heats.length}`, pct(heats.length, Math.max(heats.length, 10)), "var(--color-danger-500)"),
          bar("Inseminations", `${insem.length}`, pct(insem.length, Math.max(insem.length, 10)), "var(--color-accent-600)"),
          bar("Adult females", `${adultFemales.length}`, pct(adultFemales.length, Math.max(active.length, 1)), "var(--color-ink-500)"),
        ]),
      ]),
    ]));

    /* ---------- Health ---------- */
    page.appendChild(JF.Utils.el("div", { class: "section" }, [
      sectionHeader("🩺 HEALTH", "Health & Prevention", "Treatment load and preventive-care coverage across the adult herd.", "health", "stat-icon--danger"),
      JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        kpi("Open Treatment Cases", String(openCases), "warning", "stat-icon--warning"),
        kpi("Recovered", String(recovered), "health", "stat-icon--wheat"),
        kpi("Vaccinations (12 mo)", String(recentVax), "syringe", ""),
        kpi("Dewormings (12 mo)", String(recentDews), "drop", "stat-icon--oxblood"),
      ]),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Treatment outcomes"),
          bar("Recovered", `${recovered}`, pct(recovered, healths.length || 1), "var(--color-success-600)"),
          bar("Still open", `${openCases}`, pct(openCases, healths.length || 1), "var(--color-danger-500)"),
        ]),
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Preventive coverage (12 mo)"),
          bar("Herd dewormed", `${recentDews} / ${adultFemales.length}`, dewormCompliance, "var(--color-accent-600)"),
          bar("Vaccination events", `${recentVax}`, Math.min(100, recentVax * 5), "var(--color-success-600)"),
        ]),
      ]),
    ]));

    /* ---------- Economics ---------- */
    page.appendChild(JF.Utils.el("div", { class: "section" }, [
      sectionHeader("💰 ECONOMICS", "Cost & Economics", "Where the money goes, and which animals are eating it in medical costs.", "finance", ""),
      JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        kpi("Total Expense (posted)", money(totalExpense), "finance", ""),
        kpi("Cattle Income (posted)", money(totalIncome), "money", "stat-icon--wheat"),
        kpi("Medical Spend", money(medicalSpend), "health", "stat-icon--danger"),
        kpi("Animals on Cost-Watch", String(costWatch.length), "warning", "stat-icon--warning"),
      ]),
      medRows.length ? JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)" } }, [
        JF.Utils.el("div", { class: "table-container" }, JF.Utils.el("table", { class: "table" }, [
          JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["Animal", "Lactation #", "Medical 12 mo", "Medical lifetime", "Verdict"].map((h) => JF.Utils.el("th", {}, h)))),
          JF.Utils.el("tbody", {}, medRows.slice(0, 8).map(({ animal, lc }) => JF.Utils.el("tr", { onclick: () => JF.App.navigate(`#animal/${animal.AnimalID}/expenses`), style: { cursor: "pointer" } }, [
            JF.Utils.el("td", {}, [JF.Utils.el("strong", {}, animal.Name || animal.AnimalID), JF.Utils.el("div", { class: "field__hint" }, animal.AnimalID)]),
            JF.Utils.el("td", {}, `#${lc.lactationNo || 0}`),
            JF.Utils.el("td", { html: `<strong>${money(lc.medical.last12m)}</strong>` }),
            JF.Utils.el("td", {}, money(lc.medical.total)),
            JF.Utils.el("td", { html: `<span class="badge ${lc.verdict === "cost-watch" ? "badge--danger" : lc.verdict === "watch" ? "badge--warning" : "badge--success"}">${lc.verdict === "cost-watch" ? "Cost watch" : lc.verdict === "watch" ? "Watch" : "OK"}</span>` }),
          ]))),
        ])),
      ]) : JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-5)" } },
        "No medical costs recorded yet — treatments, dewormers, vaccines and medical expenses will rank animals here."),
    ]));

    /* ---------- Herd ---------- */
    page.appendChild(JF.Utils.el("div", { class: "section" }, [
      sectionHeader("🐄 HERD", "Herd Composition", "Live counts by status — click any status to see those animals.", "animals", ""),
      JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        kpi("Active Animals", String(active.length), "animals", ""),
        kpi("Lactating", String(byStatus("Lactating")), "baby2", "stat-icon--oxblood"),
        kpi("Pregnant", String(byStatus("Pregnant")), "pregnancy", "stat-icon--danger"),
        kpi("Dry", String(byStatus("Dry")), "drop", "stat-icon--wheat"),
      ]),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Status breakdown"),
          ...["Lactating", "Pregnant", "Open", "In Heat", "Dry", "Heifer", "Calf", "Under Treatment"].map((s) =>
            bar(s, `${byStatus(s)}`, pct(byStatus(s), active.length || 1), "var(--color-accent-600)")),
        ]),
        JF.Utils.el("div", { class: "card", style: "padding:20px" }, [
          JF.Utils.el("h3", { style: "font-size:16px;margin-bottom:16px" }, "Attention needed"),
          bar("Overdue reminders", `${overdue}`, Math.min(100, overdue * 10), "var(--color-danger-500)"),
          bar("Open treatment cases", `${openCases}`, Math.min(100, openCases * 10), "var(--color-warning-500)"),
          bar("Calvings due ≤ 7 days", `${board.filter((r) => r.daysTo <= 7).length}`, Math.min(100, board.filter((r) => r.daysTo <= 7).length * 20), "var(--color-oxblood-600)"),
        ]),
      ]),
    ]));

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Settings = (function () {
  const $ = () => document.getElementById("view-container");
  const SUB = {
    general:    { label: "General & Backend", icon: "settings" },
    repro:      { label: "Reproduction",      icon: "heart" },
    health:     { label: "Health Protocols",  icon: "health" },
    accounting: { label: "Accounting",        icon: "finance" },
  };

  const subNav = (active = "general") => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)" } });
    Object.entries(SUB).forEach(([k, v]) => {
      const a = JF.Utils.el("a", {
        class: `tab ${active === k ? "is-active" : ""}`,
        href: `#settings/${k}`,
        html: `<span style="display:inline-flex;align-items:center;gap:6px;">${JF.Utils.svgIcon(v.icon, 14, 14)} ${v.label}</span>`,
      });
      row.appendChild(a);
    });
    return row;
  };

  const fieldGroup = (eyebrow, title, fields) => JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)" } }, [
    JF.Utils.el("div", { class: "card__header" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "card__eyebrow" }, eyebrow),
        JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } }, title),
      ]),
    ]),
    JF.Utils.el("div", { class: "divider" }),
    JF.Utils.el("div", { class: "form-stack", style: { padding: "var(--space-4)" } }, fields),
  ]);

  /* ---------- Semen / technician availability editor ---------- */
  // Stored in the data store (MongoDB when connected) via the settings
  // entity, so the Heat Detective reads the same log on every device.
  const availabilityEditor = () => {
    const readAll = async () => { try { return JSON.parse(await JF.Store.settings.get("availability_log")?.value || "[]"); } catch (e) { return []; } };
    const writeAll = async (rows) => { await JF.Store.settings.set("availability_log", JSON.stringify(rows)); };
    const wrap = JF.Utils.el("div", { class: "avail-editor" });
    const redraw = async () => {
      JF.Utils.clear(wrap);
      const rows = await readAll();
      rows.forEach((r, i) => {
        wrap.appendChild(JF.Utils.el("div", { class: "avail-row" }, [
          JF.Utils.el("span", { class: `badge ${r.available ? "badge--success" : "badge--warning"}` }, r.type === "semen" ? "SEMEN" : "TECH"),
          JF.Utils.el("span", {}, `${r.available ? "Available" : "Unavailable"} · ${r.from || "?"} → ${r.to || "?"}`),
          JF.Utils.el("span", { class: "table__cell--muted", style: { flex: 1 } }, r.note || ""),
          JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: async () => { rows.splice(i, 1); await writeAll(rows); redraw(); } }, "Remove"),
        ]));
      });
      if (!rows.length) wrap.appendChild(JF.Utils.el("div", { class: "field__hint" }, "No availability gaps logged yet."));
    };
    const add = async () => {
      const type = document.getElementById("avail-type")?.value || "semen";
      const from = document.getElementById("avail-from")?.value;
      const to = document.getElementById("avail-to")?.value;
      const note = document.getElementById("avail-note")?.value?.trim() || "";
      if (!from || !to) { JF.Toast.show("Pick from and to dates first.", "warning"); return; }
      const rows = await readAll();
      rows.push({ type, available: document.getElementById("avail-state")?.value !== "no", from, to, note });
      await writeAll(rows); await redraw(); JF.Toast.show("Availability window logged.", "success");
    };
    const row = JF.Utils.el("div", { class: "avail-add" }, [
      JF.Utils.el("select", { class: "select", id: "avail-type" }, [
        JF.Utils.el("option", { value: "semen" }, "Semen stock"),
        JF.Utils.el("option", { value: "technician" }, "AI technician"),
      ]),
      JF.Utils.el("select", { class: "select", id: "avail-state" }, [
        JF.Utils.el("option", { value: "no" }, "Unavailable"),
        JF.Utils.el("option", { value: "yes" }, "Available"),
      ]),
      JF.Utils.el("input", { class: "input", type: "date", id: "avail-from" }),
      JF.Utils.el("input", { class: "input", type: "date", id: "avail-to" }),
      JF.Utils.el("input", { class: "input", id: "avail-note", placeholder: "Note (e.g. liquid N2 cylinder empty)" }),
      JF.Utils.el("button", { class: "btn btn--primary btn--sm", onclick: add }, "Add"),
    ]);
    redraw();
    return JF.Utils.el("div", {}, [row, wrap]);
  };

  const renderGeneral = (settingsMap) => {
    const currentBackend = JF.Store.getConfig("backend") || "mock";
    const currentEndpoint = JF.Store.getConfig("api_endpoint") || "";

    const backendSelect = JF.Utils.el("select", { class: "input", id: "cfg-backend" }, [
      JF.Utils.el("option", { value: "mock", selected: currentBackend === "mock" }, "This Device (LocalStorage - Offline Mode)"),
      JF.Utils.el("option", { value: "mongo", selected: currentBackend === "mongo" }, "MongoDB Farm API (Node.js server)"),
    ]);

    const endpointInput = JF.Utils.el("input", {
      class: "input",
      id: "cfg-api-endpoint",
      type: "url",
      placeholder: "https://jagt-farm-api.onrender.com",
      value: currentEndpoint
    });

    // Farm API token (MONGO_TOKEN set in Render) - stored separately from the URL.
    const tokenInput = JF.Utils.el("input", {
      class: "input",
      id: "cfg-api-token",
      type: "text",
      placeholder: "The MONGO_TOKEN value from Render (leave empty if none)",
      value: (() => { try { return localStorage.getItem("jf_api_token") || ""; } catch (e) { return ""; } })(),
      autocomplete: "off"
    });

    const livePill = JF.PhotoUpload.backendLive()
      ? JF.Utils.el("span", { class: "badge badge--success", style: "margin-left:8px" }, "LIVE - photos upload to the server")
      : JF.Utils.el("span", { class: "badge badge--info", style: "margin-left:8px" }, "Offline mode - photos stay on device");

    const statusBadge = JF.Utils.el("div", { id: "api-status", style: "margin-top:8px;font-size:var(--fs-sm);color:var(--color-ink-500)" });

    const testBtn = JF.Utils.el("button", {
      class: "btn btn--ghost btn--sm",
      type: "button",
      onclick: async () => {
        statusBadge.textContent = "⏳ Testing connection...";
        statusBadge.style.color = "var(--color-ink-500)";
        const url = endpointInput.value.trim();
        if (!url) {
          statusBadge.textContent = "❌ Please enter your farm API URL first (e.g. https://jagt-farm-api.onrender.com).";
          statusBadge.style.color = "var(--color-oxblood-700)";
          return;
        }
        try {
          const adapter = new JF.Data.MongoApiAdapter();
          adapter.configure({ endpoint: url, token: tokenInput.value.trim() });
          const ping = await adapter.testConnection();
          statusBadge.textContent = `✅ Connection Successful! MongoDB: ${ping?.database || "connected"}`;
          statusBadge.style.color = "var(--color-success-700)";
          JF.Toast?.show("Connected to the MongoDB farm API!", "success");
        } catch (err) {
          statusBadge.textContent = `❌ Connection failed: ${err.message}`;
          statusBadge.style.whiteSpace = "pre-line";
          statusBadge.style.color = "var(--color-oxblood-700)";
          JF.Toast?.show("Could not connect to the farm API URL.", "danger");
        }
      }
    }, "⚡ Test Connection");

    // Uploads THIS device's real records (never demo data) into MongoDB.
    const uploadLocalBtn = JF.Utils.el("button", {
      class: "btn btn--accent btn--sm",
      type: "button",
      onclick: async () => {
        const url = endpointInput.value.trim();
        if (!url) {
          JF.Toast?.show("Paste your farm API URL first.", "danger");
          return;
        }
        if (!confirm("Copy every record stored on this device into MongoDB?\n\nExisting records with the same id are kept as-is; nothing is deleted.")) return;
        statusBadge.textContent = "⏳ Reading this device's records...";
        statusBadge.style.color = "var(--color-ink-500)";
        try {
          const local = new JF.Data.MockAdapter();
          const dump = {};
          let total = 0;
          for (const entity of JF.Data.DataAdapter.entities) {
            const rows = await local.list(entity);
            if (rows.length) { dump[entity] = rows; total += rows.length; }
          }
          if (!total) { statusBadge.textContent = "This device has no records to upload yet."; return; }
          statusBadge.textContent = `⏳ Uploading ${total} records across ${Object.keys(dump).length} collections...`;
          const adapter = new JF.Data.MongoApiAdapter();
          adapter.configure({ endpoint: url, token: tokenInput.value.trim() });
          const res = await adapter.seed(dump);
          statusBadge.textContent = `✅ Uploaded ${res?.imported ?? total} records to MongoDB.`;
          statusBadge.style.color = "var(--color-success-700)";
          JF.Toast?.show("Farm data uploaded to MongoDB.", "success");
        } catch (err) {
          statusBadge.textContent = `❌ Upload failed: ${err.message}`;
          statusBadge.style.color = "var(--color-oxblood-700)";
        }
      }
    }, "📤 Upload This Device's Data to MongoDB");

    const verifyBtn = JF.Utils.el("button", {
      class: "btn btn--primary btn--sm",
      type: "button",
      onclick: async () => {
        const url = endpointInput.value.trim();
        if (!url) { JF.Toast?.show("Paste your farm API URL first.", "danger"); return; }
        statusBadge.textContent = "⏳ Checking MongoDB collections and a real write round trip...";
        statusBadge.style.color = "var(--color-ink-500)";
        try {
          const adapter = new JF.Data.MongoApiAdapter();
          adapter.configure({ endpoint: url, token: tokenInput.value.trim() });
          const r = await adapter.verify();
          const lines = (r.checks || []).map((c) => `${c.ok ? "✅" : "❌"} <b>${c.check}</b> — ${c.detail}`);
          statusBadge.innerHTML = `${r.ok ? "✅ Everything is wired up" : "⚠️ Some checks failed"} (${r.elapsedMs} ms)<br>${lines.join("<br>")}`;
          statusBadge.style.color = r.ok ? "var(--color-success-700)" : "var(--color-oxblood-700)";
          JF.Toast?.show(r.ok ? "MongoDB API verified." : "Verification found problems - see details.", r.ok ? "success" : "warning");
        } catch (err) {
          statusBadge.textContent = `❌ Verification failed: ${err.message}`;
          statusBadge.style.color = "var(--color-oxblood-700)";
        }
      }
    }, "🩺 Verify MongoDB API");

    const demoBtn = JF.Utils.el("button", {
      class: "btn btn--ghost btn--sm",
      type: "button",
      onclick: async () => {
        if (!confirm("Replace current data with the full demo farm (23 animals with sample history)?")) return;
        JF.Store.setConfig("demo_data", "1");
        JF.Store.forceReseed();
        setTimeout(() => location.reload(), 100);
      }
    }, "Load Demo Farm Data");

    return [
      fieldGroup("📊 ACTIVE BACKEND & MONGODB INTEGRATION", "Database & Storage Configuration", [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Active Data Store"),
          backendSelect,
          JF.Utils.el("div", { class: "field__hint" }, "Choose whether the app runs offline on this device, or syncs live to your MongoDB database through the farm's Node.js API (hosted on Render)."),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Farm API Token"),
          tokenInput,
          JF.Utils.el("div", { class: "field__hint" }, "The MONGO_TOKEN value from Render > your service > Environment. Copy it exactly (use Render's copy icon). It is the password that lets this device use the API."),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Farm API URL (Node.js + MongoDB)"),
          endpointInput,
          livePill,
          JF.Utils.el("div", { class: "field__hint" }, "Deploy the server/ folder to Render and paste its URL here (e.g. https://jagt-farm-api.onrender.com). When live, entries save to MongoDB and animal photos upload straight to the server."),
          statusBadge
        ]),
        JF.Utils.el("div", { style: "display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;" }, [
          testBtn,
          verifyBtn,
        ]),
        JF.Utils.el("div", { style: "display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;" }, [
          uploadLocalBtn,
          demoBtn
        ]),
        JF.Utils.el("div", { class: "field__hint", style: "margin-top:10px" },
          "🔒 Data safety: there is no one-click erase in the app by design - your records belong in MongoDB (Atlas keeps continuous backups). Load Demo Farm replaces this device's data with the sample farm (it asks first)."),
        JF.Utils.el("div", { class: "field__hint", style: "margin-top:10px;color:var(--color-success-700)" },
          "💡 EVERYTHING LIVES IN MONGODB: farm data (animals, milk, expenses, photos) and the rulebook (Rules, Rule_Parameters, Rule_Overrides) are all stored in your MongoDB database. Edit rules on the Rules screen - changes save straight to the database and apply on every device."),
      ]),
      fieldGroup("🏠 FARM INFORMATION", "Farm & System Defaults", [
        JF.Utils.el("div", { class: "grid grid--cols-2" }, [
          JF.Utils.el("div", { class: "field" }, [
            JF.Utils.el("label", { class: "field__label" }, "Farm Name"),
            JF.Utils.el("input", { class: "input", id: "cfg-farm-name", value: settingsMap["farm_name"] || "Jagt Farm" }),
          ]),
          JF.Utils.el("div", { class: "field" }, [
            JF.Utils.el("label", { class: "field__label" }, "Currency Symbol"),
            JF.Utils.el("input", { class: "input", id: "cfg-currency", value: settingsMap["currency"] || "₹" }),
          ]),
        ])
      ])
    ];
  };

  const renderRepro = (settingsMap) => [
    fieldGroup("🕵 LOGISTICS AVAILABILITY", "Semen & Technician Availability Log", [
      JF.Utils.el("div", { class: "field__hint", style: { marginBottom: "var(--space-3)" } },
        "Log when semen or the AI technician was unavailable. The Heat Detective overlays these gaps on the biology timeline so you can see which heats were missed for farm reasons, not biology."),
      availabilityEditor(),
    ]),
    fieldGroup("🔄 HEAT CYCLE PARAMETERS", "Smart Heat & Gestation Intervals", [
      JF.Utils.el("div", { class: "grid grid--cols-3" }, [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Expected Cycle Length (Days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-expected-cycle", value: settingsMap["ExpectedCycleLength"] || "21" }),
          JF.Utils.el("div", { class: "field__hint" }, "Standard cattle heat cycle (default 21 days)"),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Minimum Cycle Length (Days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-min-cycle", value: settingsMap["MinimumCycleLength"] || "18" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Maximum Cycle Length (Days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-max-cycle", value: settingsMap["MaximumCycleLength"] || "24" }),
        ]),
      ]),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Heat Reminder Lead Time (Days Before)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-heat-lead", value: settingsMap["ReminderDaysBefore"] || "3" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Gestation Period (Days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-gestation", value: settingsMap["GestationDays"] || "283" }),
        ]),
      ])
    ])
  ];

  const renderHealth = (settingsMap) => [
    fieldGroup("🩺 PREVENTATIVE PROTOCOLS", "Deworming & Vaccination Intervals", [
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Standard Deworming Interval (Days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-deworm-int", value: settingsMap["DewormingIntervalDays"] || "90" }),
          JF.Utils.el("div", { class: "field__hint" }, "Default interval between routine dewormings (default 90 days)"),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Deworming Reminder Lead (Days Before)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-deworm-lead", value: settingsMap["DewormingReminderBefore"] || "7" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Vaccination Reminder Lead (Days Before)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-vax-lead", value: settingsMap["VaccinationReminderBefore"] || "7" }),
        ]),
      ]),
    ]),
    fieldGroup("BABY CALF CARE PLAN", "Automatic Reminders for Young Calves", [
      JF.Utils.el("div", { class: "field__hint", style: { marginBottom: "var(--space-3)" } },
        "When a calf is born (or you record its birth), these reminders are created automatically and tick themselves off as you record each dewormer or vaccine."),
      JF.Utils.el("div", { class: "grid grid--cols-3" }, [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "First dewormer (age in days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-deworm1", value: settingsMap["CalfFirstDewormAgeDays"] || "14" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Second dewormer (age in days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-deworm2", value: settingsMap["CalfSecondDewormAgeDays"] || "45" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Remind me before (days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-lead", value: settingsMap["CalfCareRemindLeadDays"] || "7" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "FMD vaccine (age in days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-fmd", value: settingsMap["CalfFMDAgeDays"] || "90" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Brucellosis - females (age in days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-bruc", value: settingsMap["CalfBrucellaAgeDays"] || "150" }),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "BQ & HS vaccines (age in days)"),
          JF.Utils.el("input", { class: "input", type: "number", id: "cfg-calf-bq", value: settingsMap["CalfBQAgeDays"] || "180" }),
        ]),
      ]),
    ])
  ];

  const renderAccounting = (settingsMap) => [
    fieldGroup("💰 FINANCIAL CONFIGURATION", "Accounting Preferences", [
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Financial Year Start Month"),
          JF.Utils.el("select", { class: "input", id: "cfg-fy-start" }, [
            JF.Utils.el("option", { value: "April", selected: (settingsMap["fy_start"] || "April") === "April" }, "April (FY Apr-Mar)"),
            JF.Utils.el("option", { value: "January", selected: settingsMap["fy_start"] === "January" }, "January (Calendar Year)"),
          ]),
        ]),
        JF.Utils.el("div", { class: "field" }, [
          JF.Utils.el("label", { class: "field__label" }, "Default Payment Account"),
          JF.Utils.el("select", { class: "input", id: "cfg-default-pay" }, [
            JF.Utils.el("option", { value: "Cash" }, "Cash Account"),
            JF.Utils.el("option", { value: "Bank" }, "Bank Account"),
          ]),
        ]),
      ])
    ])
  ];

  const saveSettings = async () => {
    try {
      const bSel = document.getElementById("cfg-backend");
      const urlIn = document.getElementById("cfg-api-endpoint");
      if (bSel) {
        const backendVal = bSel.value;
        JF.Store.setConfig("backend", backendVal);
        JF.Store.setBackend(backendVal);
      }
      if (urlIn) {
        const urlVal = urlIn.value.trim();
        JF.Store.setConfig("api_endpoint", urlVal);
        const tokIn = document.getElementById("cfg-api-token");
        const tokVal = tokIn ? tokIn.value.trim() : "";
        try { localStorage.setItem("jf_api_token", tokVal); } catch (e) {}
        const ad = JF.Store.getAdapter();
        if (ad && ad.configure) ad.configure({ endpoint: urlVal, token: tokVal });
      }

      const pairs = [
        ["farm_name", document.getElementById("cfg-farm-name")?.value],
        ["currency", document.getElementById("cfg-currency")?.value],
        ["ExpectedCycleLength", document.getElementById("cfg-expected-cycle")?.value],
        ["MinimumCycleLength", document.getElementById("cfg-min-cycle")?.value],
        ["MaximumCycleLength", document.getElementById("cfg-max-cycle")?.value],
        ["ReminderDaysBefore", document.getElementById("cfg-heat-lead")?.value],
        ["GestationDays", document.getElementById("cfg-gestation")?.value],
        ["DewormingIntervalDays", document.getElementById("cfg-deworm-int")?.value],
        ["DewormingReminderBefore", document.getElementById("cfg-deworm-lead")?.value],
        ["VaccinationReminderBefore", document.getElementById("cfg-vax-lead")?.value],
        ["CalfFirstDewormAgeDays", document.getElementById("cfg-calf-deworm1")?.value],
        ["CalfSecondDewormAgeDays", document.getElementById("cfg-calf-deworm2")?.value],
        ["CalfCareRemindLeadDays", document.getElementById("cfg-calf-lead")?.value],
        ["CalfFMDAgeDays", document.getElementById("cfg-calf-fmd")?.value],
        ["CalfBrucellaAgeDays", document.getElementById("cfg-calf-bruc")?.value],
        ["CalfBQAgeDays", document.getElementById("cfg-calf-bq")?.value],
      ];

      for (const [k, v] of pairs) {
        if (v !== undefined && v !== null) {
          await JF.Store.settings.set(k, v);
        }
      }

      JF.Toast?.show("Settings saved successfully!", "success");
    } catch (e) {
      console.error(e);
      JF.Toast?.show("Error saving settings", "danger");
    }
  };

  const render = async (path = "") => {
    const root = $();
    const sub = path?.[1] || "general";
    JF.Utils.clear(root);

    let settingsMap = {};
    try {
      settingsMap = await JF.Store.settings.allMap();
    } catch (e) { console.warn(e); }

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "⚙️ System Configuration"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "General"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Configure heat cycle parameters, health protocols, accounting settings, and backend database connections."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", {
          class: "btn btn--primary btn--sm",
          onclick: saveSettings
        }, "Save Settings"),
      ]),
    ]));

    page.appendChild(subNav(sub));

    let content = [];
    if (sub === "repro") content = renderRepro(settingsMap);
    else if (sub === "health") content = renderHealth(settingsMap);
    else if (sub === "accounting") content = renderAccounting(settingsMap);
    else content = renderGeneral(settingsMap);

    content.forEach(el => page.appendChild(el));
    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Rules = (function () {
  const $ = () => document.getElementById("view-container");

  const SUB = {
    overview:   { label: "Rule Engine",        icon: "analytics" },
    rules:      { label: "Rules",              icon: "treatment" },
    parameters: { label: "Parameters",         icon: "settings" },
    overrides:  { label: "Animal Overrides",   icon: "heart" },
    quality:    { label: "Data Quality",       icon: "health" },
  };

  const subNav = (active) => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)" } });
    Object.entries(SUB).forEach(([id, meta]) => {
      row.appendChild(JF.Utils.el("a", {
        class: `tab ${id === active ? "is-active" : ""}`,
        href: `#rules/${id}`,
        html: `<span style="display:inline-flex;align-items:center;gap:6px;">${JF.Utils.svgIcon(meta.icon, 14, 14)} ${meta.label}</span>`,
      }));
    });
    return row;
  };

  // Same card markup as the rest of the app so it styles and stacks correctly.
  const stat = (label, value, tone = "") => JF.Utils.el("div", { class: "card card--stat" }, [
    JF.Utils.el("div", { class: `stat-icon ${tone}` , html: JF.Utils.svgIcon("analytics", 20, 20) }),
    JF.Utils.el("div", {}, [
      JF.Utils.el("div", { class: "stat-number" }, String(value)),
      JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
    ]),
  ]);

  const msg = (div, text, tone) => { div.textContent = text; div.style.color = tone === "error" ? "var(--color-oxblood-700)" : "var(--color-success-700)"; };

  /* ------------------------------- overview ------------------------------- */

  const renderOverview = async () => {
    const s = JF.RuleEngine.stats();
    const wrap = JF.Utils.el("div", {});
    const status = JF.Utils.el("div", { class: "field__hint", style: "margin:10px 0" });

    wrap.appendChild(JF.Utils.el("div", { class: "grid grid--cols-4", style: "gap:12px" }, [
      stat("RULES", s.total),
      stat("ACTIVE", s.active, "stat-icon--success"),
      stat("PARAMETERS", s.params),
      stat("ANIMAL OVERRIDES", s.overrides),
    ]));

    wrap.appendChild(JF.Utils.el("div", { class: "card", style: "margin-top:16px" }, [
      JF.Utils.el("h3", { style: "margin:0 0 6px" }, "How this drives the farm"),
      JF.Utils.el("p", { class: "field__hint", style: "margin:0" },
        "Entries are saved to the farm database (MongoDB through the farm API, or this device) → active rules are matched against the animal and its records → Rule_Parameters and any animal Rule_Overrides decide the real value → the engine produces reminders, calculations and alerts → they appear on the dashboard, the reminders list and the animal's timeline. Change a value in the rulebook — on this screen or in the database — and the website follows, with no code change."),
      JF.Utils.el("div", { class: "field__hint", style: "margin-top:8px" },
        `Value layering: rule default < farm parameter < animal override.  Currently reading from: ${s.source}.`),
    ]));

    const run = (btn, fn) => async () => {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = "Working...";
      try { await fn(); } catch (e) { msg(status, e.message, "error"); }
      btn.disabled = false; btn.textContent = original;
    };

    // Persistence card: shows where the config is saved and lets the user push
    // this device's configuration into the rulebook home explicitly.
    const mirrorLine = JF.Utils.el("p", { class: "field__hint", style: "margin:0", id: "rules-mirror-status" }, "Checking where your rules are saved...");
    const pushBtn = JF.Utils.el("button", { class: "btn btn--accent btn--sm", type: "button" }, "⬆️ Push rules to the rulebook home");
    pushBtn.onclick = run(pushBtn, async () => {
      const r = await JF.RuleEngine.syncFromMirror();
      msg(status, `Pushed your rule configuration to the rulebook home (~${r.rules} rule row(s), ~${r.params} parameter row(s) written). Every device loads these on next load.`);
      JF.Toast.show("Rule configuration pushed to the rulebook home.", "success");
      render(["overview"]);
    });
    wrap.appendChild(JF.Utils.el("div", { class: "card", style: "margin-top:16px" }, [
      JF.Utils.el("h3", { style: "margin:0 0 6px" }, "💾 Where your rules are saved"),
      JF.Utils.el("p", { class: "field__hint", style: "margin:0" },
        "MONGODB SETUP: your farm DATA (animals, milk, expenses...) AND the RULES (Rules / Rule_Parameters / Rule_Overrides) all live in your MongoDB database. Every toggle, lead time, parameter and override you change here is written straight into the database, and edits made on another device appear here on the next visit to this tab. Offline? The rules then live on this device like before."),
      mirrorLine,
      JF.Utils.el("div", { style: "margin-top:10px" }, [pushBtn]),
    ]));

    // No-backend fallback: export the whole rulebook as tab-separated text so the
    // owner can review/hold it anywhere. The database stays the live source.
    const tsvLine = JF.Utils.el("p", { class: "field__hint", style: "margin:6px 0 0", id: "rules-tsv-status" });
    const tsvBtn = JF.Utils.el("button", { class: "btn btn--ghost btn--sm", type: "button" }, "📋 Copy rulebook (TSV)");
    tsvBtn.onclick = run(tsvBtn, async () => {
      const book = JF.RuleBook.seedPayload();
      const esc = (v) => {
        const s = v === null || v === undefined ? "" : String(v);
        const Q = String.fromCharCode(34);
        const bad = [String.fromCharCode(9), String.fromCharCode(10), String.fromCharCode(13), Q];
        const needs = bad.some((c) => s.indexOf(c) !== -1);
        return needs ? Q + s.split(Q).join(Q + Q) + Q : s;
      };
      const row = (headers, obj) => headers.map((h) => esc(obj[h])).join("\t");
      const rulesH = ["RuleID", "Active", "Category", "RuleName", "AppliesTo", "TriggerEvent", "Condition", "StartAfter", "EndAfter", "Interval", "ReminderBefore", "ActionType", "Action", "Priority", "DataRequired", "DefaultValue", "Unit", "ParamID", "SourceType", "Source", "Configurable", "VetOverride", "Notes"];
      const paramsH = ["ParameterID", "Parameter", "Value", "Unit", "Active", "Notes"];
      const rulesTsv = [rulesH.join("\t"), ...book.rules.map((r) => row(rulesH, r))].join("\n");
      const paramsTsv = [paramsH.join("\t"), ...(book.ruleParameters || book.params || []).map((p) => row(paramsH, p))].join("\n");
      const clip = ["=== Rules ===", rulesTsv, "", "=== Rule_Parameters ===", paramsTsv, "",
        "=== How to use ===",
        "This copy is for review or backup: paste into any spreadsheet to audit the rulebook.",
        "The live source of truth is the MongoDB rulebook collections (or this device in offline mode).",
      ].join("\n");
      try { await navigator.clipboard.writeText(clip); } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = clip; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e2) { /* clipboard blocked */ }
        document.body.removeChild(ta);
      }
      msg(tsvLine, "Copied the whole rulebook (85 rules + parameters) as spreadsheet text - paste anywhere to review or keep a backup.");
      JF.Toast.show("Rulebook copied to clipboard.", "success");
    });
    wrap.appendChild(JF.Utils.el("div", { class: "card", style: "margin-top:16px" }, [
      JF.Utils.el("h3", { style: "margin:0 0 6px" }, "📄 Export the rulebook"),
      JF.Utils.el("p", { class: "field__hint", style: "margin:0" },
        "Copy the complete rulebook (rules, parameters) as tab-separated text - open any spreadsheet and paste to review, print or back it up. The live source of truth is the MongoDB rulebook collections (or this device offline)."),
      JF.Utils.el("div", { style: "margin-top:10px" }, [tsvBtn]),
      tsvLine,
    ]));

    const installBtn = JF.Utils.el("button", { class: "btn btn--accent btn--sm", type: "button" }, "Install default rulebook");
    installBtn.onclick = run(installBtn, async () => {
      const res = await JF.RuleEngine.installDefaults();
      msg(status, `Installed ${res.rules} new rule(s) and ${res.params} parameter(s). Existing edits left untouched.`);
      render(["rules"]);
    });

    const reloadBtn = JF.Utils.el("button", { class: "btn btn--ghost btn--sm", type: "button" }, "🔄 Reload from Database");
    reloadBtn.onclick = run(reloadBtn, async () => {
      const r = await JF.RuleEngine.load();
      msg(status, `Loaded ${r.rules} rules, ${r.params} parameters, ${r.overrides} overrides from ${r.source}.`);
      render(["overview"]);
    });

    const evalBtn = JF.Utils.el("button", { class: "btn btn--primary btn--sm", type: "button" }, "Re-evaluate all animals");
    evalBtn.onclick = run(evalBtn, async () => {
      const r = await JF.RuleEngine.evaluateAll();
      msg(status, `${r.animals} animals evaluated — ${r.created} new, ${r.updated} recalculated, ${r.completed} completed.`);
      render(["overview"]);
    });

    const rebuildBtn = JF.Utils.el("button", { class: "btn btn--danger btn--sm", type: "button" }, "Rebuild reminders from entries");
    rebuildBtn.onclick = run(rebuildBtn, async () => {
      if (!confirm("Delete every existing reminder and regenerate them from the entries on file?\n\nThis removes manual reminders too.")) return;
      const r = await JF.RuleEngine.rebuild();
      msg(status, `Deleted ${r.removed} old reminder(s) and regenerated ${r.created} from ${r.animals} animals' entries.`);
      render(["overview"]);
    });

    wrap.appendChild(JF.Utils.el("div", { style: "display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" }, [installBtn, reloadBtn, evalBtn, rebuildBtn]));
    wrap.appendChild(status);

    const cats = Object.entries(s.byCategory).sort((a, b) => b[1] - a[1]);
    wrap.appendChild(JF.Utils.el("div", { class: "card", style: "margin-top:16px" }, [
      JF.Utils.el("h3", { style: "margin:0 0 10px" }, "Rules by category"),
      JF.Utils.el("div", { style: "display:flex;gap:8px;flex-wrap:wrap" },
        cats.map(([c, n]) => JF.Utils.el("span", { class: "badge badge--info" }, `${c} · ${n}`))),
    ]));

    // Where do the rules live right now? (HYBRID: sheet when configured, else
    // the data backend; mock device store when nothing is connected.)
    try {
      const m = await JF.RuleEngine.mirrorStatus();
      if (mirrorLine) mirrorLine.textContent = m.home === "mongo"
        ? `MongoDB LIVE — farm data AND rules are stored in MongoDB (${m.rules} rule row(s), ${m.params} parameter row(s)). Edits here save straight to the database and apply on every device.`
        : `Offline/local mode — your edits persist on this device (${m.rules} rule row(s), ${m.params} parameter row(s)). Connect the MongoDB farm API in Settings to share them across devices.`;
    } catch (e) { if (mirrorLine) mirrorLine.textContent = ""; }
    return wrap;
  };

  /* -------------------------------- rules -------------------------------- */

  const renderRules = async () => {
    const wrap = JF.Utils.el("div", {});
    const all = JF.RuleEngine.listRules();
    let filter = "";
    const host = JF.Utils.el("div", {});

    const draw = () => {
      JF.Utils.clear(host);
      const rows = all.filter((r) => !filter || r.Category === filter);
      const byCat = {};
      rows.forEach((r) => { (byCat[r.Category || "Other"] ||= []).push(r); });
      Object.entries(byCat).forEach(([cat, list]) => {
        host.appendChild(JF.Utils.el("div", { class: "card", style: "margin-top:14px" }, [
          JF.Utils.el("h3", { style: "margin:0 0 8px" }, `${cat} (${list.length})`),
          JF.Utils.el("div", { class: "table-wrap" }, [
            JF.Utils.el("table", { class: "table" }, [
              JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["On", "Rule", "Trigger", "Value used", "Lead", "Priority", "Notes"].map((h) => JF.Utils.el("th", {}, h)))),
              JF.Utils.el("tbody", {}, list.map((r) => {
                const v = JF.RuleEngine.resolveValue(r.RuleID, "") || { value: r.DefaultValue, layer: "rule default", unit: r.Unit };
                const toggle = JF.Utils.el("input", { type: "checkbox", checked: r.Active });
                toggle.onchange = async () => {
                  await JF.RuleEngine.setRuleField(r.RuleID, "Active", toggle.checked);
                  JF.Toast.show(`${r.RuleID} ${toggle.checked ? "enabled" : "disabled"}.`, "success");
                };
                const lead = JF.Utils.el("input", { class: "input", type: "number", value: r.ReminderBefore, style: "width:72px" });
                lead.onchange = async () => { await JF.RuleEngine.setRuleField(r.RuleID, "ReminderBefore", Number(lead.value) || 0); JF.Toast.show(`${r.RuleID} lead time saved.`, "success"); };
                return JF.Utils.el("tr", { style: r.Active ? "" : "opacity:.55" }, [
                  JF.Utils.el("td", {}, toggle),
                  JF.Utils.el("td", {}, [JF.Utils.el("div", { style: "font-weight:600" }, r.RuleName), JF.Utils.el("div", { class: "field__hint" }, r.RuleID)]),
                  JF.Utils.el("td", {}, `${r.TriggerEvent} → ${r.AppliesTo}`),
                  JF.Utils.el("td", {}, [JF.Utils.el("div", {}, `${v.value} ${v.unit || r.Unit || ""}`), JF.Utils.el("div", { class: "field__hint" }, r.ParamID ? r.ParamID : "rule default")]),
                  JF.Utils.el("td", {}, lead),
                  JF.Utils.el("td", {}, JF.Utils.el("span", { class: `badge ${r.Priority === "Critical" ? "badge--danger" : r.Priority === "High" ? "badge--warning" : "badge--info"}` }, r.Priority || "Normal")),
                  JF.Utils.el("td", { style: "max-width:280px" }, r.Notes || r.Action || ""),
                ]);
              })),
            ]),
          ]),
        ]));
      });
      if (!host.children.length) host.appendChild(JF.Utils.el("p", { class: "field__hint" }, "No rules installed yet — press Install default rulebook on the overview tab."));
    };

    const cats = [...new Set(all.map((r) => r.Category))].sort();
    const select = JF.Utils.el("select", { class: "select", style: "max-width:240px" },
      [JF.Utils.el("option", { value: "" }, "All categories")].concat(cats.map((c) => JF.Utils.el("option", { value: c }, c))));
    select.onchange = () => { filter = select.value; draw(); };
    wrap.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [select]));
    wrap.appendChild(JF.Utils.el("p", { class: "field__hint" }, "Turn a rule off to stop it generating new reminders (history is kept). Lead time is the number of days before the due date that the reminder appears. Every toggle and lead time is saved into the rulebook home (Google Sheet tabs or database), so it survives refreshes and shows on your phone and PC alike."));
    wrap.appendChild(host);
    draw();
    return wrap;
  };

  /* ------------------------------ parameters ------------------------------ */

  const renderParameters = async () => {
    const wrap = JF.Utils.el("div", {});
    const list = JF.RuleEngine.listParams();
    const status = JF.Utils.el("div", { class: "field__hint", style: "margin:8px 0" });
    const table = JF.Utils.el("table", { class: "table" }, [
      JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["Parameter", "Value", "Unit", "Used by", "Notes"].map((h) => JF.Utils.el("th", {}, h)))),
      JF.Utils.el("tbody", {}, list.map((p) => {
        const input = JF.Utils.el("input", { class: "input", value: p.Value, style: "width:120px" });
        input.onchange = async () => {
          await JF.RuleEngine.setParamValue(p.ParameterID, input.value);
          msg(status, `${p.ParameterID} (${p.Parameter}) set to ${input.value} ${p.Unit}. New reminders of this type use it immediately.`);
        };
        const users = JF.RuleEngine.listRules().filter((r) => r.ParamID === p.ParameterID).map((r) => r.RuleID);
        return JF.Utils.el("tr", {}, [
          JF.Utils.el("td", {}, [JF.Utils.el("div", { style: "font-weight:600" }, p.Parameter), JF.Utils.el("div", { class: "field__hint" }, p.ParameterID)]),
          JF.Utils.el("td", {}, input),
          JF.Utils.el("td", {}, p.Unit || ""),
          JF.Utils.el("td", {}, users.length ? users.join(", ") : "—"),
          JF.Utils.el("td", { style: "max-width:320px" }, p.Notes || ""),
        ]);
      })),
    ]);
    wrap.appendChild(JF.Utils.el("p", { class: "field__hint" }, "These are the biological and farm-protocol values the rules read. Change 90 → 120 here (or directly in the Rule_Parameters tab of the Google Sheet) and every rule using it follows, with no code change."));
    wrap.appendChild(status);
    wrap.appendChild(JF.Utils.el("div", { class: "table-wrap" }, [table]));
    return wrap;
  };

  /* ------------------------------- overrides ------------------------------ */

  const renderOverrides = async () => {
    const wrap = JF.Utils.el("div", {});
    let rows = [];
    try { rows = await JF.Store.ruleOverrides.list(); } catch (e) { rows = []; }
    const status = JF.Utils.el("div", { class: "field__hint", style: "margin:8px 0" });

    const ruleSel = JF.Utils.el("select", { class: "select" }, JF.RuleEngine.listRules().map((r) => JF.Utils.el("option", { value: r.RuleID }, `${r.RuleID} — ${r.RuleName}`)));
    const animalIn = JF.Utils.el("input", { class: "input", placeholder: "e.g. COW-005" });
    const valueIn = JF.Utils.el("input", { class: "input", type: "number", placeholder: "60" });
    const reasonIn = JF.Utils.el("input", { class: "input", placeholder: "Vet protocol / special case" });
    const byIn = JF.Utils.el("input", { class: "input", placeholder: "Approved by (Dr ...)" });

    const addBtn = JF.Utils.el("button", { class: "btn btn--accent btn--sm", type: "button" }, "Add override");
    addBtn.onclick = async () => {
      if (!animalIn.value.trim() || valueIn.value === "") { msg(status, "Animal ID and value are required.", "error"); return; }
      await JF.RuleEngine.addOverride({
        RuleID: ruleSel.value, AnimalID: animalIn.value.trim(), Value: valueIn.value,
        Reason: reasonIn.value.trim(), ApprovedBy: byIn.value.trim(),
      });
      msg(status, `Override saved: ${ruleSel.value} for ${animalIn.value} = ${valueIn.value} days.`);
      render(["overrides"]);
    };

    wrap.appendChild(JF.Utils.el("p", { class: "field__hint" },
      "A vet's instruction for one animal does not belong in the master rule. Add it here and the engine uses it for that animal only (most specific layer wins)."));
    wrap.appendChild(JF.Utils.el("div", { class: "grid grid--cols-2", style: "gap:10px" }, [ruleSel, animalIn, valueIn, reasonIn, byIn]));
    wrap.appendChild(JF.Utils.el("div", { style: "margin-top:10px" }, [addBtn]));
    wrap.appendChild(status);

    const table = JF.Utils.el("table", { class: "table" }, [
      JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["Override", "Rule", "Animal", "Value", "Reason", "Approved by", ""].map((h) => JF.Utils.el("th", {}, h)))),
      JF.Utils.el("tbody", {}, rows.map((o) => JF.Utils.el("tr", {}, [
        JF.Utils.el("td", {}, o.OverrideID || o.id),
        JF.Utils.el("td", {}, o.RuleID),
        JF.Utils.el("td", {}, o.AnimalID || "all"),
        JF.Utils.el("td", {}, `${o.Value} ${o.Unit || ""}`),
        JF.Utils.el("td", {}, o.Reason || ""),
        JF.Utils.el("td", {}, o.ApprovedBy || ""),
        JF.Utils.el("td", {}, JF.Utils.el("button", {
          class: "btn btn--ghost btn--sm", type: "button",
          onclick: async () => { await JF.RuleEngine.removeOverride(o.id); JF.Toast.show("Override removed everywhere (app + sheet).", "success"); render(["overrides"]); },
        }, "Delete")),
      ]))),
    ]);
    wrap.appendChild(JF.Utils.el("div", { class: "table-wrap", style: "margin-top:14px" }, [table]));
    if (!rows.length) wrap.appendChild(JF.Utils.el("p", { class: "field__hint" }, "No overrides yet."));
    return wrap;
  };

  /* -------------------------------- quality ------------------------------- */

  const renderQuality = async () => {
    const wrap = JF.Utils.el("div", {});
    const issues = await JF.RuleEngine.dataQuality();
    if (!issues.length) {
      wrap.appendChild(JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("h3", { style: "margin:0 0 6px" }, "✅ No data-quality problems found"),
        JF.Utils.el("p", { class: "field__hint", style: "margin:0" }, "Every active CHECK rule passed against the records on file."),
      ]));
      return wrap;
    }
    const table = JF.Utils.el("table", { class: "table" }, [
      JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["Severity", "Rule", "Animal", "Problem"].map((h) => JF.Utils.el("th", {}, h)))),
      JF.Utils.el("tbody", {}, issues.map((i) => JF.Utils.el("tr", {}, [
        JF.Utils.el("td", {}, JF.Utils.el("span", { class: `badge ${i.severity === "Critical" ? "badge--danger" : i.severity === "High" ? "badge--warning" : "badge--info"}` }, i.severity || "Normal")),
        JF.Utils.el("td", {}, i.rule),
        JF.Utils.el("td", {}, i.animal === "—" ? "—" : JF.Utils.el("a", { href: `#animal/${i.animal}/overview` }, i.animal)),
        JF.Utils.el("td", {}, i.issue),
      ]))),
    ]);
    wrap.appendChild(JF.Utils.el("p", { class: "field__hint" }, `${issues.length} data-quality finding(s) from the active CHECK rules. These never block a save - they point at records that need completing.`));
    wrap.appendChild(JF.Utils.el("div", { class: "table-wrap" }, [table]));
    return wrap;
  };

  const render = async (path = []) => {
    const root = $();
    const sub = path?.[1] || "overview";
    JF.Utils.clear(root);
    await JF.RuleEngine.ensureLoaded();

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "🧠 Rule engine"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "Rule Engine"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "The farm's own rules, stored in your Google Sheet rulebook (or the database until a sheet is connected): entries are matched against them to produce reminders, calculations and alerts."),
      ]),
    ]));
    page.appendChild(subNav(sub));

    let body;
    if (sub === "rules") body = await renderRules();
    else if (sub === "parameters") body = await renderParameters();
    else if (sub === "overrides") body = await renderOverrides();
    else if (sub === "quality") body = await renderQuality();
    else body = await renderOverview();

    page.appendChild(body);
    root.appendChild(page);
  };

  return { render };
})();

</script>

  <script>
JF.App = (function () {
  const ROUTES = [
