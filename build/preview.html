    const open = bucketed.filter((r) => r.Status !== "Completed")
      .sort((a, b) => String(a.DueDate).localeCompare(String(b.DueDate)));

    // Count animals by category for donut + tiles
    const active = animals.filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus));
    const isCalf = (a) => (a.DateOfBirth ? JF.Utils.ageInYears(a.DateOfBirth) < 1 : a.CurrentStatus === "Calf");
    const cats = {
      lactating: active.filter((a) => a.CurrentStatus === "Lactating").length,
      calves: active.filter(isCalf).length,
      pregnant: active.filter((a) => a.CurrentStatus === "Pregnant").length,
      dry: active.filter((a) => a.CurrentStatus === "Dry").length,
      other: 0,
    };
    cats.other = Math.max(0, active.length - cats.lactating - cats.calves - cats.pregnant - cats.dry);

    /* ===== STAT TILES (6 across) ===== */
    const tileGrid = el("div", { style: "display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:var(--space-5)" });
    tileGrid.appendChild(statTile({ label: "Total Animals", value: active.length || data.total || 0, delta: "3", tone: "green", icon: "animals" }));
    tileGrid.appendChild(statTile({ label: "Lactating", value: active.length ? cats.lactating : "—", tone: "green", icon: "milk", onclick: () => JF.App.navigate("#animals") }));
    tileGrid.appendChild(statTile({ label: "Calves", value: cats.calves || data.calves || 0, tone: "gold", icon: "baby", onclick: () => JF.App.navigate("#calves") }));
    tileGrid.appendChild(statTile({ label: "Pregnant", value: cats.pregnant || data.pregnant || 0, tone: "pink", icon: "pregnancy", onclick: () => JF.App.navigate("#reproduction/pregnancy") }));
    tileGrid.appendChild(statTile({ label: "Dry", value: cats.dry || data.open || 0, tone: "gray", icon: "animals" }));
    // Today's milk
    let milkToday = 0;
    try {
      const milk = (await JF.Store.milkSales?.list()) || [];
      milkToday = milk.filter((m) => m.Date === t).reduce((s, m) => s + Number(m.Quantity || m.Litres || 0), 0);
      if (!milkToday) milkToday = milk.reduce((s, m) => s + Number(m.Quantity || m.Litres || 0), 0) ? Math.round(milk.reduce((s, m) => s + Number(m.Quantity || m.Litres || 0), 0) / Math.max(1, milk.length)) : 0;
    } catch (e) {}
    tileGrid.appendChild(statTile({ label: "Today's Milk", value: milkToday, unit: "L", tone: "purple", icon: "milk", onclick: () => JF.App.navigate("#finance/sales") }));
    page.appendChild(tileGrid);

    /* ===== ROW 1: Upcoming Events | Reproduction Timeline | Farm Summary ===== */
    const row1 = el("div", { style: "display:grid;grid-template-columns:1.2fr 1.6fr 1fr;gap:14px;margin-bottom:14px" });
    if (window.innerWidth < 1100) row1.style.gridTemplateColumns = "1fr";

    // --- Upcoming Events
    const evCard = el("div", { class: "card" });
    evCard.appendChild(cardHead("calendar", "Upcoming Events", "View All", () => JF.App.navigate("#reminders")));
    const evBody = el("div", {});
    if (!open.length) evBody.appendChild(el("div", { class: "field__hint", style: "padding:12px 16px" }, "Nothing scheduled — all clear."));
    open.slice(0, 5).forEach((r) => evBody.appendChild(eventRow({
      id: r.AnimalID || "Herd",
      tag: tagBadge(r.ReminderType, /heat/i.test(r.ReminderType) ? "danger" : /pregnan/i.test(r.ReminderType) ? "success" : /vaccin/i.test(r.ReminderType) ? "violet" : /deworm/i.test(r.ReminderType) ? "info" : "warning"),
      when: r.Status === "Overdue" ? null : r.Status === "Due Today" ? "Today" : JF.Utils.formatDate(r.DueDate, "d MMM yyyy"),
      overdue: r.Status === "Overdue" ? `Overdue (${r.overdueFor}d)` : null,
      onclick: () => r.AnimalID && JF.App.navigate(`#animal/${r.AnimalID}`),
    })));
    evCard.appendChild(evBody);
    row1.appendChild(evCard);

    // --- Reproduction Timeline (next 7 days agenda-style rows with date chips)
    const repCard = el("div", { class: "card" });
    repCard.appendChild(cardHead("heart", "Reproduction Timeline (Next 30 Days)", "View Calendar", () => JF.App.navigate("#reproduction/calendar")));
    const repBody = el("div", { style: "padding:6px 16px 12px" });
    const reproRems = open.filter((r) => /heat|ai|pregnan|calv/i.test(r.ReminderType)).slice(0, 5);
    if (!reproRems.length) repBody.appendChild(el("div", { class: "field__hint", style: "padding:8px 0" }, "No reproduction events in the next 30 days."));
    reproRems.forEach((r) => {
      const d = new Date(r.DueDate);
      repBody.appendChild(el("div", { style: "display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--color-ink-50)" }, [
        el("div", { style: "width:52px;text-align:center;background:var(--color-accent-100);border-radius:10px;padding:6px 0;flex:none" }, [
          el("div", { style: "font-weight:800;font-size:var(--fs-lg);color:var(--color-accent-700);line-height:1" }, String(d.getDate())),
          el("div", { style: "font-size:10px;color:var(--color-ink-500)" }, ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]),
        ]),
        el("div", { style: "flex:1;min-width:0" }, [
          el("div", { style: "font-weight:700;font-size:var(--fs-sm)" }, r.AnimalID || "Herd"),
          el("div", { class: "table__cell--muted", style: "font-size:var(--fs-caption)" }, r.ReminderType),
        ]),
        r.Status === "Overdue" ? tagBadge(`Overdue ${r.overdueFor}d`, "danger") : tagBadge(JF.Utils.formatDate(r.DueDate, "d MMM"), "info"),
      ]));
    });
    repCard.appendChild(repBody);
    row1.appendChild(repCard);

    // --- Farm Summary
    const sumCard = el("div", { class: "card" });
    sumCard.appendChild(cardHead("reports", "Farm Summary", "This Month", () => JF.App.navigate("#reports")));
    let fin = { milk: 0, income: 0, expense: 0 };
    try {
      const monthStart = t.slice(0, 8) + "01";
      const journal = (await JF.Store.journal?.list()) || [];
      const sales = (await JF.Store.sales?.list()) || [];
      const milkR = (await JF.Store.milkSales?.list()) || [];
      fin.milk = milkR.filter((m) => (m.Date || "") >= monthStart).reduce((s, m) => s + Number(m.Quantity || m.Litres || 0), 0);
      fin.income = [...journal.filter((j) => /income|sale/i.test(j.CreditAccount || "")), ...sales].filter((x) => (x.Date || x.TransactionDate || "") >= monthStart).reduce((s, x) => s + Number(x.Amount || 0), 0);
      fin.expense = journal.filter((j) => (j.Date || "") >= monthStart && Number(j.Amount) && /expense/i.test(j.DebitAccount || "")).reduce((s, j) => s + Number(j.Amount), 0);
    } catch (e) {}
    const sumRow = (iconName, label, value, delta, tone) =>
      el("div", { style: "display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--color-ink-50)" }, [
        el("div", { class: "stat-tile__icon", style: tint(tone).replace("background:", "").replace(/;--tile-ink.*/, ""), html: JF.Utils.svgIcon(iconName, 20, 20) }),
        el("div", { style: "flex:1" }, [
          el("div", { class: "table__cell--muted", style: "font-size:var(--fs-sm)" }, label),
          el("div", { style: "font-weight:700;font-family:var(--font-display);font-size:var(--fs-lg)" }, value),
        ]),
        delta ? el("span", { class: "stat-tile__delta", style: "font-size:var(--fs-sm)" }, `↑ ${delta}`) : null,
      ].filter(Boolean));
    const sBody = el("div", {});
    sBody.appendChild(sumRow("milk", "Milk Produced", `${fin.milk || 0} L`, "12%", "green"));
    sBody.appendChild(sumRow("money", "Total Income", JF.Utils.money(fin.income || 0), "8%", "gold"));
    sBody.appendChild(sumRow("finance", "Total Expenses", JF.Utils.money(fin.expense || 0), "5%", "pink"));
    sBody.appendChild(sumRow("dashboard", "Net Profit", JF.Utils.money((fin.income || 0) - (fin.expense || 0)), "15%", "blue"));
    sumCard.appendChild(sBody);
    row1.appendChild(sumCard);
    page.appendChild(row1);

    /* ===== ROW 2: Health Reminders | Herd Composition donut | Quick Add + Weather ===== */
    const row2 = el("div", { style: "display:grid;grid-template-columns:1.2fr 1.4fr 1fr;gap:14px" });
    if (window.innerWidth < 1100) row2.style.gridTemplateColumns = "1fr";

    // --- Health Reminders
    const healthCard = el("div", { class: "card" });
    healthCard.appendChild(cardHead("bell", "Health Reminders", "View All", () => JF.App.navigate("#health")));
    const healthRems = open.filter((r) => /deworm|vaccin|hoof|vitamin|treatment|follow/i.test(r.ReminderType)).slice(0, 5);
    const list2 = healthRems.length ? healthRems : open.slice(0, 5);
    const hBody = el("div", {});
    if (!list2.length) hBody.appendChild(el("div", { class: "field__hint", style: "padding:12px 16px" }, "No health reminders due."));
    list2.forEach((r) => hBody.appendChild(eventRow({
      id: r.AnimalID || "Herd",
      tag: tagBadge(r.ReminderType, /vaccin/i.test(r.ReminderType) ? "violet" : /pregnan/i.test(r.ReminderType) ? "info" : "warning"),
      when: r.Status === "Due Today" ? "Today" : r.inDays ? `${r.inDays} days left` : null,
      overdue: r.Status === "Overdue" ? `Overdue (${r.overdueFor} days)` : null,
      onclick: () => r.AnimalID && JF.App.navigate(`#animal/${r.AnimalID}`),
    })));
    healthCard.appendChild(hBody);
    row2.appendChild(healthCard);

    // --- Herd Composition (donut + legend)
    const herdCard = el("div", { class: "card" });
    herdCard.appendChild(cardHead("dashboard", "Herd Composition", "Details", () => JF.App.navigate("#animals/groups")));
    const donutWrap = el("div", { style: "display:flex;align-items:center;gap:18px;padding:6px 16px 16px;flex-wrap:wrap" });
    const segs = [
      { n: cats.lactating, color: "#2f7a46" },
      { n: cats.calves, color: "#d9a441" },
      { n: cats.pregnant, color: "#e58f8f" },
      { n: cats.dry, color: "#b9c4bb" },
      { n: cats.other, color: "#8fc7a0" },
    ].filter((s) => s.n > 0);
    donutWrap.appendChild(donut(segs, "Total", String(active.length || 0)));
    const legend = el("div", { class: "donut-legend", style: "flex:1;min-width:150px" });
    const legendRow = (color, label, n) => el("div", { class: "donut-legend__row" }, [
      el("span", { class: "donut-legend__dot", style: `background:${color}` }),
      el("span", {}, label),
      el("span", { class: "donut-legend__num" }, `${n}${active.length ? ` (${Math.round((n / Math.max(1, active.length)) * 100)}%)` : ""}`),
    ]);
    legend.appendChild(legendRow("#2f7a46", "Lactating", cats.lactating));
    legend.appendChild(legendRow("#d9a441", "Calves", cats.calves));
    legend.appendChild(legendRow("#e58f8f", "Pregnant", cats.pregnant));
    legend.appendChild(legendRow("#b9c4bb", "Dry", cats.dry));
    donutWrap.appendChild(legend);
    herdCard.appendChild(donutWrap);
    row2.appendChild(herdCard);

    // --- Quick Add + Weather column
    const rightCol = el("div", { style: "display:flex;flex-direction:column;gap:14px" });
    const qaCard = el("div", { class: "card" });
    qaCard.appendChild(cardHead("health", "Quick Add"));
    const qaGrid = el("div", { class: "quick-add", style: "padding:0 16px 16px" });
    const qaTile = (label, icon, tone, onclick) => el("div", { class: "quick-add__tile", style: tint(tone), onclick }, [
      el("span", { html: JF.Utils.svgIcon(icon, 20, 20) }), label,
    ]);
    qaGrid.appendChild(qaTile("Add Animal", "animals", "green", () => JF.QuickEntry?.openPicker()));
    qaGrid.appendChild(qaTile("Heat/AI", "fire", "pink", () => JF.QuickEntry?.openPicker()));
    qaGrid.appendChild(qaTile("Health Entry", "health", "blue", () => JF.QuickEntry?.openPicker()));
    qaGrid.appendChild(qaTile("Finance Entry", "finance", "gold", () => JF.QuickEntry?.openPicker()));
    qaGrid.appendChild(qaTile("Journal Entry", "docs", "purple", () => JF.App.navigate("#finance/journal")));
    qaGrid.appendChild(qaTile("Upload Photo", "photo", "green", () => JF.App.navigate("#documents")));
    qaCard.appendChild(qaGrid);
    rightCol.appendChild(qaCard);

    // Weather card (static info card — no external service)
    const weather = el("div", { class: "card", style: "padding:14px 16px" }, [
      el("div", { style: "display:flex;align-items:center;gap:8px;font-weight:700" }, [
        el("span", { html: JF.Utils.svgIcon("dashboard", 16, 16), style: "color:var(--color-wheat-700)" }),
        "Weather & Farm Conditions",
      ]),
      el("div", { style: "display:flex;gap:18px;margin-top:10px;align-items:center" }, [
        el("div", {}, [
          el("div", { style: "font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700" }, "27°C"),
          el("div", { class: "table__cell--muted", style: "font-size:var(--fs-caption)" }, "Partly sunny"),
        ]),
        el("div", { style: "border-left:1px solid var(--color-ink-100);padding-left:18px" }, [
          el("div", { style: "font-weight:700" }, "62%"),
          el("div", { class: "table__cell--muted", style: "font-size:var(--fs-caption)" }, "Humidity"),
        ]),
        el("div", {}, [
          el("div", { style: "font-weight:700" }, "8 km/h"),
          el("div", { class: "table__cell--muted", style: "font-size:var(--fs-caption)" }, "Wind"),
        ]),
      ]),
    ]);
    rightCol.appendChild(weather);
    row2.appendChild(rightCol);
    page.appendChild(row2);

    /* ===== FOOTER tagline + hills ===== */
    page.appendChild(el("div", { class: "dash-footer" }, [
      el("div", { class: "dash-footer__tagline" }, "Better Cattle  Brighter Futures"),
      el("div", { class: "dash-footer__hills" }),
    ]));
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Animals = (function () {
  const $ = () => document.getElementById("view-container");
  const SUB = {
    all:      { label: "All Animals", icon: "animals" },
    add:      { label: "Add Animal",  icon: "plus" },
    groups:   { label: "Animal Groups", icon: "analytics" },
    calves:   { label: "Calves",      icon: "baby" },
    pregnant: { label: "Pregnant",    icon: "pregnancy" },
    open:     { label: "Open",        icon: "animals" },
    heat:     { label: "Heat",        icon: "fire" },
    dry:      { label: "Dry",         icon: "animals" },
    sick:     { label: "Sick / Treatment", icon: "treatment" },
    sold:     { label: "Sold",        icon: "sale" },
    deceased: { label: "Deceased",    icon: "death" },
  };
  const SUB_FILTER = {
    calves: (a) => a.CurrentStatus === "Calf" || a.CurrentStatus === "Heifer",
    pregnant: (a) => a.CurrentStatus === "Pregnant",
    open: (a) => a.CurrentStatus === "Open",
    heat: (a) => a.CurrentStatus === "In Heat",
    dry: (a) => a.CurrentStatus === "Dry",
    sick: (a) => ["Sick", "Under Treatment"].includes(a.CurrentStatus),
    sold: (a) => a.CurrentStatus === "Sold",
    deceased: (a) => a.CurrentStatus === "Deceased",
  };

  const statusBadge = (status) => {
    const map = {
      "Calf": "badge--info", "Heifer": "badge--info", "Pregnant": "badge--success", "Lactating": "badge--success",
      "Open": "badge--warning", "In Heat": "badge--danger", "Sick": "badge--danger", "Under Treatment": "badge--danger",
      "Dry": "badge--neutral", "Active": "badge--success", "Sold": "badge--neutral", "Deceased": "badge--neutral",
    };
    return `<span class="badge ${map[status] || "badge--neutral"}">${status || "Active"}</span>`;
  };

  const subNav = (active = "all") => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)", flexWrap: "wrap" } });
    Object.entries(SUB).forEach(([k, v]) => {
      row.appendChild(JF.Utils.el("a", {
        class: `tab ${active === k ? "is-active" : ""}`,
        href: `#animals/${k}`,
        html: `<span style="display:inline-flex;align-items:center;gap:6px;">${JF.Utils.svgIcon(v.icon, 14, 14)} ${v.label}</span>`,
      }));
    });
    return row;
  };

  const head = (sub, count) => JF.Utils.el("div", { class: "page__head-row" }, [
    JF.Utils.el("div", {}, [
      JF.Utils.el("div", { class: "eyebrow" }, "🐄 Animals"),
      JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "All Animals"),
      JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
        count != null ? `${count} animals in this view · click any row for the full profile.` : "Individual animal records, filters, and groups."),
    ]),
    JF.Utils.el("div", { class: "page__actions" }, [
      JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => JF.App?.navigate("#animals/groups") }, "Manage Groups"),
      JF.Utils.el("button", { class: "btn btn--primary btn--icon-label btn--sm", html: `${JF.Utils.svgIcon("plus", 14, 14)} Add Animal`, onclick: () => JF.QuickEntry?.openForm("animal") }),
    ]),
  ]);

  /* ---------- Filters ---------- */
  const filters = { q: "", species: "", breed: "", gender: "", status: "", group: "" };

  const filterBar = (animals) => {
    const uniq = (key) => [...new Set(animals.map((a) => a[key]).filter(Boolean))].sort();
    const sel = (label, key) => JF.Utils.el("select", {
      class: "select", style: { minWidth: "130px" },
      onchange: (e) => { filters[key] = e.target.value; render(); },
    }, [
      JF.Utils.el("option", { value: "" }, label),
      ...uniq(key === "group" ? "CurrentGroup" : key).map((v) => JF.Utils.el("option", { value: v, selected: filters[key] === v ? true : null }, v)),
    ]);
    return JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)", padding: "var(--space-4)", display: "flex", gap: "var(--space-3)", flexWrap: "wrap", alignItems: "center" } }, [
      JF.Utils.el("input", {
        class: "input", type: "search", placeholder: "Search ID, tag, name…", style: { minWidth: "200px", flex: "1" },
        value: filters.q, oninput: JF.Utils.debounce((e) => { filters.q = e.target.value; render(); }, 250),
      }),
      sel("All species", "species"), sel("All breeds", "breed"), sel("All genders", "gender"),
      sel("All statuses", "status"), sel("All groups", "group"),
    ]);
  };

  const applyFilters = (animals) => animals.filter((a) => {
    const q = filters.q.toLowerCase();
    if (q && ![a.AnimalID, a.TagNumber, a.Name].filter(Boolean).some((x) => String(x).toLowerCase().includes(q))) return false;
    if (filters.species && a.Species !== filters.species) return false;
    if (filters.breed && a.Breed !== filters.breed) return false;
    if (filters.gender && a.Gender !== filters.gender) return false;
    if (filters.status && a.CurrentStatus !== filters.status) return false;
    if (filters.group && a.CurrentGroup !== filters.group) return false;
    return true;
  });

  /* ---------- Table ---------- */
  const renderTable = async (animals) => {
    if (!animals.length) {
      return JF.Utils.el("div", { class: "card", style: { padding: "var(--space-8)", textAlign: "center" } }, [
        JF.Utils.el("div", { class: "search-empty" }, [
          JF.Utils.el("div", { style: { opacity: 0.4, marginBottom: "12px" }, html: JF.Utils.svgIcon("animals", 28, 28) }),
          "No animals match this view. Adjust the filters or add a new animal.",
        ]),
      ]);
    }
    // Traffic lights (reproductive action state) for each animal
    const lights = {};
    await Promise.all(animals.map(async (a) => {
      try { lights[a.AnimalID] = await JF.ReproIntel.trafficLight(a); } catch (e) { lights[a.AnimalID] = null; }
    }));
    const table = JF.Utils.el("table", { class: "table" });
    table.appendChild(JF.Utils.el("thead", {}, [
      JF.Utils.el("tr", {}, ["Animal", "Tag", "Breed", "Gender", "Age", "Status", "Next Action", "Group", ""].map((h) => JF.Utils.el("th", {}, h))),
    ]));
    const tbody = JF.Utils.el("tbody");
    animals.forEach((a) => {
      const tl = lights[a.AnimalID];
      tbody.appendChild(JF.Utils.el("tr", { onclick: () => JF.App.navigate(`#animal/${a.AnimalID}`), style: { cursor: "pointer" } }, [
        JF.Utils.el("td", {}, [
          JF.Utils.el("div", { style: { display: "grid", gridTemplateColumns: "40px 1fr", gap: "12px", alignItems: "center" } }, [
            JF.Utils.el("div", {
              class: "avatar avatar--sm",
              html: `<img src="${a.PhotoURL || JF.Utils.portraitSVG(a.Name || a.AnimalID, a.Species === "Buffalo" ? "buffalo" : "cattle")}" alt=""/>`,
            }),
            JF.Utils.el("div", {}, [
              JF.Utils.el("div", { class: "table__cell--primary" }, a.AnimalID),
              JF.Utils.el("div", { class: "table__cell--muted" }, a.Name || "—"),
            ]),
          ]),
        ]),
        JF.Utils.el("td", { class: "table__cell--muted" }, a.TagNumber || "—"),
        JF.Utils.el("td", { class: "table__cell--muted" }, a.Breed || "—"),
        JF.Utils.el("td", {}, a.Gender || "—"),
        JF.Utils.el("td", {}, a.DateOfBirth ? JF.Utils.ageLabel(a.DateOfBirth) : "—"),
        JF.Utils.el("td", { html: statusBadge(a.CurrentStatus) }),
        JF.Utils.el("td", {}, tl ? JF.Utils.el("div", { class: `traffic ${tl.cls}` }, [
          JF.Utils.el("span", { class: "traffic__dot" }),
          JF.Utils.el("span", { class: "traffic__label" }, tl.hidden ? "—" : tl.next || tl.label),
        ]) : "—"),
        JF.Utils.el("td", { class: "table__cell--muted" }, a.CurrentGroup || "—"),
        JF.Utils.el("td", { style: { textAlign: "right" } }, [
          JF.Utils.el("button", {
            class: "btn btn--ghost btn--sm",
            onclick: (e) => { e.stopPropagation(); JF.App.navigate(`#animal/${a.AnimalID}`); },
          }, "Open →"),
        ]),
      ]));
    });
    table.appendChild(tbody);
    return JF.Utils.el("div", { class: "table-wrap" }, [table]);
  };

  /* ---------- Groups editor ---------- */
  const groupsPage = async () => {
    const animals = (await JF.Store.animals.list()) || [];
    const customGroups = (await JF.Store.groups.list().catch(() => [])) || [];
    // Count animals per CurrentGroup
    const counts = {};
    animals.forEach((a) => { if (a.CurrentGroup) counts[a.CurrentGroup] = (counts[a.CurrentGroup] || 0) + 1; });
    const allGroupNames = [...new Set([...customGroups.map((g) => g.GroupName).filter(Boolean), ...Object.keys(counts)])].sort();

    const wrap = JF.Utils.el("div", { style: { display: "grid", gap: "var(--space-5)" } });

    // Create + assign controls
    const nameInput = JF.Utils.el("input", { class: "input", id: "grp-name", placeholder: "New group name, e.g. Quarantine Pen" });
    const createBtn = JF.Utils.el("button", {
      class: "btn btn--primary btn--sm", onclick: async () => {
        const name = document.getElementById("grp-name").value.trim();
        if (!name) { JF.Toast.show("Enter a group name.", "warning"); return; }
        await JF.Store.groups.create({ GroupName: name, Description: "" });
        JF.Toast.show(`Group "${name}" created.`, "success");
        render();
      },
    }, "Create Group");
    const animalSel = JF.Utils.el("select", { class: "select", id: "grp-animal" },
      animals.filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus)).map((a) => JF.Utils.el("option", { value: a.AnimalID }, `${a.Name} (${a.AnimalID})`)));
    const groupSel = JF.Utils.el("select", { class: "select", id: "grp-target" },
      allGroupNames.map((g) => JF.Utils.el("option", { value: g }, g)));
    const assignBtn = JF.Utils.el("button", {
      class: "btn btn--ghost btn--sm", onclick: async () => {
        const aid = document.getElementById("grp-animal").value;
        const g = document.getElementById("grp-target").value;
        if (!aid || !g) { JF.Toast.show("Pick an animal and a group.", "warning"); return; }
        await JF.Store.animals.update(aid, { CurrentGroup: g });
        JF.Toast.show(`${aid} moved to ${g}.`, "success");
        render();
      },
    }, "Assign Animal");

    wrap.appendChild(JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)", display: "flex", gap: "var(--space-3)", flexWrap: "wrap", alignItems: "flex-end" } }, [
      JF.Utils.el("div", { class: "field", style: { flex: "1", minWidth: "180px", margin: 0 } }, [JF.Utils.el("label", { class: "field__label" }, "New group"), nameInput]),
      createBtn,
      JF.Utils.el("div", { class: "field", style: { minWidth: "180px", margin: 0 } }, [JF.Utils.el("label", { class: "field__label" }, "Animal"), animalSel]),
      JF.Utils.el("div", { class: "field", style: { minWidth: "160px", margin: 0 } }, [JF.Utils.el("label", { class: "field__label" }, "Group"), groupSel]),
      assignBtn,
    ]));

    // Group cards
    wrap.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3" }, allGroupNames.map((g) => {
      const members = animals.filter((a) => a.CurrentGroup === g);
      return JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
        JF.Utils.el("div", { class: "card__header", style: { marginBottom: "8px" } }, [
          JF.Utils.el("h3", { class: "section__title", style: { margin: 0, fontSize: "var(--fs-md)" } }, g),
          JF.Utils.el("span", { class: "chip" }, `${members.length} animals`),
        ]),
        JF.Utils.el("div", { class: "chip-row" }, members.slice(0, 6).map((m) =>
          JF.Utils.el("a", { class: "chip", href: `#animal/${m.AnimalID}` }, m.Name || m.AnimalID))),
        members.length > 6 ? JF.Utils.el("div", { class: "field__hint", style: { marginTop: "6px" } }, `+${members.length - 6} more`) : null,
      ].filter(Boolean));
    })));
    return wrap;
  };

  /* ---------- Render ---------- */
  const render = async (path = []) => {
    const sub = path?.[1] || "all";
    const root = $();
    JF.Utils.clear(root);
    const page = JF.Utils.el("div", { class: "page" });
    const all = JF.Store ? ((await JF.Store.animals.list()) || []) : [];

    if (sub === "groups") {
      page.appendChild(head(sub));
      page.appendChild(subNav(sub));
      page.appendChild(await groupsPage());
    } else if (sub === "add") {
      page.appendChild(head(sub));
      page.appendChild(subNav(sub));
      page.appendChild(JF.Utils.el("div", { class: "card card--feature", style: { padding: "var(--space-6)", textAlign: "center" } }, [
        JF.Utils.el("h3", { class: "section__title" }, "Register a new animal"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "8px" } },
          "Opens the full 10-field Quick Entry form — name, tag, species, breed, gender, DOB, purchase info, group and location. The animal ID is generated automatically."),
        JF.Utils.el("button", { class: "btn btn--primary", style: { marginTop: "var(--space-4)" }, onclick: () => JF.QuickEntry?.openForm("animal") }, "Open Add Animal Form"),
      ]));
    } else {
      const base = SUB_FILTER[sub] ? all.filter(SUB_FILTER[sub]) : all;
      const filtered = sub === "all" ? applyFilters(base) : base;
      page.appendChild(head(sub, filtered.length));
      page.appendChild(subNav(sub));
      if (sub === "all") page.appendChild(filterBar(all));
      page.appendChild(await renderTable(filtered));
    }
    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.AnimalProfile = (function () {
  const $ = () => document.getElementById("view-container");
  const TABS = ["Overview", "Episodes", "Timeline", "Heat", "Insemination", "Pregnancy", "Calving", "Health", "Deworming", "Vaccination", "Documents", "Photos", "Expenses", "Accounting"];
  const TAB_KEYS = ["overview", "episodes", "timeline", "heat", "insemination", "pregnancy", "calving", "health", "deworming", "vaccination", "documents", "photos", "expenses", "accounting"];

  const statusBadge = (status) => {
    const map = {
      "Calf": "badge--info", "Heifer": "badge--info", "Pregnant": "badge--success", "Lactating": "badge--success",
      "Open": "badge--warning", "In Heat": "badge--danger", "Sick": "badge--danger", "Under Treatment": "badge--danger",
      "Dry": "badge--neutral", "Active": "badge--success", "Sold": "badge--neutral", "Deceased": "badge--neutral",
    };
    return `<span class="badge ${map[status] || "badge--neutral"} badge--lg">${status || "Active"}</span>`;
  };

  const money = (n) => JF.Utils.money(n || 0);
  // Table cell that accepts trusted HTML markup (badges, links, bold dates).
  const TD = (html) => { const td = document.createElement("td"); td.innerHTML = html; return td; };

  /* ---------- Header ---------- */
  const header = (a, nextEvents) => JF.Utils.el("div", { class: "card card--feature", style: { marginBottom: "var(--space-6)" } }, [
    JF.Utils.el("div", { style: { display: "grid", gridTemplateColumns: "160px 1fr auto", gap: "var(--space-6)", alignItems: "center" } }, [
      JF.Utils.el("div", {
        class: "avatar avatar--xl",
        html: `<img src="${a?.PhotoURL || JF.Utils.portraitSVG(a?.Name || a?.AnimalID || "farm")}" alt=""/>`,
        style: { boxShadow: "var(--shadow-md)" },
      }),
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, `ANIMAL PROFILE · ${a?.AnimalID || ""}`),
        JF.Utils.el("h1", { style: { fontSize: "var(--fs-4xl)", fontWeight: 700, letterSpacing: "-0.03em", marginTop: "8px" } }, a?.Name || "Unnamed"),
        JF.Utils.el("div", { style: { display: "flex", gap: "var(--space-3)", alignItems: "center", marginTop: "var(--space-3)", flexWrap: "wrap" } }, [
          JF.Utils.el("span", { class: "chip" }, a?.Breed || ""),
          JF.Utils.el("span", { class: "chip" }, a?.Gender || ""),
          JF.Utils.el("span", { class: "chip" }, a?.DateOfBirth ? `${JF.Utils.ageLabel(a.DateOfBirth)} old` : ""),
          JF.Utils.el("span", { class: "chip" }, a?.CurrentGroup || a?.CurrentLocation || ""),
          JF.Utils.el("span", { html: statusBadge(a?.CurrentStatus) }),
        ]),
      ]),
      JF.Utils.el("div", { style: { display: "flex", gap: "var(--space-2)", flexDirection: "column", alignItems: "stretch", minWidth: 180 } }, [
        JF.Utils.el("button", { class: "btn btn--primary", onclick: () => JF.QuickEntry?.openPicker() }, "Add Event"),
        JF.Utils.el("button", { class: "btn btn--ghost", onclick: () => openEdit(a) }, "Edit Animal"),
        JF.Utils.el("button", {
          class: "btn btn--ghost",
          style: { color: "var(--color-danger-500)", borderColor: "var(--color-danger-100)" },
          onclick: async () => {
            if (!confirm(`Delete ${a?.Name || a?.AnimalID}? This removes the master record only.`)) return;
            try {
              await JF.Store.animals.delete(a.AnimalID || a.id);
              JF.Toast?.show("Animal deleted.", "success");
              JF.App.navigate("#animals");
            } catch (e) { JF.Toast?.show("Failed to delete animal.", "danger"); }
          },
        }, "Delete Animal"),
      ]),
    ]),
    JF.Utils.el("div", { class: "divider", style: { margin: "var(--space-5) 0" } }),
    JF.Utils.el("div", {}, [
      JF.Utils.el("div", { class: "card__eyebrow", style: { marginBottom: "var(--space-3)" } }, "NEXT EVENTS"),
      JF.Utils.el("div", { class: "chip-row" }, (nextEvents.length
        ? nextEvents.map((r) => JF.Utils.el("a", {
            class: "chip", href: `#animal/${a.AnimalID}/overview`,
            onclick: (e) => { e.preventDefault(); JF.App.navigate("#reminders"); },
          }, `${typeIcon(r.ReminderType)} ${r.ReminderType} · ${JF.Utils.formatDate(r.DueDate)}`))
        : [JF.Utils.el("span", { class: "chip" }, "No upcoming events — all clear")])
      ),
    ]),
  ]);

  const typeIcon = (type) => ({
    "Heat Expected": "🔥", "Pregnancy Check": "🧪", "Treatment Follow-up": "🩺",
    "Deworming": "💊", "Vaccination": "💉", "Expected Calving": "👶",
  }[type] || "🔔");

  /* ---------- Tabs ---------- */
  const tabsNav = (activeIdx) => {
    const row = JF.Utils.el("div", { class: "tabs" });
    TABS.forEach((t, i) => row.appendChild(JF.Utils.el("a", {
      class: `tab ${i === activeIdx ? "is-active" : ""}`,
      href: `#tab-${TABS[i]}`,
      onclick: (e) => {
        e.preventDefault();
        location.hash = `#animal/${aID}/${TAB_KEYS[i]}`;
      },
    }, t)));
    return row;
  };

  let aID = null;
  let cache = {};

  const panel = (i, contentNode) => JF.Utils.el("div", {
    id: `tab-${i}`, class: `tab-panel ${i === activeIdx ? "is-active" : ""}`,
    style: { display: i === activeIdx ? "block" : "none" },
  }, [contentNode || JF.Utils.el("div", { class: "card", style: { padding: "var(--space-8)", textAlign: "center" } },
    JF.Utils.el("div", { class: "search-empty" }, "No records yet."))]);

  let activeIdx = 0;

  /* ---------- Helpers ---------- */
  const rows = (entity, dateKey) => (cache[entity] || [])
    .filter((r) => r.AnimalID === aID)
    .sort((x, y) => new Date(y[dateKey] || 0) - new Date(x[dateKey] || 0));

  const emptyCard = (msg) => JF.Utils.el("div", { class: "card", style: { padding: "var(--space-7)", textAlign: "center" } },
    JF.Utils.el("div", { class: "search-empty" }, [
      JF.Utils.el("div", { style: { opacity: 0.4, marginBottom: "10px" }, html: JF.Utils.svgIcon("timeline", 26, 26) }),
      msg,
    ]));

  const statCard = (label, value, sub) => JF.Utils.el("div", { class: "card card--stat" }, [
    JF.Utils.el("div", { class: "stat-number" }, String(value ?? "—")),
    JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
    sub ? JF.Utils.el("div", { class: "field__hint", style: { marginTop: "2px" } }, sub) : null,
  ].filter(Boolean));

  const dataTable = (headers, rowsArr, emptyMsg) => {
    if (!rowsArr.length) return emptyCard(emptyMsg);
    return JF.Utils.el("div", { class: "table-container card" }, JF.Utils.el("table", { class: "table" }, [
      JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, headers.map((h) => JF.Utils.el("th", {}, h)))),
      JF.Utils.el("tbody", {}, rowsArr),
    ]));
  };

  /* ---------- Tab: Overview ---------- */
  const overviewTab = () => {
    const heats = rows("heat", "HeatDate"), preg = rows("pregnancy", "Date"), calv = rows("calving", "Date");
    const healths = rows("health", "Date"), dew = rows("deworming", "Date"), vax = rows("vaccination", "DateGiven");
    const jnl = (cache.journal || []).filter((e) => e.AnimalID === aID);
    const spend = jnl.filter((e) => (e.DebitAccount || "").includes("Expense")).reduce((s, e) => s + Number(e.Amount || 0), 0);
    const a = cache.animal;
    const posPreg = preg.filter((p) => p.Result === "Positive").length;
    const lastCalv = calv[0];

    // Life-cycle card (derived from records by the LifeCycle engine)
    let lc = null;
    try { lc = JF.LifeCycle.lifecycleOf(a, cache.lifeCycleData, Number(cache.settings?.GestationDays) || 283); } catch (e) { lc = null; }

    const info = (k, v) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", gap: "12px", padding: "8px 0", borderBottom: "1px solid var(--color-ink-100)" } }, [
      JF.Utils.el("span", { class: "field__hint" }, k), JF.Utils.el("span", { style: { fontWeight: 600, textAlign: "right" } }, v || "—"),
    ]);

    return JF.Utils.el("div", { class: "grid grid--cols-3", style: { gap: "var(--space-4)" } }, [
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "BASIC INFO"),
        info("Tag Number", a?.TagNumber), info("Species", a?.Species), info("Color", a?.Color),
        info("Date of Birth", JF.Utils.formatDate(a?.DateOfBirth)), info("Age", a?.DateOfBirth ? JF.Utils.ageLabel(a.DateOfBirth) : ""),
        info("Location", a?.CurrentLocation), info("Group", a?.CurrentGroup),
      ]),
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "PEDIGREE & PURCHASE"),
        info("Mother", a?.MotherID || "—"),
        info("Father", a?.FatherID || "—"),
        info("Purchase Date", JF.Utils.formatDate(a?.PurchaseDate)),
        info("Purchase Price", a?.PurchasePrice ? money(a.PurchasePrice) : "—"),
        info("Ident. Marks", a?.IdentificationMarks),
      ]),
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "REPRODUCTION"),
        statCard("HEATS RECORDED", heats.length),
        JF.Utils.el("div", { style: { height: "12px" } }),
        statCard("PREGNANCIES (POS)", posPreg),
        JF.Utils.el("div", { style: { height: "12px" } }),
        statCard("CALVINGS", calv.length),
      ]),
      lc ? JF.Utils.el("div", { class: "card", style: { gridColumn: "span 2" } }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, `LIFE CYCLE · LACTATION #${lc.lactationNo || 0}`),
        JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginTop: "var(--space-3)" } }, [
          statCard("LACTATION #", lc.lactationNo || (calv.length ? calv.length : 0)),
          statCard("DAYS IN MILK", lc.dim != null ? lc.dim : (a?.CurrentStatus === "Lactating" && lc.lastCalving ? JF.Utils.daysBetween(lc.lastCalving, JF.Utils.todayISO()) : "—")),
          statCard("CALVING INTERVAL", lc.calvingInterval ? `${lc.calvingInterval}d` : (calv.length >= 2 ? "…" : "—"), calv.length >= 2 ? "from her calvings" : (calv.length < 2 ? "needs 2+ calvings" : "")),
          statCard("LIFETIME MEDICAL", money(lc.medical.total), `₹${lc.medical.last12m}/12mo`),
        ]),
        lc.expectedCalving ? JF.Utils.el("div", { style: { marginTop: "var(--space-3)" } },
          JF.Utils.el("div", { class: `badge ${lc.expectedCalving.confirmed ? "badge--success" : "badge--warning"}` },
            `👶 Expected calving ${JF.Utils.formatDate(lc.expectedCalving.date)} (${lc.expectedCalving.confirmed ? "PD confirmed" : "PD pending"})`)) : null,
        lc.daysDry != null ? JF.Utils.el("div", { class: "field__hint", style: { marginTop: "6px" } }, `Dry for ${lc.daysDry} days${lc.lastDryOff ? ` (since ${JF.Utils.formatDate(lc.lastDryOff)})` : ""}`) : null,
      ]) : null,
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "HEALTH SUMMARY"),
        info("Treatments", String(healths.length)),
        info("Dewormings", String(dew.length)),
        info("Vaccinations", String(vax.length)),
        info("Last Treatment", healths[0] ? JF.Utils.formatDate(healths[0].Date) : "—"),
        info("Next Deworming", dew[0]?.NextDueDate ? JF.Utils.formatDate(dew[0].NextDueDate) : "—"),
      ]),
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "FINANCIAL SUMMARY"),
        info("Linked Journal Entries", String(jnl.length)),
        info("Total Expense Posted", money(spend)),
        info("Purchase Price", a?.PurchasePrice ? money(a.PurchasePrice) : "—"),
      ]),
      JF.Utils.el("div", { class: "card" }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "STATUS"),
        JF.Utils.el("div", { style: { margin: "12px 0" }, html: statusBadge(a?.CurrentStatus) }),
        info("Last Updated", a?.UpdatedAt ? JF.Utils.formatDate(a.UpdatedAt, "dd MMM yyyy HH:mm") : "—"),
        info("Notes", a?.Notes || "—"),
      ]),
    ]);
  };

  /* ---------- Tab: Timeline ---------- */
  const timelineTab = () => {
    const evts = JF.Timeline.animalForSync(aID, cache);
    if (!evts.length) return emptyCard("No timeline events yet. Record heats, treatments or vaccinations to build the history.");
    const wrap = JF.Utils.el("div", { class: "timeline" });
    evts.forEach((ev) => {
      wrap.appendChild(JF.Utils.el("div", { class: "timeline__item", style: { cursor: "pointer" } }, [
        JF.Utils.el("div", { class: `timeline__dot ${ev.DotClass || ""}`, html: JF.Utils.svgIcon(ev.Icon, 10, 10) }),
        JF.Utils.el("div", { class: "timeline__date" }, JF.Utils.formatDate(ev.Date)),
        JF.Utils.el("div", { class: "timeline__title" }, ev.Title),
        JF.Utils.el("div", { class: "timeline__desc" }, ev.Subtitle || ""),
      ]));
    });
    return wrap;
  };

  /* ---------- Tab: Heat ---------- */
  const heatTab = () => {
    const list = rows("heat", "HeatDate");
    const settings = cache.settings;
    const expC = Number(settings?.ExpectedCycleLength ?? 21);
    const minC = Number(settings?.MinimumCycleLength ?? 18);
    const maxC = Number(settings?.MaximumCycleLength ?? 24);
    const before = Number(settings?.ReminderDaysBefore ?? 3);

    const intervals = [];
    for (let i = 1; i < list.length; i++) {
      const d = JF.Utils.daysBetween(list[i].HeatDate, list[i - 1].HeatDate);
      if (d > 0) intervals.push(d);
    }
    const avg = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : null;
    const last = list[0];
    const expNext = avg && last ? JF.Utils.formatDate(JF.Utils.addDays(last.HeatDate, Math.round(avg))) : "—";
    const minNext = avg && last ? JF.Utils.formatDate(JF.Utils.addDays(last.HeatDate, Math.round(avg) - before)) : "—";
    const maxNext = avg && last ? JF.Utils.formatDate(JF.Utils.addDays(last.HeatDate, Math.round(avg) + before)) : "—";

    const analysis = JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
      statCard("AVG CYCLE", avg ? `${Math.round(avg * 10) / 10}d` : "—", `${intervals.length} intervals`),
      statCard("SHORTEST", intervals.length ? `${Math.min(...intervals)}d` : "—"),
      statCard("LONGEST", intervals.length ? `${Math.max(...intervals)}d` : "—"),
      statCard("HEAT COUNT", list.length),
    ]);

    const windowCard = last && avg ? JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)", padding: "var(--space-5)" } }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "EXPECTED NEXT HEAT WINDOW"),
      JF.Utils.el("div", { style: { display: "flex", gap: "var(--space-5)", alignItems: "baseline", flexWrap: "wrap", marginTop: "8px" } }, [
        JF.Utils.el("div", {}, [JF.Utils.el("div", { class: "field__hint" }, "Window start"), JF.Utils.el("div", { style: { fontSize: "var(--fs-xl)", fontWeight: 700 } }, minNext)]),
        JF.Utils.el("div", {}, [JF.Utils.el("div", { class: "field__hint" }, "Peak (avg)"), JF.Utils.el("div", { style: { fontSize: "var(--fs-xl)", fontWeight: 700, color: "var(--color-danger-600)" } }, expNext)]),
        JF.Utils.el("div", {}, [JF.Utils.el("div", { class: "field__hint" }, "Window end"), JF.Utils.el("div", { style: { fontSize: "var(--fs-xl)", fontWeight: 700 } }, maxNext)]),
      ]),
    ]) : null;

    const table = dataTable(["Date", "Time", "Intensity", "Detection", "Symptoms", "Notes"], list.map((h) => JF.Utils.el("tr", {}, [
      TD(`<strong>${JF.Utils.formatDate(h.HeatDate)}</strong>`),
      JF.Utils.el("td", {}, h.HeatTime || "—"),
      JF.Utils.el("td", {}, h.HeatIntensity || "—"),
      JF.Utils.el("td", {}, h.DetectionMethod || "—"),
      JF.Utils.el("td", {}, (h.Symptoms || []).join(", ") || "—"),
      JF.Utils.el("td", {}, h.Notes || ""),
    ])), "No heat records for this animal.");

    return JF.Utils.el("div", {}, [analysis, windowCard, table].filter(Boolean));
  };

  /* ---------- Tab: Insemination ---------- */
  const inseminationTab = () => {
    const list = rows("insemination", "Date");
    const pregByAI = {};
    (cache.pregnancy || []).forEach((p) => { if (p.InseminationID) pregByAI[p.InseminationID] = p.Result; });
    return dataTable(["Date", "Method", "Bull / Semen", "Technician", "Cost", "Pregnancy Result"], list.map((ai) => JF.Utils.el("tr", {}, [
      TD(`<strong>${JF.Utils.formatDate(ai.Date)}</strong>`),
      JF.Utils.el("td", {}, ai.Method || "AI"),
      JF.Utils.el("td", {}, ai.SemenBullID || "—"),
      JF.Utils.el("td", {}, ai.Technician || "—"),
      JF.Utils.el("td", {}, ai.Cost ? money(ai.Cost) : "—"),
      JF.Utils.el("td", {}, pregByAI[ai.InseminationID || ai.id]
        ? `<span class="badge ${pregByAI[ai.InseminationID || ai.id] === "Positive" ? "badge--success" : "badge--warning"}">${pregByAI[ai.InseminationID || ai.id]}</span>`
        : `<span class="badge badge--neutral">Pending</span>`),
    ])), "No insemination records yet.");
  };

  /* ---------- Tab: Pregnancy ---------- */
  const pregnancyTab = () => {
    const list = rows("pregnancy", "Date");
    const a = cache.animal;
    const gest = Number(cache.settings?.GestationDays ?? 283);
    const isPregnant = a?.CurrentStatus === "Pregnant";
    const posPreg = list.find((p) => p.Result === "Positive");
    const cards = [];
    if (isPregnant && posPreg) {
      const linkedAI = (cache.insemination || []).find((x) => x.id === posPreg.InseminationID || x.InseminationID === posPreg.InseminationID);
      const calvingDate = JF.Utils.addDays(linkedAI?.Date || posPreg.Date, gest);
      const daysLeft = JF.Utils.daysBetween(JF.Utils.today(), calvingDate);

  const episodesTab = async (aID) => {

    const score = await JF.ReproIntel.scorecardFor(aID);
    const memory = heatMemory(heats.filter((h) => h.AnimalID === aID), insem.filter((x) => x.AnimalID === aID));

    const wrap = JF.Utils.el("div", {});

    // One-tap event chips
    wrap.appendChild(JF.Utils.el("div", { class: "onetap card", style: { marginBottom: "var(--space-5)" } }, [

    // Animal memory

      wrap.appendChild(JF.Utils.el("div", { class: "card memory-card", style: { marginBottom: "var(--space-5)" } }, [
        JF.Utils.el("div", { class: "card__eyebrow" }, "ANIMAL MEMORY"),

          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "stat-number", style: { fontSize: "var(--fs-xl)" } }, memory.avgCycle ? `${memory.avgCycle}d` : "—"),
            JF.Utils.el("div", { class: "card__eyebrow" }, "AVG CYCLE (LAST 3)"),
          ]),
          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "stat-number", style: { fontSize: "var(--fs-xl)" } }, memory.lastAI || "—"),
            JF.Utils.el("div", { class: "card__eyebrow" }, "LAST AI"),
          ]),
          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "stat-number", style: { fontSize: "var(--fs-xl)" } }, memory.lastPD || "—"),
            JF.Utils.el("div", { class: "card__eyebrow" }, "LAST PD RESULT"),
          ]),
        ]),
      ]));
    }

    // Reproductive scorecard (record quality, not fertility prediction)
    const bar = (label, v) => JF.Utils.el("div", { class: "score-row" }, [
      JF.Utils.el("span", { class: "score-row__label" }, label),
      JF.Utils.el("div", { class: "score-row__track" }, JF.Utils.el("div", { class: "score-row__fill", style: { width: `${v}%` } })),
      JF.Utils.el("span", { class: "score-row__val" }, `${v}%`),
    ]);
    wrap.appendChild(JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)" } }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "REPRODUCTIVE SCORECARD — RECORD QUALITY"),
      JF.Utils.el("div", { style: { marginTop: "var(--space-3)" } }, [
        bar("Heat detection", score.heatDetection),
        bar("AI timing coverage", score.aiTiming),
        bar("Observation quality", score.observationQuality),
        bar("Record completeness", score.completeness),
      ]),
      JF.Utils.el("div", { class: "field__hint", style: { marginTop: "var(--space-2)" } },
        "Scores measure how completely and timely you record — directly measurable, not a fertility prediction."),
    ]));

    // Episodes
    if (!episodes.length) {
      wrap.appendChild(JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-6)" } },
        "No reproductive episodes yet. Tap a one-tap chip above the next time you see signs."));
      return wrap;
    }
    episodes.forEach((ep, i) => {
      const card = JF.Utils.el("div", { class: "card episode-card", style: { marginBottom: "var(--space-4)" } });
      card.appendChild(JF.Utils.el("div", { class: "card__header" }, [
        JF.Utils.el("div", {}, [
          JF.Utils.el("div", { class: "card__eyebrow" }, `EPISODE · ${JF.Utils.formatDate(ep.start, "d MMM yyyy")}`),
          JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } },
            `${ep.observations.length} observation(s) · ${ep.aiCoverage.length} AI(s) · evidence ${ep.evidencePct}%`),
        ]),
        ep.returnHeat && ep.returnHeat.possible ? JF.Utils.el("span", { class: "badge badge--danger" }, "RETURN HEAT?") : null,
      ].filter(Boolean)));

        body.appendChild(JF.Utils.el("div", { class: "field__hint", style: { marginBottom: "var(--space-2)" } },

        JF.Utils.el("div", { class: "why-conf" }, `Confidence: ${w.confidence}`),

      // Next
      body.appendChild(JF.Utils.el("div", { class: "next-steps" }, ep.actions.map((a) =>
        JF.Utils.el("div", { class: "next-steps__row" }, `→ ${a.text}`))));
      card.appendChild(body);
      wrap.appendChild(card);
    });
    return wrap;

  /* ---------- Heat memory: cycle pattern from last heats ---------- */
  const heatMemory = (heats, ais) => {
    const sorted = heats.map((h) => h.HeatDate).filter(Boolean).sort();
    const intervals = [];
    for (let i = 1; i < sorted.length; i++) {
      const d = JF.Utils.daysBetween(sorted[i - 1], sorted[i]);
      if (d >= 15 && d <= 30) intervals.push(d);
    }
    const last3 = intervals.slice(-3);
    const avg = last3.length ? Math.round(last3.reduce((a, b) => a + b, 0) / last3.length) : null;
    const lastAI = ais.length ? JF.Utils.formatDate(ais.map((a) => a.Date).sort().slice(-1)[0], "d MMM") : null;
    const lastAIRec = ais.sort((a, b) => new Date(b.Date) - new Date(a.Date))[0];
    let lastPD = null;
    if (lastAIRec) {
      const pd = (cache.pregnancy || []).filter((p) => p.AnimalID === lastAIRec.AnimalID && JF.Utils.daysBetween(lastAIRec.Date, p.Date) >= 20).sort((a, b) => new Date(b.Date) - new Date(a.Date))[0];
      lastPD = pd ? pd.Result : "pending";
    }
    return { avgCycle: avg, intervals: last3, lastAI, lastPD };
  };

  /* ---------- Render ---------- */
  const render = async (path = []) => {
    aID = path?.[1] || (parseID(location.hash) || "COW-001");
    activeIdx = Math.max(0, TAB_KEYS.indexOf(path?.[2] || "overview"));
    const root = $();
    JF.Utils.clear(root);

    let animal = null;
    try { animal = await JF.Store.animals.get(aID); } catch (e) {}
    // Adapter ids and AnimalID can diverge (GAS imports, external entries):
    // resolve by AnimalID as well before giving up.
    if (!animal) {
      try {
        const all = (await JF.Store.animals.list()) || [];
        animal = all.find((x) => x.AnimalID === aID || x.id === aID) || null;
      } catch (e) {}
    }
    if (!animal) {
      root.appendChild(JF.Utils.el("div", { class: "page" }, [
        emptyCard(`No animal found for "${aID}".`),
        JF.Utils.el("div", { style: { textAlign: "center", marginTop: "var(--space-4)" } },
          JF.Utils.el("a", { class: "btn btn--primary", href: "#animals" }, "Back to All Animals")),
      ]));
      return;
    }

    const entities = ["heat", "insemination", "pregnancy", "calving", "health", "deworming", "vaccination", "journal", "expenses", "files"];
    const results = await Promise.all(entities.map((e) => JF.Store[e].list().catch(() => [])));
    cache = { animal, settings: await JF.Store.settings.allMap() };
    entities.forEach((e, i) => { cache[e] = results[i]; });
    // Full data window (incl. dry-offs) for the life-cycle card.
    try { cache.lifeCycleData = await JF.LifeCycle.loadAll(); } catch (e) { cache.lifeCycleData = null; }

    const reminders = ((await JF.Store.reminders.list().catch(() => [])) || [])
      .filter((r) => r.AnimalID === aID && !["Completed", "Dismissed"].includes(r.Status))
      .sort((x, y) => new Date(x.DueDate) - new Date(y.DueDate)).slice(0, 4);

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", {
      class: "eyebrow", style: { marginBottom: "var(--space-3)", cursor: "pointer" },
      onclick: () => JF.App.navigate("#animals"),
      html: `← Back to All Animals`,
    }));
    page.appendChild(header(animal, reminders));
    page.appendChild(tabsNav(activeIdx));
    page.appendChild(JF.Utils.el("div", { class: "tab-panels" }, [
      panel(0, overviewTab()),
      panel(1, await episodesTab(aID)),
      panel(2, timelineTab()),
      panel(3, heatTab()),
      panel(4, inseminationTab()),
      panel(5, pregnancyTab()),
      panel(6, calvingTab()),
      panel(7, healthTab()),
      panel(8, dewormingTab()),
      panel(9, vaccinationTab()),
      panel(10, documentsTab()),
      panel(11, photosTab()),
      panel(12, expensesTab()),
      panel(13, accountingTab()),
    ]));
    root.appendChild(page);
  };

  const parseID = (hash) => { const m = String(hash || "").match(/^#animal\/([^/]+)/); return m ? m[1] : null; };

  return { render };
})();

  <script>
JF.Views = JF.Views || {};

/**
 * Heat Detective — one graph, whole story.
 *
 * Lanes (top → bottom):
 *   OBSERVATIONS  evidence chips with weights
 *   BIOLOGY       estimated onset → ovulation probability cloud (possible/probable/prime)
 *   AI            insemination events + timing coverage verdicts
 *   LOGISTICS     semen availability + technician availability bands
 */
JF.Views.HeatDetective = (function () {
  const $ = () => document.getElementById("view-container");

  /* ---------------- data ---------------- */

  const loadCowData = async () => {
    const [animals, heats, insem, healths, preg] = await Promise.all([
      JF.Store.animals.list(), JF.Store.heat.list(), JF.Store.insemination.list(),
      JF.Store.health.list(), JF.Store.pregnancy.list(),
    ]);
    return { animals, heats, insem, healths, preg };
  };

  const femaleCows = (animals) => animals.filter((a) =>
    a.Gender === "Female" && !["Calf", "Sold", "Deceased"].includes(a.CurrentStatus));

  /* ---------------- SVG timeline builder ---------------- */

  const W = 960, H = 300, PADL = 118, PADR = 26, LANE_H = 46, TOP = 40;
  const LANES = [
    { key: "obs",   label: "OBSERVATIONS", color: "#7a6247" },
    { key: "bio",   label: "BIOLOGY",      color: "#b92473" },
    { key: "ai",    label: "AI",           color: "#27407e" },
    { key: "logi",  label: "LOGISTICS",    color: "#59452f" },
  ];

  const svgEsc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  const buildTimelineSVG = (ep, logs) => {
    const lo = ep.start.getTime() - 18 * 3600e3;
    const hi = Math.max(ep.end.getTime(), ep.ovulation.hi.getTime(), ...ep.aiCoverage.map((c) => c.at.getTime())) + 20 * 3600e3;
    const span = Math.max(1, hi - lo);
    const x = (t) => PADL + ((t - lo) / span) * (W - PADL - PADR);
    const laneY = (i) => TOP + i * LANE_H + 14;
    const height = TOP + LANES.length * LANE_H + 34;
    const parts = [];
    const now = Date.now();
    const fmtT = (t) => JF.Utils.formatDate(new Date(t), "d MMM HH:mm");

    // grid + day ticks with hour-level minor ticks (fertility windows live and
    // die by the hour, so the axis shows both: day boundaries + 6h minor grid)
    const dayMs = 86400e3;
    const hourMs = 3600e3;
    // Snap the tick grid to 6-hour boundaries aligned on local midnight, so every
    // day gets one bold label at 00:00 and three minor hour ticks (06/12/18).
    const firstMidnight = new Date(lo); firstMidnight.setHours(0, 0, 0, 0);
    let t0 = firstMidnight.getTime();
    while (t0 < lo) t0 += 6 * hourMs;
    for (let t = t0; t <= hi; t += 6 * hourMs) {
      const px = x(t);
      const d = new Date(t);
      const isMidnight = d.getHours() === 0;
      parts.push(`<line x1="${px}" y1="${TOP - 12}" x2="${px}" y2="${height - 26}" stroke="#e3d5ba" stroke-width="${isMidnight ? 1.4 : 0.7}" ${isMidnight ? "" : 'stroke-dasharray="2 4"'}/>`);
      if (isMidnight) {
        parts.push(`<text x="${px}" y="${TOP - 28}" font-size="11" font-weight="700" fill="#59452f" text-anchor="middle">${svgEsc(JF.Utils.formatDate(d, "d MMM"))}</text>`);
      } else {
        parts.push(`<text x="${px}" y="${TOP - 28}" font-size="8.5" fill="#a58d6f" text-anchor="middle">${String(d.getHours()).padStart(2, "0")}h</text>`);
      }
    }
    // now marker
    if (now > lo && now < hi) {
      parts.push(`<line x1="${x(now)}" y1="${TOP - 12}" x2="${x(now)}" y2="${height - 26}" stroke="#a33327" stroke-width="2" stroke-dasharray="4 3"/>`);
      parts.push(`<text x="${x(now)}" y="${height - 12}" font-size="10" fill="#a33327" text-anchor="middle">NOW</text>`);
    }

    // lane frames + labels
    LANES.forEach((l, i) => {
      parts.push(`<line x1="${PADL - 8}" y1="${laneY(i) + 16}" x2="${W - PADR}" y2="${laneY(i) + 16}" stroke="#e3d5ba" stroke-width="1"/>`);
      parts.push(`<text x="${PADL - 14}" y="${laneY(i) + 6}" font-size="10" font-weight="700" fill="${l.color}" text-anchor="end" letter-spacing="1">${l.label}</text>`);
    });

    // full-height fertile-window bands (behind all lanes) — biology applies to
    // every row: observations, ovulation, AI coverage and logistics.
    const ov = ep.ovulation;
    if (ov.fertileLo && ov.primeLo) {
      const yTop = TOP - 12, yBot = height - 26;
      const fl = x(ov.fertileLo.getTime()), fh = x(ov.fertileHi.getTime());
      const pl = x(ov.primeLo.getTime()), ph = x(ov.primeHi.getTime());
      parts.push(`<rect x="${fl}" y="${yTop}" width="${Math.max(2, fh - fl)}" height="${yBot - yTop}" fill="#2e8a4f" opacity="0.07"/>`);
      parts.push(`<rect x="${pl}" y="${yTop}" width="${Math.max(2, ph - pl)}" height="${yBot - yTop}" fill="#2e8a4f" opacity="0.14"/>`);
      parts.push(`<text x="${(fl + fh) / 2}" y="${height - 12}" font-size="9" fill="#2e8a4f" text-anchor="middle" letter-spacing="1">FERTILE WINDOW${ep.standingSeen ? "" : " (WIDE)"}</text>`);
      parts.push(`<text x="${(pl + ph) / 2}" y="${yTop + 10}" font-size="9" font-weight="700" fill="#2e8a4f" text-anchor="middle" letter-spacing="1">PRIME</text>`);
    }

    /* --- lane 1: observations --- */
    ep.observations.forEach((o, i) => {
      const px = x(o.at.getTime());
      const main = o.signs[0] || "obs";
      const strong = o.signs.some((s) => /stand/i.test(s));
      parts.push(`<g>
        <circle cx="${px}" cy="${laneY(0) - 2}" r="${strong ? 8 : 6}" fill="${strong ? "#b92473" : "#a58d6f"}"/>
        <text x="${px}" y="${laneY(0) - 18}" font-size="9.5" fill="#59452f" text-anchor="middle">${svgEsc(String(main).slice(0, 14))}</text>
      </g>`);
    });

    /* --- lane 2: biology - estimated onset bar + ovulation cloud --- */
    const ovY = laneY(1);
    const ovLo = x(ep.ovulation.lo), ovHi = x(ep.ovulation.hi);
    const cLo = x(ep.ovulation.coreLo), cHi = x(ep.ovulation.coreHi);
    // possible band
    parts.push(`<rect x="${ovLo}" y="${ovY - 10}" width="${Math.max(2, ovHi - ovLo)}" height="20" rx="10" fill="#b92473" opacity="0.16"/>`);
    // probable band (core ± 1h around 24-32h)
    parts.push(`<rect x="${cLo}" y="${ovY - 7}" width="${Math.max(2, cHi - cLo)}" height="14" rx="7" fill="#b92473" opacity="0.38"/>`);
    // most-likely centre
    const mid = (cLo + cHi) / 2;
    parts.push(`<rect x="${mid - 2}" y="${ovY - 12}" width="4" height="24" rx="2" fill="#b92473" opacity="0.85"/>`);
    parts.push(`<text x="${ovHi + 6}" y="${ovY + 4}" font-size="9.5" fill="#86184f">EST. OVULATION WINDOW${ep.standingSeen ? "" : " (widened: no standing heat observed)"}</text>`);
    // onset marker
    if (ep.onsetEstimate && ep.onsetEstimate.best) {
      const ox = x(ep.onsetEstimate.best.getTime());
      parts.push(`<path d="M${ox} ${ovY - 14} l5 8 h-10 z" fill="#86184f"/>`);
      parts.push(`<text x="${ox}" y="${ovY + 22}" font-size="9" fill="#86184f" text-anchor="middle">ONSET EST.</text>`);
    }

    /* --- lane 3: AI + coverage verdicts --- */
    ep.aiCoverage.forEach((c) => {
      const px = x(c.at.getTime());
      const yA = laneY(2);
      const color = { prime: "#2e8a4f", good: "#4164b5", early: "#cf9110", late: "#a33327" }[c.band] || "#59452f";
      parts.push(`<rect x="${px - 3}" y="${yA - 12}" width="6" height="24" rx="2" fill="${color}"/>`);
      parts.push(`<text x="${px}" y="${yA - 16}" font-size="9.5" font-weight="700" fill="${color}" text-anchor="middle">${svgEsc(c.label)}</text>`);
      parts.push(`<text x="${px}" y="${yA + 26}" font-size="9" fill="${color}" text-anchor="middle">${c.band === "prime" ? "PRIME" : c.band.toUpperCase()}</text>`);
    });

    /* --- lane 4: logistics bands (semen / technician) --- */
    const yL = laneY(3);
    const segs = (logs || []).filter((l) => l.from && l.to);
    if (segs.length) {
      segs.forEach((s) => {
        const f = new Date(s.from).getTime(), t2 = new Date(s.to).getTime();
        if (t2 < lo || f > hi) return;
        const x1 = x(Math.max(f, lo)), x2 = x(Math.min(t2, hi));
        const col = s.type === "semen" ? (s.available ? "#4164b5" : "#1c110a") : (s.available ? "#2e8a4f" : "#cf9110");
        const yB = s.type === "semen" ? yL - 12 : yL + 4;
        parts.push(`<rect x="${x1}" y="${yB}" width="${Math.max(2, x2 - x1)}" height="8" rx="4" fill="${col}" opacity="0.75"/>`);
      });
    } else {
      parts.push(`<text x="${PADL + 8}" y="${yL + 6}" font-size="9.5" fill="#a58d6f" font-style="italic">no semen/technician gaps logged — add them in Settings → Reproduction → Availability</text>`);
    }

    return `<svg viewBox="0 0 ${W} ${height}" class="detective-svg" role="img" aria-label="Heat detective timeline">${parts.join("")}</svg>`;
  };

  /* ---------------- Evidence bars ---------------- */

  const evidenceBars = (ep) => {
    const rows = Object.values(ep.signs).sort((a, b) => b.score - a.score);
    if (!rows.length) return JF.Utils.el("div", { class: "field__hint" }, "No observations recorded for this episode yet.");
    const wrap = JF.Utils.el("div", { class: "evidence-bars" });
    rows.forEach((p) => {
      const pct = Math.round(p.score * 100);
      wrap.appendChild(JF.Utils.el("div", { class: "evidence-row" }, [
        JF.Utils.el("span", { class: "evidence-row__label" }, p.label),
        JF.Utils.el("div", { class: "evidence-row__track" }, [
          JF.Utils.el("div", { class: "evidence-row__fill", style: { width: `${pct}%` } }),
        ]),
        JF.Utils.el("span", { class: "evidence-row__val" }, pct >= 100 ? "STRONG" : pct >= 50 ? "HIGH" : pct >= 30 ? "MEDIUM" : "LOW"),
      ]));
    });
    return wrap;
  };

  /* ---------------- Confidence dial ---------------- */

  const confidenceDial = (ep) => {
    const pct = ep.evidencePct;
    const why = JF.ReproIntel.why(ep);
    const tone = why.confidence === "High" ? "good" : why.confidence === "Medium" ? "mid" : "low";
    return JF.Utils.el("div", { class: "confidence-card" }, [
      JF.Utils.el("div", { class: "confidence-card__pct" }, `${pct}%`),
      JF.Utils.el("div", { class: "confidence-card__label" }, `STANDING-HEAT EVIDENCE${ep.standingSeen ? "" : " · OBSERVATION-BASED"}`),
      JF.Utils.el("div", { class: `confidence-card__tone confidence-card__tone--${tone}` }, `${why.confidence} confidence`),
      JF.Utils.el("div", { class: "confidence-card__note" }, "Observation-based confidence — not a veterinary diagnosis."),
    ]);
  };

  /* ---------------- Why panel ---------------- */

  const whyPanel = (ep) => {
    const w = JF.ReproIntel.why(ep);
    return JF.Utils.el("div", { class: "card why-card" }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "WHY DOES THE SYSTEM THINK THIS?"),
      JF.Utils.el("ul", { class: "why-list" }, w.basis.map((b) => JF.Utils.el("li", {}, b))),
      JF.Utils.el("div", { class: "why-conf" }, `Confidence: ${w.confidence}`),
    ]);
  };

  /* ---------------- AI coverage list ---------------- */

  const coverageList = (ep) => {
    if (!ep.aiCoverage.length) return JF.Utils.el("div", { class: "field__hint" }, "No AI recorded in this episode.");
    const wrap = JF.Utils.el("div", { class: "coverage-list" });
    ep.aiCoverage.forEach((c) => {
      const cls = { prime: "good", good: "good", early: "mid", late: "late" }[c.band];
      wrap.appendChild(JF.Utils.el("div", { class: "coverage-item" }, [
        JF.Utils.el("div", { class: "coverage-item__time" }, c.label),
        JF.Utils.el("div", { class: "coverage-item__track" }, [
          JF.Utils.el("div", { class: `coverage-item__fill coverage-item__fill--${cls}`, style: { width: "100%" } }),
        ]),
        JF.Utils.el("div", { class: `coverage-item__verdict coverage-item__verdict--${cls}` },
          c.band === "prime" ? "PRIME COVERAGE" : c.band === "good" ? "GOOD COVERAGE" : c.band === "early" ? "EARLY" : "LATE — WATCH RETURN"),
        JF.Utils.el("div", { class: "coverage-item__note" }, c.note),
      ]));
    });
    return wrap;
  };

  /* ---------------- Event journal (photo evidence) ---------------- */

  const eventJournal = (ep) => {
    const wrap = JF.Utils.el("div", { class: "timeline" });
    ep.events.forEach((e) => {
      const isAI = e.kind === "ai";
      const title = isAI ? `💉 AI${e.raw.SemenBullID ? " · " + e.raw.SemenBullID : ""}` : `🔥 ${(e.signs || []).slice(0, 2).join(", ") || "Observation"}`;
      const photos = e.raw && (e.raw.PhotoURL || e.raw.Photos);
      wrap.appendChild(JF.Utils.el("div", { class: "timeline__item" }, [
        JF.Utils.el("div", { class: `timeline__dot ${isAI ? "timeline__dot--finance" : ""}`, html: JF.Utils.svgIcon(isAI ? "syringe" : "fire", 10, 10) }),
        JF.Utils.el("div", { class: "timeline__date" }, JF.Utils.formatDate(e.at, "d MMM · HH:mm")),
        JF.Utils.el("div", { class: "timeline__title" }, title),
        JF.Utils.el("div", { class: "timeline__desc" }, photos ? "📷 photo attached" : ""),
      ]));
    });
    return wrap;
  };

  /* ---------------- Page render ---------------- */

  let selectedCow = null;

  const render = async (path = []) => {
    const root = $();
    JF.Utils.clear(root);
    const data = await loadCowData();
    const cows = femaleCows(data.animals);
    // Default to the cow with the most recent heat story, not just the first row:
    // opening the detective should land on a page that shows a timeline.
    if (!selectedCow || !cows.find((c) => c.AnimalID === selectedCow)) {
      const latestHeat = {};
      data.heats.forEach((h) => { if (!latestHeat[h.AnimalID] || latestHeat[h.AnimalID] < h.HeatDate) latestHeat[h.AnimalID] = h.HeatDate; });
      const ranked = cows.slice().sort((a, b) => String(latestHeat[b.AnimalID] || "").localeCompare(String(latestHeat[a.AnimalID] || "")));
      selectedCow = (ranked.find((c) => latestHeat[c.AnimalID]) || cows[0])?.AnimalID || null;
    }

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "🕵 REPRODUCTION"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, "Heat Detective"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Pick a cow, read the story: observations, estimated onset, ovulation window, AI timing coverage, return-heat alerts and farm logistics — one graph, honest uncertainty."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", { class: "btn btn--accent btn--sm", onclick: () => JF.QuickEntry.openForm("observe") }, "+ Observation"),
      ]),
    ]));

    if (!cows.length) {
      page.appendChild(JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-6)" } },
        "No active female cows yet. Add animals first, then the detective has someone to investigate."));
      root.appendChild(page);
      return;
    }

    // Cow selector
    const sel = JF.Utils.el("select", { class: "select", style: { maxWidth: "340px", marginBottom: "var(--space-5)" }, onchange: (e) => { selectedCow = e.target.value; render(path); } },
      cows.map((c) => JF.Utils.el("option", { value: c.AnimalID, selected: c.AnimalID === selectedCow ? true : null }, `${c.Name} (${c.AnimalID}) · ${c.CurrentStatus || ""}`)));
    page.appendChild(sel);

    const episodes = JF.ReproIntel.episodesFor(selectedCow, { heats: data.heats, inseminations: data.insem, healths: data.healths, animals: data.animals });

    if (!episodes.length) {
      page.appendChild(JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-6)" } },
        "No heat observations or AIs recorded for this cow yet. Tap \"+ Observation\" to start the story."));
      root.appendChild(page);
      return;
    }

    // Latest episode first
    const availLogs = await (async () => {
      try { return JSON.parse(await JF.Store.settings.get("availability_log")?.value || "[]"); } catch (e) { return []; }
    })();
    episodes.slice().reverse().forEach((ep, i) => {
      const logs = availLogs;
      const card = JF.Utils.el("div", { class: "card episode-card", style: { marginBottom: "var(--space-6)" } });
      card.appendChild(JF.Utils.el("div", { class: "card__header" }, [
        JF.Utils.el("div", {}, [
          JF.Utils.el("div", { class: "card__eyebrow" }, `REPRODUCTIVE EPISODE · ${JF.Utils.formatDate(ep.start, "d MMM yyyy")}`),
          JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } },
            `Episode ${episodes.length - i} — ${ep.observations.length} observation(s), ${ep.aiCoverage.length} AI(s)`),
        ]),
        ep.returnHeat && ep.returnHeat.possible
          ? JF.Utils.el("span", { class: "badge badge--danger" }, "POSSIBLE RETURN TO HEAT")
          : JF.Utils.el("span", { class: "badge badge--success" }, `${ep.standingSeen ? "STANDING SEEN" : "PARTIAL EVIDENCE"}`),
      ]));

      // Return heat alert block
      if (ep.returnHeat && ep.returnHeat.possible) {
        card.appendChild(JF.Utils.el("div", { class: "alert alert--danger", style: { margin: "var(--space-3) var(--space-4) 0" } }, [
          JF.Utils.el("strong", {}, "Possible return to heat after AI. "),
          ep.returnHeat.note + ` Interval: ~${ep.returnHeat.intervalDays} days. Review the episode before scheduling the next AI.`,
        ]));
      }

      const body = JF.Utils.el("div", { class: "episode-body", style: { padding: "var(--space-4)" } }, [
        JF.Utils.el("div", { class: "grid grid--cols-2", style: { marginBottom: "var(--space-4)" } }, [
          evidenceBars(ep),
          confidenceDial(ep),
        ]),
        JF.Utils.el("div", { style: { overflowX: "auto", marginBottom: "var(--space-4)" } },
          JF.Utils.el("div", { style: { minWidth: "720px" }, html: buildTimelineSVG(ep, logs) })),
        JF.Utils.el("div", { class: "grid grid--cols-2", style: { marginBottom: "var(--space-4)" } }, [
          coverageList(ep),
          JF.Utils.el("div", {}, [
            whyPanel(ep),
            JF.Utils.el("div", { class: "card", style: { marginTop: "var(--space-4)" } }, [
              JF.Utils.el("div", { class: "card__eyebrow" }, "WHAT HAPPENS NEXT?"),
              JF.Utils.el("ul", { class: "why-list" }, ep.actions.map((a) =>
                JF.Utils.el("li", {}, `${a.text}`))),
            ]),
          ]),
        ]),
        JF.Utils.el("div", { class: "card__eyebrow", style: { marginBottom: "var(--space-2)" } }, "EPISODE JOURNAL"),
        eventJournal(ep),
      ]);
      card.appendChild(body);
      page.appendChild(card);
    });

    root.appendChild(page);
  };

  return { render };
})();

</script>

JF.Views.Health = (function () {
  const $ = () => document.getElementById("view-container");

      });

    });
    return row;
  };

  const renderTable = (headers, rows) => {
    const container = JF.Utils.el("div", { class: "table-container card" });
    const table = JF.Utils.el("table", { class: "table" });
    const thead = JF.Utils.el("thead", {}, [
      JF.Utils.el("tr", {}, headers.map(h => JF.Utils.el("th", {}, h)))
    ]);
    const tbody = JF.Utils.el("tbody", {}, rows.length ? rows.map(r =>
      JF.Utils.el("tr", {
        style: r.animalId ? "cursor:pointer" : "",
        onclick: r.animalId ? () => JF.App.navigate(`#animal/${r.animalId}`) : null
      }, r.cols.map(c => JF.Utils.el("td", {}, c)))
    ) : [
      JF.Utils.el("tr", {}, [
        JF.Utils.el("td", { colSpan: headers.length, style: "text-align:center;padding:24px;color:var(--color-ink-400)" }, "No records found in this view.")
      ])
    ]);
    table.appendChild(thead);
    table.appendChild(tbody);
    container.appendChild(table);
    return container;
  };

  const render = async (path = "") => {
    const root = $();
    const sub = path?.[1] || "vet";
    JF.Utils.clear(root);

    let healths = [], vax = [], dews = [];
    try {
      healths = await JF.Store.health.list();
      vax = await JF.Store.vaccination.list();
      dews = await JF.Store.deworming.list();
    } catch (e) { console.warn(e); }

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "🩺 Health"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "Veterinary Records"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Herd health management — treatment logs, vaccinations, deworming schedules and veterinary cases."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", {
          class: "btn btn--primary btn--icon-label btn--sm",
          html: `${JF.Utils.svgIcon("plus", 14, 14)} Log Record`,
          onclick: () => JF.QuickEntry?.openForm(sub === "vaccine" ? "vaccine" : sub === "deworming" ? "deworm" : "treat"),
        }),
      ]),
    ]));

    page.appendChild(subNav(sub));

    if (sub === "vaccine") {
      const rows = vax.map(v => ({
        animalId: v.AnimalID,
        cols: [
          `<strong>${v.VaccinationID || "VAX-REC"}</strong>`,
          v.AnimalID || "—",
          v.Vaccine || "Standard Vaccine",
          JF.Utils.formatDate(v.DateGiven, "dd MMM yyyy"),
          v.NextDueDate ? JF.Utils.formatDate(v.NextDueDate, "dd MMM yyyy") : "—",
          v.BatchNumber || "—",
          v.Veterinarian || "—",
          v.Cost ? JF.Utils.money(v.Cost) : "—"
        ]
      }));
      page.appendChild(renderTable(["Vaccination ID", "Animal ID", "Vaccine Name", "Date Given", "Next Due Date", "Batch #", "Vet", "Cost"], rows));
    } else if (sub === "deworming") {
      const rows = dews.map(d => ({
        animalId: d.AnimalID,
        cols: [
          `<strong>${d.DewormingID || "DEW-REC"}</strong>`,
          d.AnimalID || "—",
          d.Medicine || "Dewormer",
          JF.Utils.formatDate(d.Date, "dd MMM yyyy"),
          d.Dose || "Standard",
          d.NextDueDate ? JF.Utils.formatDate(d.NextDueDate, "dd MMM yyyy") : "—",
          d.Veterinarian || "—",
          d.Cost ? JF.Utils.money(d.Cost) : "—"
        ]
      }));
      page.appendChild(renderTable(["Deworming ID", "Animal ID", "Medicine", "Date", "Dose", "Next Due Date", "Vet", "Cost"], rows));
    } else {
      // vet & treatments
      const rows = healths.map(h => ({
        animalId: h.AnimalID,
        cols: [
          `<strong>${h.HealthRecordID || "VET-REC"}</strong>`,
          h.AnimalID || "—",
          JF.Utils.formatDate(h.Date, "dd MMM yyyy"),
          h.Problem || "Checkup",
          h.Diagnosis || "—",
          h.Medicine || "—",
          `<span class="badge ${h.RecoveryStatus === "Recovered" ? "badge--accent" : "badge--warning"}">${h.RecoveryStatus || "Active"}</span>`,
          h.TreatmentCost ? JF.Utils.money(h.TreatmentCost) : "—"
        ]
      }));
      page.appendChild(renderTable(["Record ID", "Animal ID", "Date", "Problem", "Diagnosis", "Medicine", "Status", "Cost"], rows));
    }

    root.appendChild(page);
  };

  return { render };
})();

  <script>
JF.Views = JF.Views || {};
JF.Views.Calves = (function () {
  const $ = () => document.getElementById("view-container");
  const SUB = {
    births:   { label: "Birth Records",   icon: "baby2" },
    manage:   { label: "Calf Management", icon: "calf" },
    growth:   { label: "Growth",          icon: "analytics" },
    history:  { label: "Calf History",    icon: "timeline" },
  };

  const subNav = (active) => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)" } });
    Object.entries(SUB).forEach(([k, v]) => row.appendChild(JF.Utils.el("a", {
      class: `tab ${active === k ? "is-active" : ""}`, href: `#calves/${k}`,
    }, v.label)));
    return row;
  };

  const stat = (label, value, sub) => JF.Utils.el("div", { class: "card card--stat" }, [
    JF.Utils.el("div", { class: "stat-number" }, String(value ?? "—")),
    JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
    sub ? JF.Utils.el("div", { class: "field__hint" }, sub) : null,
  ].filter(Boolean));

  const dataTable = (headers, rows, emptyMsg) => {
    if (!rows.length) return JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-7)" } }, emptyMsg);
    return JF.Utils.el("div", { class: "table-container card" }, JF.Utils.el("table", { class: "table" }, [
      JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, headers.map((h) => JF.Utils.el("th", {}, h)))),
      JF.Utils.el("tbody", {}, rows),
    ]));
  };

  const ageLabel = (dob) => JF.Utils.ageLabel(dob);

  /* ---------- Birth Records ---------- */
  const birthsPage = (calvings, animals) => {
    const name = (id) => animals.find((a) => a.AnimalID === id)?.Name || id || "—";
    return dataTable(["Date", "Mother", "Calf", "Gender", "Weight", "Health", "Type", "Vet"],
      calvings.map((c) => {
        const td = (h) => JF.Utils.el("td", {}, h);
        const th = (h) => JF.Utils.el("td", { html: h });
        const _ = null; // (kept for readability)
        return JF.Utils.el("tr", {}, [
          th(`<strong>${JF.Utils.formatDate(c.Date)}</strong>`),
          td(`${name(c.AnimalID)} (${c.AnimalID || "—"})`),
          c.CalfID ? JF.Utils.el("td", {}, JF.Utils.el("a", { href: `#animal/${c.CalfID}`, style: { fontWeight: 600, color: "var(--color-accent-700)" } }, c.CalfID)) : td("—"),
          td(c.CalfGender || "—"),
          td(c.CalfWeight ? `${c.CalfWeight} kg` : "—"),
          td(c.CalfHealth || "—"),
          td(c.CalvingType || "—"),
          td(c.Veterinarian || "—"),
        ]);
      }),
      "No births recorded yet. Register a calving to create the first birth record.");
  };

  /* ---------- Calf Management ---------- */
  const managePage = (calves, calvings) => {
    const rows = calves.map((c) => {
      const rawAge = JF.Utils.daysBetween(c.DateOfBirth, JF.Utils.today());
      // A calf can legitimately have no birth date yet; show "—" instead of crashing.
      const ageDays = Number.isFinite(rawAge) ? rawAge : null;
      const birth = calvings.find((x) => x.CalfID === c.AnimalID);
      const wean = 180; // days
      const pct = ageDays === null ? 0 : Math.min(100, Math.round((ageDays / wean) * 100));
      return JF.Utils.el("tr", {}, [
        JF.Utils.el("td", { html: `<strong>${c.AnimalID}</strong><br><span class="field__hint">${c.Name || ""}</span>` }),
        JF.Utils.el("td", { html: `${c.Gender || "—"}<br><span class="field__hint">${c.Breed || ""}</span>` }),
        JF.Utils.el("td", { html: `${JF.Utils.ageLabel(c.DateOfBirth)}<br><span class="field__hint">${JF.Utils.formatDate(c.DateOfBirth)}</span>` }),
        JF.Utils.el("td", { html: birth ? `${birth.CalfWeight || "?"} kg<br><span class="field__hint">birth wt</span>` : "—" }),
        JF.Utils.el("td", {}, JF.Utils.el("div", {}, [
          JF.Utils.el("div", { class: "progress", style: { height: "6px", borderRadius: "3px", background: "var(--color-ink-100)", overflow: "hidden", marginBottom: "4px" } },
            JF.Utils.el("div", { style: { width: `${pct}%`, height: "100%", background: pct >= 100 ? "var(--color-success-500)" : "var(--color-accent-500)" } })),
          JF.Utils.el("span", { class: "field__hint" }, ageDays === null
            ? "birth date missing"
