  <style>
/* ============================================================
   ReproIntel UI — Heat Detective, evidence bars, coverage,

.detective-svg { width: 100%; height: auto; display: block; }

.evidence-row__fill { height: 100%; background: linear-gradient(90deg, var(--brand-marigold), var(--brand-magenta)); border-radius: var(--radius-full); transition: width var(--dur-base) var(--ease-out); }

/* ---------- Why panel & lists ---------- */
.why-card { background: var(--color-accent-50); border: 1px dashed var(--color-accent-300); }

.coverage-item__time { font-weight: 700; font-size: var(--fs-sm); color: var(--color-ink-900); }

.coverage-item__fill { height: 100%; border-radius: var(--radius-full); }
.coverage-item__fill--good { background: linear-gradient(90deg, #2e8a4f, #4164b5); }

  <script>
window.JF = window.JF || {};

JF.Utils = (function () {
  const uid = (prefix = "") => {
    const s = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return prefix ? `${prefix}-${s.toUpperCase()}` : s;
  };

  const uidSeq = (storeKey, prefix, pad = 3) => {
    // In-memory sequence counter (UI stays adapter-agnostic; persistence lives in the data layer).
    if (!uidSeq._counters) uidSeq._counters = {};
    const n = (uidSeq._counters[storeKey] || 0) + 1;
    uidSeq._counters[storeKey] = n;
    return `${prefix}${String(n).padStart(pad, "0")}`;
  };

  const money = (n, symbol = "₹") => {
    if (n === null || n === undefined) return `${symbol}0`;
    const v = Number(n);
    return `${symbol}${v.toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
  };

  // Date-only strings ("YYYY-MM-DD") are calendar dates; parse them as local
  // midnights so formatDate/addDays never shift a day across timezones
  // (new Date("YYYY-MM-DD") parses as UTC midnight and renders one day early
  // in any timezone west of UTC).
  const parseDate = (date) => {
    if (!date) return null;
    if (typeof date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
      const [y, m, d] = date.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    return typeof date === "string" ? new Date(date) : date;
  };

  /** True when the value can actually be read as a date. */
  const isDate = (v) => {
    const d = parseDate(v);
    return !!d && !Number.isNaN(d.getTime && d.getTime());
  };

  const formatDate = (date, fmt = "dd MMM yyyy") => {
    if (!date) return "";
    const d = parseDate(date);
    if (isNaN(d)) return "";
    const pad = (n) => String(n).padStart(2, "0");
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const map = {
      dd: pad(d.getDate()),
      d: String(d.getDate()),
      MM: pad(d.getMonth() + 1),
      yyyy: d.getFullYear(),
      MMM: months[d.getMonth()],
      HH: pad(d.getHours()),
      mm: pad(d.getMinutes()),
      hh: pad(((d.getHours() + 11) % 12) + 1),
      a: d.getHours() < 12 ? "AM" : "PM",
    };
    return fmt.replace(/dd|d|MMM|MM|yyyy|HH|mm|hh|a/g, (m) => map[m]);
  };

  const addDays = (date, days) => {
    const parsed = parseDate(date);
    if (!(parsed instanceof Date) || isNaN(parsed)) return parsed;
    const d = new Date(parsed.getTime()); // clone: callers may pass the same Date to several addDays calls
    d.setDate(d.getDate() + days);
    return d;
  };

  // Missing or invalid dates are a real data state (a calf recorded without a
  // birth date, for example), so this returns NaN instead of throwing - every
  // caller can then show "—" rather than taking the whole page down.
  const daysBetween = (a, b) => {
    const d1 = parseDate(a); const d2 = parseDate(b);
    if (!d1 || !d2 || Number.isNaN(d1.getTime && d1.getTime()) || Number.isNaN(d2.getTime && d2.getTime())) return NaN;
    d1.setHours(0, 0, 0, 0);
    d2.setHours(0, 0, 0, 0);
    return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
  };

  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const todayISO = () => formatDate(today(), "yyyy-MM-dd");

  const ageInYears = (dob) => {
    if (!isDate(dob)) return NaN;
    const d = new Date(dob);
    const diffMs = Date.now() - d.getTime();

    if (!isDate(dob)) return "—";
    const d = new Date(dob);

    if (now.getDate() < d.getDate()) months -= 1;
    if (months < 12) return `${months} mo`;

  };

      else if (k === "html") n.innerHTML = v;

    (Array.isArray(children) ? children : [children]).forEach((c) => {

      n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);

  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };

    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    const c1 = `hsl(${hue},32%,72%)`, c2 = `hsl(${(hue + 40) % 360},30%,52%)`;

      cattle: '<path d="M30 46c0-7 6-12 14-12h4c-2-4-1-9 3-11 5-2 11-1 13 3 6 1 10 5 10 11l-2 9h-6l-1 5h-8l-1-5h-8l-1 5h-8l-1-5c-5-1-8-5-8-10z"/><circle cx="52" cy="30" r="2.4" fill="#fff" opacity=".85"/><circle cx="60" cy="30" r="2.4" fill="#fff" opacity=".85"/>',

      + `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">`
      + `<stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`
      + `<rect width="92" height="84" fill="url(#g)"/>`
      + `<g fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${sil}</g>`
      + `<text x="10" y="76" font-family="'Space Grotesk',sans-serif" font-size="20" font-weight="700" fill="#ffffff" fill-opacity="0.92">${initial}</text>`
      + `</svg>`;
    return `data:image/svg+xml,${encodeURIComponent(svg)}`;
  };

  // Back-compat: photoURL(prompt) previously called a remote generator; now returns a
  // deterministic local portrait. The prompt string is used as the seed.
  const photoURL = (prompt, size = "square_hd") => portraitSVG(prompt || "farm", "cattle");

  return {
    uid, uidSeq, money, formatDate, parseDate, isDate, addDays, daysBetween, today, todayISO,
    ageInYears, ageLabel, el, clear, debounce, svgIcon, photoURL, portraitSVG,
  };
})();

  <script>
/**
 * JF.FinanceCalc - shared double-entry accounting math.
 * Pure functions over the journal list; used by the Finance views, Reports,
 * the animal-profile Accounting tab and the dashboard finance strip.
 * Every journal entry: { Date, DebitAccount, CreditAccount, Amount, AnimalID, ReferenceID, TransactionType }
 */
JF.FinanceCalc = (function () {

  const CHART = [
    { name: "Cash",                type: "asset" },
    { name: "Bank",                type: "asset" },
    { name: "Livestock",           type: "asset" },
    { name: "Equipment",           type: "asset" },
    { name: "Veterinary Expense",  type: "expense" },
    { name: "Medicine Expense",    type: "expense" },
    { name: "Vaccination Expense", type: "expense" },
    { name: "Deworming Expense",   type: "expense" },
    { name: "Labor Expense",       type: "expense" },
    { name: "Electricity Expense", type: "expense" },
    { name: "Water Expense",       type: "expense" },
    { name: "Fuel Expense",        type: "expense" },
    { name: "Transportation Expense", type: "expense" },
    { name: "Maintenance Expense", type: "expense" },
    { name: "Equipment Expense",   type: "expense" },
    { name: "Other Farm Expense",  type: "expense" },
    { name: "Cattle Sales",        type: "income" },
    { name: "Milk Sales",          type: "income" },
    { name: "Loans",               type: "liability" },
    { name: "Payables",            type: "liability" },
    { name: "Owner Capital",       type: "equity" },
    { name: "Retained Earnings",   type: "equity" },
    { name: "Drawings",            type: "equity" },
  ];

  const accountType = (name) => (CHART.find((a) => a.name === name) || {}).type || "expense";
  const accountList = () => CHART.map((a) => a.name);

  const inRange = (d, from, to) => {
    if (!from && !to) return true;
    const t = new Date(d).setHours(0, 0, 0, 0);
    if (from && t < new Date(from).setHours(0, 0, 0, 0)) return false;
    if (to && t > new Date(to).setHours(0, 0, 0, 0)) return false;
    return true;
  };

  const filter = (journal, { from, to, animalId, txnType } = {}) =>
    (journal || []).filter((e) =>
      inRange(e.Date, from, to) &&
      (!animalId || e.AnimalID === animalId) &&
      (!txnType || e.TransactionType === txnType)
    );

  /** Per-account { dr, cr } totals over the filtered journal. */
  const accountTotals = (journal, opts = {}) => {
    const map = {};
    filter(journal, opts).forEach((e) => {
      const amt = Number(e.Amount || 0);
      const dr = e.DebitAccount || "Cash";
      const cr = e.CreditAccount || "Cash";
      if (!map[dr]) map[dr] = { dr: 0, cr: 0 };
      if (!map[cr]) map[cr] = { dr: 0, cr: 0 };
      map[dr].dr += amt;
      map[cr].cr += amt;
    });
    return map;
  };

  /** Trial balance rows + grand totals. */
  const trialBalance = (journal, opts = {}) => {
    const totals = accountTotals(journal, opts);
    const rows = Object.entries(totals)
      .map(([account, b]) => ({ account, dr: b.dr, cr: b.cr }))
      .sort((a, b) => a.account.localeCompare(b.account));
    const totalDr = rows.reduce((s, r) => s + r.dr, 0);
    const totalCr = rows.reduce((s, r) => s + r.cr, 0);
    const difference = Math.round((totalDr - totalCr) * 100) / 100;
    return { rows, totalDr, totalCr, difference, balanced: Math.abs(difference) < 1 };
  };

  /**
   * Classic columnar ledger for one account with running balance.
   * opening = (sum of dr - sum of cr) for entries strictly BEFORE `from`.
   */
  const ledger = (journal, account, { from, to } = {}) => {
    const entries = filter(journal, { from, to })
      .filter((e) => e.DebitAccount === account || e.CreditAccount === account)
      .sort((a, b) => new Date(a.Date) - new Date(b.Date));
    let opening = 0;
    if (from) {
      filter(journal, { to: shift(from, -1) }).forEach((e) => {
        const amt = Number(e.Amount || 0);
        if (e.DebitAccount === account) opening += amt;
        if (e.CreditAccount === account) opening -= amt;
      });
    }
    let bal = opening;
    const rows = entries.map((e) => {
      const amt = Number(e.Amount || 0);
      const dr = e.DebitAccount === account ? amt : 0;
      const cr = e.CreditAccount === account ? amt : 0;
      bal += dr - cr;
      return {
        date: e.Date,
        particulars: e.Description || e.TransactionType || "Entry",
        ref: e.ReferenceID || e.JournalID || "",
        animalId: e.AnimalID || "",
        dr, cr,
        balance: bal,
      };
    });
    return {
      opening,
      rows,
      totalDr: rows.reduce((s, r) => s + r.dr, 0),
      totalCr: rows.reduce((s, r) => s + r.cr, 0),
      closing: bal,
    };
  };

  const shift = (date, days) => {
    const d = new Date(date);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  };

  /**
   * Cash/Bank book: receipts (Dr side) and payments (Cr side) for the account,
   * with opening/closing. Contra entries (both legs cash+bank) flagged.
   */
  const cashBook = (journal, account, { from, to } = {}) => {
    const entries = filter(journal, { from, to })
      .filter((e) => e.DebitAccount === account || e.CreditAccount === account)
      .sort((a, b) => new Date(a.Date) - new Date(b.Date));
    let opening = 0;
    if (from) {
      filter(journal, { to: shift(from, -1) }).forEach((e) => {
        const amt = Number(e.Amount || 0);
        if (e.DebitAccount === account) opening += amt;
        if (e.CreditAccount === account) opening -= amt;
      });
    }
    const receipts = [], payments = [];
    let totalR = 0, totalP = 0;
    entries.forEach((e) => {
      const amt = Number(e.Amount || 0);
      const isContra =
        (e.DebitAccount === "Cash" && e.CreditAccount === "Bank") ||
        (e.DebitAccount === "Bank" && e.CreditAccount === "Cash");
      if (e.DebitAccount === account) {
        receipts.push({ date: e.Date, particulars: e.Description || e.TransactionType, ref: e.ReferenceID || "", amount: amt, contra: isContra });
        totalR += amt;
      }
      if (e.CreditAccount === account) {
        payments.push({ date: e.Date, particulars: e.Description || e.TransactionType, ref: e.ReferenceID || "", amount: amt, contra: isContra });
        totalP += amt;
      }
    });
    return { opening, receipts, payments, totalReceipts: totalR, totalPayments: totalP, closing: opening + totalR - totalP };
  };

  /** P&L: income (Cattle Sales etc.) minus grouped expenses. getExternalIncome() is the integration hook. */
  const getExternalIncome = () => []; // TODO: external income API hook - intentionally empty

  /**
   * Milk income analytics, straight from the milkSales entries (no estimates).
   * Monthly buckets use YYYY-MM so any date range works.
   */
  const milkAnalytics = (sales) => {
    const rows = (sales || []).filter((s) => s.Date).sort((a, b) => String(a.Date).localeCompare(String(b.Date)));
    const months = {};
    rows.forEach((s) => {
      const key = String(s.Date).slice(0, 7);
      const m = (months[key] = months[key] || { month: key, litres: 0, amount: 0, entries: 0 });
      m.litres += Number(s.QuantityLitres || 0);
      m.amount += Number(s.Amount || 0);
      m.entries += 1;
    });
    const monthly = Object.values(months).sort((a, b) => a.month.localeCompare(b.month));
    const totalLitres = rows.reduce((s, x) => s + Number(x.QuantityLitres || 0), 0);
    const totalAmount = rows.reduce((s, x) => s + Number(x.Amount || 0), 0);
    const pending = rows.filter((x) => String(x.PaymentStatus || "").toLowerCase() !== "received")
      .reduce((s, x) => s + Number(x.Amount || 0), 0);
    const shiftSplit = { Morning: 0, Evening: 0 };
    rows.forEach((x) => { const k = x.Shift === "Evening" ? "Evening" : "Morning"; shiftSplit[k] += Number(x.Amount || 0); });
    return {
      entries: rows.length,
      totalLitres: Math.round(totalLitres * 10) / 10,
      totalAmount: Math.round(totalAmount),
      avgRate: totalLitres ? Math.round((totalAmount / totalLitres) * 10) / 10 : 0,
      pending: Math.round(pending),
      monthly,
      shiftSplit,
      last: rows[rows.length - 1] || null,
    };
  };

  /** Month-keyed income/expense series for the finance graphs (from the journal). */
  const monthlySeries = (journal, monthsBack = 6) => {
    const buckets = {};
    const now = new Date();
    for (let i = monthsBack - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      buckets[d.toISOString().slice(0, 7)] = { month: d.toISOString().slice(0, 7), label: d.toLocaleString("en", { month: "short" }), income: 0, expense: 0 };
    }
    (journal || []).forEach((j) => {
      const key = String(j.Date || "").slice(0, 7);
      if (!buckets[key]) return;
      const t = accountType(j.DebitAccount);
      const amt = Number(j.Amount || 0);
      if (t === "income") buckets[key].income += amt;
      else if (t === "expense") buckets[key].expense += amt;
    });
    return Object.values(buckets);
  };

  const pnl = (journal, { from, to } = {}) => {
    const totals = accountTotals(journal, { from, to });
    const income = [], expenses = [];
    let totalIncome = 0, totalExpense = 0;
    Object.entries(totals).forEach(([account, b]) => {
      const type = accountType(account);
      const net = type === "income" ? b.cr - b.dr : b.dr - b.cr;
      if (type === "income" && net !== 0) { income.push({ account, amount: net }); totalIncome += net; }
      if (type === "expense" && net !== 0) { expenses.push({ account, amount: net }); totalExpense += net; }
    });
    getExternalIncome().forEach((x) => { income.push(x); totalIncome += Number(x.amount || 0); });
    income.sort((a, b) => b.amount - a.amount);
    expenses.sort((a, b) => b.amount - a.amount);
    return { income, expenses, totalIncome, totalExpense, net: totalIncome - totalExpense };
  };

  /** Balance sheet from account classification. Balanced when every journal entry is balanced. */
  const balanceSheet = (journal, { from, to } = {}) => {
    const totals = accountTotals(journal, { from, to });
    const assets = [], liabilities = [], equity = [];
    let tA = 0, tL = 0, tE = 0, income = 0, expense = 0;
    Object.entries(totals).forEach(([account, b]) => {
      const type = accountType(account);
      if (type === "asset") { const v = b.dr - b.cr; if (v !== 0) { assets.push({ account, amount: v }); tA += v; } }
      else if (type === "liability") { const v = b.cr - b.dr; if (v !== 0) { liabilities.push({ account, amount: v }); tL += v; } }
      else if (type === "equity") { const v = b.cr - b.dr; if (v !== 0) { equity.push({ account, amount: v }); tE += v; } }
      else if (type === "income") income += b.cr - b.dr;
      else if (type === "expense") expense += b.dr - b.cr;
    });
    const retained = income - expense;
    if (retained !== 0) { equity.push({ account: "Retained Earnings (period)", amount: retained }); tE += retained; }
    const tAssets = Math.round(tA * 100) / 100;
    const tLE = Math.round((tL + tE) * 100) / 100;
    return { assets, liabilities, equity, totalAssets: tA, totalLiabilities: tL, totalEquity: tE, difference: tAssets - tLE, balanced: Math.abs(tA - (tL + tE)) < 1 };
  };

  return { CHART, accountType, accountList, filter, accountTotals, trialBalance, ledger, cashBook, pnl, balanceSheet, getExternalIncome, milkAnalytics, monthlySeries };
})();

  <script>
window.JF = window.JF || {};

/**
 * CareSchedule - age-based preventive-care reminder engine.
 *
 * When a calf is born, this engine schedules its whole care plan as reminders:
 *   first dewormer (default day 14), second dewormer (day 45),
 *   FMD vaccine (day 90), Brucellosis for females (day 150),
 *   BQ + HS vaccines (day 180).
 * All day numbers come from Settings (Health tab) so the farm can tune them.
 *
 * Idempotent: every generated reminder carries ReferenceID "CARE-<AnimalID>-<ruleKey>",
 * so re-syncs update instead of duplicating. Recording the actual deworming/vaccination
 * entry marks the matching care reminder Completed automatically.
 */
JF.CareSchedule = (function () {

  const REF_PREFIX = "CARE-";

  const getCfg = async (key, def) => {
    try {
      const s = await JF.Store.settings.get(key);
      const n = Number(s && s.value);
      return Number.isFinite(n) && n > 0 ? n : def;
    } catch (e) { return def; }
  };

  const ageInDays = (dob) => (dob ? JF.Utils.daysBetween(dob, JF.Utils.todayISO()) : NaN);

  const isFemale = (a) => (a.Gender || "Female") === "Female";

  // Rule definitions; age/lead are resolved from settings at sync time.
  const ruleDefs = [
    { key: "deworm1", type: "Deworming",  label: "First dewormer",   cfg: "CalfFirstDewormAgeDays",   def: 14,  leadCfg: "CalfCareRemindLeadDays", leadDef: 7, store: "deworming",   done: (recs, n) => recs.length >= 1 },
    { key: "deworm2", type: "Deworming",  label: "Second dewormer",  cfg: "CalfSecondDewormAgeDays",  def: 45,  leadCfg: "CalfCareRemindLeadDays", leadDef: 7, store: "deworming",   done: (recs, n) => recs.length >= 2 },
    { key: "fmd",     type: "Vaccination", label: "FMD vaccine",     cfg: "CalfFMDAgeDays",           def: 90,  leadCfg: "CalfCareRemindLeadDays", leadDef: 14, store: "vaccination", match: (r) => /FMD|Foot/i.test(r.Vaccine || ""), done: (recs) => recs.length >= 1 },
    { key: "bruc",    type: "Vaccination", label: "Brucellosis vaccine", cfg: "CalfBrucellaAgeDays",  def: 150, leadCfg: "CalfCareRemindLeadDays", leadDef: 14, store: "vaccination", femaleOnly: true, match: (r) => /Brucell/i.test(r.Vaccine || ""), done: (recs) => recs.length >= 1 },
    { key: "bq",      type: "Vaccination", label: "BQ vaccine",      cfg: "CalfBQAgeDays",            def: 180, leadCfg: "CalfCareRemindLeadDays", leadDef: 14, store: "vaccination", match: (r) => /BQ|Black Quarter/i.test(r.Vaccine || ""), done: (recs) => recs.length >= 1 },
    { key: "hs",      type: "Vaccination", label: "HS vaccine",      cfg: "CalfHSAgeDays",            def: 180, leadCfg: "CalfCareRemindLeadDays", leadDef: 14, store: "vaccination", match: (r) => /HS|Haemorrhagic/i.test(r.Vaccine || ""), done: (recs) => recs.length >= 1 },
  ];

  const statusFor = (dueDate) => {
    const d = JF.Utils.daysBetween(JF.Utils.todayISO(), dueDate);
    if (d < 0) return "Overdue";
    if (d === 0) return "Due Today";
    return "Upcoming";
  };

  // One concurrent sync per animal: two triggers (e.g. calving + the cascade's
  // animals:created) sharing the same promise cannot double-create reminders.
  const inflight = new Map();

  /** Sync (create/update/complete) care reminders for one animal. */
  const syncForAnimal = (animalId) => {
    if (inflight.has(animalId)) return inflight.get(animalId);
    const p = syncForAnimalInner(animalId).finally(() => inflight.delete(animalId));
    inflight.set(animalId, p);
    return p;
  };

  const syncForAnimalInner = async (animalId) => {
    // The sheet-driven RuleEngine supersedes this fixed plan: its calf rules
    // (CF-*, DW-013, DW-017B, VAC-*) cover the same ground but stay editable in
    // the Rules sheet. Keep this engine as the fallback only.
    if (JF.RuleEngine && JF.RuleEngine.isEnabled && JF.RuleEngine.isEnabled()) return 0;
    const a = (await JF.Store.animals.list()).find((x) => x.AnimalID === animalId || x.id === animalId);
    if (!a || !a.DateOfBirth) return 0;
    const dob = a.DateOfBirth;
    const age = ageInDays(dob);
    if (!Number.isFinite(age)) return 0;

    // Active care window: calves up to ~1 year, plus any animal that still has
    // open CARE reminders (so late entries still complete them).
    const existing = (await JF.Store.reminders.list())
      .filter((r) => String(r.ReferenceID || "").startsWith(REF_PREFIX + a.AnimalID));
    const young = age <= 366;
    if (!young && !existing.length) return 0;

    const [dews, vaxs] = await Promise.all([JF.Store.deworming.list(), JF.Store.vaccination.list()]);
    const afterBirth = (list) => list.filter((r) => r.AnimalID === a.AnimalID && (!r.Date && !r.DateGiven || JF.Utils.daysBetween(dob, r.Date || r.DateGiven) >= -3));
    const dewsMine = afterBirth(dews);
    const vaxsMine = afterBirth(vaxs);

    let touched = 0;
    for (const rule of ruleDefs) {
      if (rule.femaleOnly && !isFemale(a)) continue;
      const ageDays = await getCfg(rule.cfg, rule.def);
      const lead = await getCfg(rule.leadCfg, rule.leadDef);
      const refId = `${REF_PREFIX}${a.AnimalID}-${rule.key}`;
      const due = JF.Utils.formatDate(JF.Utils.addDays(dob, ageDays), "yyyy-MM-dd");
      const remindOn = JF.Utils.formatDate(JF.Utils.addDays(due, -lead), "yyyy-MM-dd");
      const records = rule.store === "deworming" ? dewsMine : vaxsMine.filter(rule.match || (() => true));
      const done = rule.done(records);
      const prev = existing.find((r) => r.ReferenceID === refId);

      if (!prev && !young) continue; // do not start new reminders for adults
      // Plan step appears once its reminder date is within 60 days (or already passed).
      const daysToRemind = JF.Utils.daysBetween(JF.Utils.todayISO(), remindOn);
      if (!prev && daysToRemind > 60) continue;

      const payload = {
        ReminderID: `RMN-CARE-${a.AnimalID}-${rule.key}`,
        AnimalID: a.AnimalID,
        ReminderType: rule.type,
        ReferenceID: refId,
        DueDate: due,
        ReminderDate: remindOn,
        Priority: age > ageDays ? "High" : "Normal",
        Status: done ? "Completed" : statusFor(due),
        Notes: `Calf care plan: ${rule.label} (due at ${ageDays}d old)`,
      };
      if (prev) {
        if (prev.Status !== payload.Status || prev.DueDate !== due) {
          await JF.Store.reminders.update(prev.id, payload);
          touched++;
        }
      } else if (!done) {
        await JF.Store.reminders.create(payload);
        touched++;
      }
    }
    return touched;
  };

  /** Sync every animal in the herd. */
  const syncAll = async () => {
    const animals = await JF.Store.animals.list();
    let n = 0;
    for (const a of animals) {
      try { n += await syncForAnimal(a.AnimalID); } catch (e) { console.warn("CareSchedule:", a.AnimalID, e); }
    }
    return n;
  };

  const init = () => {
    // Re-sync when life happens: calf born, dewormer/vaccine recorded.
    const resync = (idGetter) => async (rec) => {
      const id = idGetter(rec);
      if (id) { try { await syncForAnimal(id); } catch (e) {} }
    };
    JF.Cascade.on("calving:created", async (c) => { if (c.CalfID) resync(() => c.CalfID)(c); });
    JF.Cascade.on("animals:created", resync((r) => r.AnimalID || r.id));
    JF.Cascade.on("deworming:created", resync((r) => r.AnimalID));
    JF.Cascade.on("vaccination:created", resync((r) => r.AnimalID));
    // Initial pass after boot/seed (deferred so the store is ready).
    setTimeout(() => syncAll().catch((e) => console.warn("CareSchedule init:", e)), 600);
  };

  return { init, syncAll, syncForAnimal };
})();

  <script>
window.JF = window.JF || {};

/**
 * LifeCycle - the derived cow life-cycle & lactation model.
 *
 * NOTHING here stores new facts; everything is computed from records the farm
 * already entered (calvings, AIs, PDs, treatments, expenses). This is the
 * single source the Calving Board, profile life-cycle card, medical-cost
 * analytics and herd KPIs read from, so all screens agree by construction.
 *
 * Model
 * -----
 * parity          : completed calvings (lactation # = parity)
 * lactation       : starts at each calving; DIM = days in milk since last calving
 * dry period      : a dryoff record ends the lactation (status Dry)
 * expected calving: latest AI + gestation (283d), cancelled by a calving or a
 *                   negative PD after that AI; marked "confirmed" by a positive PD
 * medical cost    : treatments + dewormers + vaccines + medical expense entries
 */
JF.LifeCycle = (function () {

  const MEDICAL_CATEGORIES = ["Veterinary", "Medicine", "Vaccination", "Deworming"];
  const GESTATION_DEFAULT = 283;

  const cfg = async (key, def) => {
    try { const s = await JF.Store.settings.get(key); const n = Number(s && s.value); return Number.isFinite(n) && n > 0 ? n : def; }
    catch (e) { return def; }
  };

  const dateOf = (rec, ...keys) => { for (const k of keys) if (rec && rec[k]) return rec[k]; return null; };
  const byDate = (a, b) => new Date(a) - new Date(b);

  /** Load every store once; returns plain arrays. */
  const loadAll = async () => {
    const keys = ["animals", "calving", "insemination", "pregnancy", "health", "deworming", "vaccination", "expenses", "dryOff"];
    const out = {};
    await Promise.all(keys.map(async (k) => { out[k] = (await (JF.Store[k] || { list: async () => [] }).list().catch(() => [])) || []; }));
    return out;
  };

  const medicalCostOf = (animalId, d) => {
    const parts = { treatments: 0, deworming: 0, vaccination: 0, expenses: 0 };
    d.health.filter((h) => h.AnimalID === animalId).forEach((h) => parts.treatments += Number(h.TreatmentCost || 0));
    d.deworming.filter((x) => x.AnimalID === animalId).forEach((x) => parts.deworming += Number(x.Cost || 0));
    d.vaccination.filter((x) => x.AnimalID === animalId).forEach((x) => parts.vaccination += Number(x.Cost || 0));
    d.expenses.filter((e) => e.AnimalID === animalId && MEDICAL_CATEGORIES.includes(e.Category)).forEach((e) => parts.expenses += Number(e.Amount || 0));
    const total = parts.treatments + parts.deworming + parts.vaccination + parts.expenses;
    // ISO string (not a Date object) so the >= comparisons below are string-safe.
    const yearAgo = JF.Utils.formatDate(JF.Utils.addDays(JF.Utils.todayISO(), -365), "yyyy-MM-dd");
    const last12m =
      d.health.filter((h) => h.AnimalID === animalId && h.Date >= yearAgo).reduce((s, h) => s + Number(h.TreatmentCost || 0), 0) +
      d.deworming.filter((x) => x.AnimalID === animalId && (x.Date || x.DateGiven) >= yearAgo).reduce((s, x) => s + Number(x.Cost || 0), 0) +
      d.vaccination.filter((x) => x.AnimalID === animalId && x.DateGiven >= yearAgo).reduce((s, x) => s + Number(x.Cost || 0), 0) +
      d.expenses.filter((e) => e.AnimalID === animalId && MEDICAL_CATEGORIES.includes(e.Category) && e.Date >= yearAgo).reduce((s, e) => s + Number(e.Amount || 0), 0);
    const events = d.health.filter((h) => h.AnimalID === animalId).length;
    return { parts, total, last12m, events };
  };

  const expectedCalvingOf = (animalId, d, gestation) => {
    const calvAfter = (date) => d.calving.some((c) => c.AnimalID === animalId && (c.Date || c.CalvingDate) > date);
    const ais = d.insemination.filter((x) => x.AnimalID === animalId).sort((a, b) => byDate(b.Date, a.Date));
    for (const ai of ais) {
      if (calvAfter(ai.Date)) return null; // an AI followed by a calving is history
      const pdAfter = d.pregnancy.filter((p) => p.AnimalID === animalId && p.Date > ai.Date).sort((a, b) => byDate(b.Date, a.Date));
      if (pdAfter.length && pdAfter[0].Result === "Negative") continue; // this AI failed; try the previous one
      const confirmed = pdAfter.some((p) => p.Result === "Positive");
      return {
        date: JF.Utils.formatDate(JF.Utils.addDays(ai.Date, gestation), "yyyy-MM-dd"),
        aiDate: ai.Date,
        confirmed,
      };
    }
    return null;
  };

  /** Full life-cycle record for one animal. Pure math on the loaded data. */
  const lifecycleOf = (animal, rawData, gestation) => {
    const d = {
      animals: [], calving: [], insemination: [], pregnancy: [], health: [],
      deworming: [], vaccination: [], expenses: [], dryOff: [],
      ...(rawData || {}),
    };
    const id = animal.AnimalID || animal.id;
    const isFemale = (animal.Gender || "Female") === "Female";
    const calvings = d.calving.filter((c) => c.AnimalID === id).sort((a, b) => byDate(a.Date || a.CalvingDate, b.Date || b.CalvingDate));
    const parity = calvings.length;
    const lastCalving = parity ? (calvings[parity - 1].Date || calvings[parity - 1].CalvingDate) : null;

    // Calving interval: average gap between consecutive calvings (needs 2+).
    let calvingInterval = null;
    if (parity >= 2) {
      const gaps = [];
      for (let i = 1; i < parity; i++) gaps.push(JF.Utils.daysBetween(calvings[i - 1].Date || calvings[i - 1].CalvingDate, calvings[i].Date || calvings[i].CalvingDate));
      const valid = gaps.filter((g) => g > 150 && g < 700); // biologically plausible
      if (valid.length) calvingInterval = Math.round(valid.reduce((s, g) => s + g, 0) / valid.length);
    }

    // Dry-off history ends a lactation.
    const dryOffs = d.dryOff.filter((x) => x.AnimalID === id).sort((a, b) => byDate(b.Date, a.Date));
    const lastDryOff = dryOffs[0] || null;
    const activeLactation = lastCalving && (!lastDryOff || (lastDryOff.Date < lastCalving));

    let dim = null, daysDry = null;
    if (animal.CurrentStatus === "Dry") {
      daysDry = lastDryOff ? JF.Utils.daysBetween(lastDryOff.Date, JF.Utils.todayISO()) : null;
    } else if (animal.CurrentStatus === "Lactating" && activeLactation) {
      dim = JF.Utils.daysBetween(lastCalving, JF.Utils.todayISO());
    }

    const expected = isFemale ? expectedCalvingOf(id, d, gestation || GESTATION_DEFAULT) : null;
    const medical = medicalCostOf(id, d);

    const ageDays = animal.DateOfBirth ? JF.Utils.daysBetween(animal.DateOfBirth, JF.Utils.todayISO()) : null;
    const serviceReady = isFemale && !parity && ageDays != null && ageDays >= 410 && ageDays <= 900; // ~15-30 months, unborn-heifer window

    // Economics verdict: lifetime medical cost vs configured attention threshold.
    const verdict = (medical.total === 0 && !medical.events) ? null
      : (medical.last12m >= 30000 || medical.events >= 5) ? "cost-watch"
      : (medical.last12m >= 15000) ? "watch" : "ok";

    return {
      animalId: id,
      parity,
      lactationNo: parity,
      lastCalving,
      calvingInterval,
      activeLactation,
      dim, daysDry,
      lastDryOff: lastDryOff ? lastDryOff.Date : null,
      expectedCalving: expected,
      medical,
      verdict,
      serviceReady,
      ageDays,
      isFemale,
    };
  };

  /** Compute for the whole herd in one pass. Returns Map(animalId -> lifecycle). */
  const snapshot = async () => {
    const d = await loadAll();
    const gestation = await cfg("GestationDays", GESTATION_DEFAULT);
    const map = new Map();
    (d.animals || []).forEach((a) => map.set(a.AnimalID || a.id, lifecycleOf(a, d, gestation)));
    return { map, data: d, gestation };
  };

  /** Calving Board rows: females with a pending expected calving, soonest first. */
  const calvingBoard = async () => {
    const { map, data } = await snapshot();
    const rows = [];
    for (const a of data.animals) {
      const id = a.AnimalID || a.id;
      if ((a.Gender || "Female") !== "Female" || ["Sold", "Deceased"].includes(a.CurrentStatus)) continue;
      const lc = map.get(id);
      if (!lc || !lc.expectedCalving) continue;
      const daysTo = JF.Utils.daysBetween(JF.Utils.todayISO(), lc.expectedCalving.date);
      const alreadyCalved = lc.lastCalving && lc.lastCalving > lc.expectedCalving.aiDate;
      if (alreadyCalved) continue;
      rows.push({
        animal: a,
        lc,
        daysTo,
        urgency: daysTo < 0 ? "overdue" : daysTo <= 7 ? "this-week" : daysTo <= 30 ? "soon" : "later",
        dryOffDue: daysTo <= 60 && a.CurrentStatus === "Lactating", // standard ~45-60d dry period
      });
    }
    rows.sort((x, y) => x.daysTo - y.daysTo);
    return rows;
  };

  /** Per-animal medical economics, sorted worst first (for Finance/Analytics). */
  const medicalEconomics = async () => {
    const { map, data } = await snapshot();
    return data.animals
      .map((a) => ({ animal: a, lc: map.get(a.AnimalID || a.id) }))
      .filter((x) => x.lc && (x.lc.medical.total > 0 || x.lc.medical.events > 0))
      .sort((x, y) => y.lc.medical.last12m - x.lc.medical.last12m || y.lc.medical.total - x.lc.medical.total);
  };

  /* ---------- Automatic status transitions ---------- */

  // Restore the pre-illness status when a case is marked Recovered/Closed.
  // A RECOVERY entry is the farmer saying "she's well": any earlier case still
  // marked open is closed with it, so the animal never stays stuck in Sick.
  const restoreAfterRecovery = async (animalId) => {
    let animals = await JF.Store.animals.list();
    let a = animals.find((x) => x.AnimalID === animalId || x.id === animalId);
    if (!a) return false;

    const healths = (await JF.Store.health.list()).filter((h) => h.AnimalID === animalId);
    const openCases = healths.filter((h) => ["Open", "Under Treatment", "Follow-up Required"].includes(h.RecoveryStatus));
    for (const h of openCases) {
      await JF.Store.health.update(h.id, {
        RecoveryStatus: "Recovered",
        Notes: [h.Notes, "Closed automatically when a later recovery entry was recorded."].filter(Boolean).join(" "),
      });
    }
    // Re-read: those updates may have already triggered a restore.
    animals = await JF.Store.animals.list();
    a = animals.find((x) => x.AnimalID === animalId || x.id === animalId);
    if (!a) return false;
    if (!["Under Treatment", "Sick"].includes(a.CurrentStatus)) return false;
    // Restore to the reproductive state the records imply: a cow still inside a
    // lactation (calved, not dried off since) goes back to Lactating; otherwise Open.
    const lactationStart = a.LactationStart || a.LastCalvingDate || null;
    const driedSince = a.DryOffDate && lactationStart && a.DryOffDate >= lactationStart;
    const inMilk = lactationStart && !driedSince;
    const fallback = (a.Gender || "Female") === "Female"
      ? (a.PreviousStatus || (inMilk ? "Lactating" : "Open"))
      : (a.PreviousStatus || "Active");
    await JF.Store.animals.update(a.id, { CurrentStatus: fallback, PreviousStatus: null, UpdatedAt: new Date().toISOString() });
    JF.Toast && JF.Toast.show(`${a.Name || animalId} back to ${fallback} — recovery recorded.`, "success");
    return true;
  };

  // Age-based promotions: Calf -> Heifer / Young Bull at ~6 months.
  const runAgePromotions = async () => {
    const animals = await JF.Store.animals.list();
    let n = 0;
    for (const a of animals) {
      if (!a.DateOfBirth || ["Sold", "Deceased"].includes(a.CurrentStatus)) continue;
      const age = JF.Utils.daysBetween(a.DateOfBirth, JF.Utils.todayISO());
      if (a.CurrentStatus === "Calf" && age >= 180) {
        const next = (a.Gender || "Female") === "Female" ? "Heifer" : "Young Bull";
        await JF.Store.animals.update(a.id, { CurrentStatus: next, Category: next, UpdatedAt: new Date().toISOString() });
        n++;
      } else if (a.CurrentStatus === "Heifer" && (a.Category || "") !== "Heifer") {
        await JF.Store.animals.update(a.id, { Category: "Heifer", UpdatedAt: new Date().toISOString() });
      }
    }
    return n;
  };

  const init = () => {
    // A recovery entry (new or edited) releases the animal from Sick/Under Treatment.
    JF.Cascade.on("health:created", async (h) => {
      if (h.AnimalID && ["Recovered", "Closed"].includes(h.RecoveryStatus)) await restoreAfterRecovery(h.AnimalID);
    });
    // NOTE: the adapter bridge forwards the updated record itself (not {before,after}),
    // so accept either shape.
    JF.Cascade.on("health:updated", async (payload) => {
      const rec = payload && payload.after ? payload.after : payload;
      if (rec && rec.AnimalID && ["Recovered", "Closed"].includes(rec.RecoveryStatus)) await restoreAfterRecovery(rec.AnimalID);
    });

    // Calving completes a lactation cycle: mother → Lactating Cow, parity stamped.
    JF.Cascade.on("calving:created", async (c) => {
      if (!c.AnimalID) return;
      const animals = await JF.Store.animals.list();
      const a = animals.find((x) => x.AnimalID === c.AnimalID || x.id === c.AnimalID);
      if (!a) return;
      const parity = (await JF.Store.calving.list()).filter((x) => x.AnimalID === c.AnimalID).length;
      const date = c.Date || c.CalvingDate || JF.Utils.todayISO();
      await JF.Store.animals.update(a.id, {
        CurrentStatus: "Lactating", Category: "Cow", PreviousStatus: null,
        LastCalvingDate: date, LactationStart: date, CalvingCount: parity,
        DryOffDate: null, UpdatedAt: new Date().toISOString(),
      });
    });

    // Dry-off ends the lactation.
    JF.Cascade.on("dryOff:created", async (r) => {
      if (!r.AnimalID) return;
      const animals = await JF.Store.animals.list();
      const a = animals.find((x) => x.AnimalID === r.AnimalID || x.id === r.AnimalID);
      if (!a) return;
      await JF.Store.animals.update(a.id, {
        CurrentStatus: "Dry", DryOffDate: r.Date || JF.Utils.todayISO(),
        CurrentGroup: "Dry Lot", UpdatedAt: new Date().toISOString(),
      });
      // A dry cow heading to calving deserves a pre-calving check reminder.
      if (r.ExpectedCalvingDate) {
        const remindOn = JF.Utils.formatDate(JF.Utils.addDays(r.ExpectedCalvingDate, -7), "yyyy-MM-dd");
        await JF.Cascade.makeReminder({
          ReminderID: `RMN-DRY-${JF.Utils.uid("dry")}`,
          AnimalID: r.AnimalID,
          ReminderType: "Expected Calving",
          ReferenceID: r.id,
          DueDate: r.ExpectedCalvingDate,
          ReminderDate: remindOn,
          Notes: "Pre-calving check — move to maternity pen, keep a close watch.",
          Priority: "High",
        });
      }
    });

    // Age promotions: on boot and whenever animals change.
    JF.Cascade.on("animals:created", () => runAgePromotions().catch(() => {}));
    setTimeout(() => runAgePromotions().catch(() => {}), 900);
  };

  return { loadAll, lifecycleOf, snapshot, calvingBoard, medicalEconomics, restoreAfterRecovery, runAgePromotions, MEDICAL_CATEGORIES, init };
})();

window.JF = window.JF || {};

/**
 * PhotoUpload - animal photos stored with the farm's backend, offline fallback.
 *
 * Live mode (farm API configured): the photo is compressed in-browser to a
 * data URL and sent to the Node.js API ("uploadFile" action), which stores it
 * in MongoDB GridFS and returns an embed-safe URL. That URL is saved with the
 * record, so every device shows the real photo.
 *
 * Offline mode (no backend yet): a deterministic SVG portrait is generated
 * locally so the UI still works; it is swapped for the real photo once the
 * backend is configured.
 */
JF.PhotoUpload = (function () {

  const MAX_DIM = 1024;   // px - longest edge after downscale
  const JPEG_QUALITY = 0.82;

  const isDataUrl = (u) => typeof u === "string" && u.startsWith("data:image");
  const isStoredLink = isDataUrl; // legacy alias - now means "any stored/remote link"

  /**
   * A base64 data URL can be large, so when the backend is live we only persist
   * real server links; the device-local copy stays in the local store so the UI
   * still shows it offline.
   */
  const remoteSafeUrl = (u) => (backendLive() && isDataUrl(u) ? null : u || null);

  /** True when a real backend adapter with upload support is connected. */
  const backendLive = () => {
    try {
      const ad = JF.Store && JF.Store.getAdapter ? JF.Store.getAdapter() : null;
      return !!(ad && typeof ad.uploadFile === "function" && !ad.isPlaceholder);
    } catch (e) { return false; }
  };

  /** Read + compress an image file to a JPEG data URL (longest edge MAX_DIM). */
  const fileToDataUrl = (file) => new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error("Not an image file")); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error("Could not read image"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });

  /**
   * Push a data URL to the farm API. Returns the file descriptor:
   * { url (embed-safe), pageUrl, fileId, folder }.
   */
  const uploadToServer = async (dataUrl, meta = {}) => {
    const adapter = JF.Store.getAdapter();
    if (!adapter || typeof adapter.uploadFile !== "function") throw new Error("Backend does not support file uploads");
    const res = await adapter.uploadFile({ dataUrl, ...meta });
    const url = res && (res.url || res.thumbUrl || res.FileURL);
    if (!url) throw new Error("Backend returned no file URL");
    return { url, pageUrl: res.pageUrl || null, fileId: res.fileId || null, folder: res.folder || null };
  };

  /**
   * Full pipeline: file -> compress -> (server | local fallback).
   * Returns { url, pageUrl, fileId, folder, mode: "drive" | "local" }.
   */
  const processFile = async (file, meta = {}) => {
    const dataUrl = await fileToDataUrl(file);
    if (backendLive()) {
      try {
        const up = await uploadToServer(dataUrl, meta);
        return { ...up, mode: "drive" };
      } catch (e) {
        console.warn("Server upload failed, keeping local copy:", e);
        JF.Toast && JF.Toast.show("Server upload failed - file saved on this device only.", "warning");
      }
    }
    return { url: dataUrl, pageUrl: null, fileId: null, folder: null, mode: "local" };
  };

  /** Record the file in the Files index and (optionally) on the animal master. */
  const attachToAnimal = async ({ animalId, url, pageUrl = null, kind = "Profile", fileName = "photo.jpg", category = "Animal" }) => {
    await JF.Store.files.create({
      FileID: `FILE-${JF.Utils.uid()}`,
      FileName: fileName,
      Category: category,
      FileType: /^data:image/.test(url) || /\.(jpg|jpeg|png|webp)$/i.test(fileName) ? "image" : "document",
      AnimalID: animalId || null,
      RecordType: kind,
      RecordID: animalId || null,
      DriveURL: pageUrl || (isStoredLink(url) ? url : null), // legacy field name kept for old records
      LocalURL: remoteSafeUrl(url),
      UploadDate: JF.Utils.todayISO(),        Notes: isStoredLink(url) ? "Stored on the farm server" : "Stored on this device (backend not connected)",
    });
    if (animalId && kind === "Profile") {
      const safe = remoteSafeUrl(url);
      if (!safe) {
        // Server upload failed while a live backend is configured - keep the local
        // copy visible but never push base64 into the sheet.
        JF.Toast && JF.Toast.show("Photo kept on this device only - retry the upload when online.", "warning");
        return;
      }
      const animals = await JF.Store.animals.list();
      const a = animals.find((x) => x.AnimalID === animalId || x.id === animalId);
      if (a) await JF.Store.animals.update(a.id, { PhotoURL: safe });
    }
  };

  /**
   * Upload a DOCUMENT (bill, certificate, vet paper) to the farm server and index it.
   * Documents are not compressed - any file type is accepted as-is.
   */
  const uploadDocument = async (file, { category = "Other", animalId = "", kind = "Document", recordId = "" } = {}) => {
    if (!file) throw new Error("No file selected");
    const dataUrl = await fileToDataUrlAny(file);
    let res;
    if (backendLive()) {
      try {
        res = { ...(await uploadToServer(dataUrl, { animalId, kind, category, fileName: file.name, recordId })), mode: "drive" };
      } catch (e) {
        console.warn("Server document upload failed:", e);
      }
    }
    if (!res) res = { url: dataUrl, pageUrl: null, mode: "local" };
    await JF.Store.files.create({
      FileID: `FILE-${JF.Utils.uid()}`,
      FileName: file.name,
      Category: category,
      FileType: /^image\//.test(file.type) ? "image" : "document",
      AnimalID: animalId || null,
      RecordType: kind,
      RecordID: recordId || animalId || null,
      DriveURL: res.pageUrl || null,
      LocalURL: remoteSafeUrl(res.url),
      UploadDate: JF.Utils.todayISO(),
      Notes: res.mode === "drive" ? "Stored on the farm server" : "Stored on this device (backend not connected)",
    });
    return res;
  };

  /** Read any file (image or document) as a data URL - no canvas downscale. */
  const fileToDataUrlAny = (file) => new Promise((resolve, reject) => {
    if (!file) { reject(new Error("No file")); return; }
    if (file.size > 8 * 1024 * 1024) { reject(new Error("File is larger than 8MB")); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.readAsDataURL(file);
  });

  /* ---------- Reusable form widget ---------- */

  const photoField = (opts = {}) => {
    const state = { file: null, previewUrl: opts.currentUrl || "" };
    const wrap = JF.Utils.el("div", { class: "field" });
    wrap.appendChild(JF.Utils.el("label", { class: "field__label" }, opts.label || "Animal photo"));

    const preview = JF.Utils.el("img", {
      class: "photo-picker__preview",
      src: opts.currentUrl || JF.Utils.portraitSVG(opts.animalId || "new-animal", opts.species || "cattle"),
      alt: "Photo preview",
    });
    const input = JF.Utils.el("input", { type: "file", accept: "image/*", class: "photo-picker__input", id: opts.inputId || "photo-input" });
    const hint = JF.Utils.el("div", { class: "field__hint", id: (opts.inputId || "photo-input") + "-hint" },
      backendLive() ? "Uploads to the farm server." : "Backend not connected yet - photo will be stored on this device only.");

    input.addEventListener("change", async () => {
      const f = input.files && input.files[0];
      if (!f) return;
      hint.textContent = "Processing photo...";
      try {
        const previewUrl = await fileToDataUrl(f);
        preview.src = previewUrl;
        state.file = f;
        state.previewUrl = previewUrl;
        hint.textContent = backendLive()
          ? "Ready - will upload to the server on save."
          : "Ready - will be stored on this device only (farm API not connected).";
      } catch (e) {
        hint.textContent = "Could not read that image - try a JPG or PNG.";
        state.file = null;
      }
    });

    const row = JF.Utils.el("div", { class: "photo-picker" }, [preview, input]);
    wrap.appendChild(row);
    wrap.appendChild(hint);
    wrap._state = state;
    return wrap;
  };

  /** Consume the widget's chosen file after Save is pressed. Returns final URL or "". */
  const consume = async (photoFieldEl, meta = {}) => {
    const st = photoFieldEl && photoFieldEl._state;
    if (!st || !st.file) return "";
    const res = await processFile(st.file, meta);
    return res.url;
  };

  const init = () => { /* no global wiring needed; widgets are per-form */ };

  return { processFile, attachToAnimal, uploadDocument, photoField, consume, backendLive, fileToDataUrl, fileToDataUrlAny, isDriveLink: isStoredLink, uploadToDrive: uploadToServer };
})();

  <script>
JF.Data = JF.Data || {};

JF.Data.MockAdapter = (function () {
  const LS_KEY = "jf_mock_db_v1";
  const { Interface, entities } = JF.Data.DataAdapter;

  class MockAdapter extends Interface {
    constructor() {
      super();
      this.listeners = new Map();
      this.db = this._load();
    }

    _default() {
      const d = {};
      entities.forEach((e) => { d[e] = {}; });
      d._meta = { seq: {} };
      return d;
    }

    _load() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return this._default();
        const p = JSON.parse(raw);
        entities.forEach((e) => { if (!p[e]) p[e] = {}; });
        if (!p._meta) p._meta = { seq: {} };
        return p;
      } catch (e) {
        console.warn("MockAdapter load failed:", e);
        return this._default();
      }
    }

    _save() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.db)); } catch (e) { console.warn(e); } }

    seq(entity) {
      // Sequence counters persist inside the mock DB itself (_meta), so the UI layer
      // never needs localStorage for ID generation.
      const s = ((this.db._meta?.seq?.[entity]) || 0) + 1;
      if (!this.db._meta) this.db._meta = {};
      if (!this.db._meta.seq) this.db._meta.seq = {};
      this.db._meta.seq[entity] = s;
      this._save();
      return s;
    }

    getSeq(entity) { return (this.db._meta?.seq?.[entity]) || 0; }

    on(evt, fn) { if (!this.listeners.has(evt)) this.listeners.set(evt, new Set()); this.listeners.get(evt).add(fn); return () => this.listeners.get(evt)?.delete(fn); }
    emit(evt, payload) { (this.listeners.get(evt) || []).forEach((fn) => { try { fn(payload); } catch (e) { console.error(e); } }); (this.listeners.get("*") || []).forEach((fn) => { try { fn({ event: evt, payload }); } catch (e) {} }); }

    async list(entity) { return Object.values(this.db[entity] || {}); }
    async get(entity, id) { return this.db[entity]?.[id] || null; }
    async find(entity, predicate) { return (await this.list(entity)).filter(predicate); }
    async create(entity, data) {
      if (!this.db[entity]) this.db[entity] = {};
      const id = data.id || data[`${entity.slice(0,1).toUpperCase()}${entity.slice(1)}ID`] || `${entity}_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
      const rec = {
        ...data,
        id,
        CreatedAt: data.CreatedAt || new Date().toISOString(),
        UpdatedAt: new Date().toISOString(),
      };
      this.db[entity][id] = rec;
      this._save();
      this.emit(`${entity}:created`, rec);
      this.emit("change", { entity, action: "create", id, record: rec });
      return rec;
    }
    async update(entity, id, patch) {
      const prev = this.db[entity]?.[id];
      if (!prev) return null;
      const rec = { ...prev, ...patch, UpdatedAt: new Date().toISOString(), id: prev.id };
      this.db[entity][id] = rec;
      this._save();
      this.emit(`${entity}:updated`, { before: prev, after: rec });
      this.emit("change", { entity, action: "update", id, record: rec });
      return rec;
    }
    async delete(entity, id) {
      const rec = this.db[entity]?.[id];
      if (!rec) return null;
      delete this.db[entity][id];
      this._save();
      this.emit(`${entity}:deleted`, rec);
      this.emit("change", { entity, action: "delete", id, record: rec });
      return rec;
    }
    async seed(initial) {
      // Fresh replace, preserving sequence counters.
      const oldSeq = this.db._meta?.seq || {};
      entities.forEach((e) => {
        this.db[e] = {};
        (initial?.[e] || []).forEach((r) => { this.db[e][r.id || r.AnimalID || Object.keys(this.db[e]).length] = r; });
      });
      this.db._meta = { seq: oldSeq, ...(initial?._meta || {}) };
      this._save();
      this.emit("seeded", {});
      return true;
    }
    async clear() { this.db = this._default(); this._save(); this.emit("cleared", {}); return true; }
    async exportRaw() { return JSON.parse(JSON.stringify(this.db)); }
  }

  return MockAdapter;
})();

JF.Data = JF.Data || {};

/**
 * MongoApiAdapter - talks to the farm's Node.js API (Express + MongoDB driver).
 *
 * The website is a static GitHub Pages client; MongoDB can only be reached
 * through a small server that holds the connection string. This adapter speaks
 * the SAME action protocol the app already uses, so every view, the rule engine
 * and the cascade layer work unchanged:
 *
 *   POST {endpoint}  { action, payload }   ->  { success, data | error }
 *
 * Actions: ping | list | get | create | update | delete | seed | clear |
 *          uploadFile | seedRules | syncRules | exportBackup
 *
 * One MongoDB collection per entity (animals, heat, rules, settings, ...),
 * mirroring the farm's record kinds so nothing is re-modelled.
 *
 * Offline/stub mode: until a real API URL is configured (Settings), calls
 * resolve with empty data instead of hitting the network - the app never
 * loses local data because of this, and PhotoUpload's backendLive() gate
 * keeps files on the device.
 */

JF.Data.MongoApiAdapter = (function () {
  const { Interface } = JF.Data.DataAdapter;
  console.info("[JF] MongoApiAdapter v4 — bootstrap batching + entity cache active");

  // Entities that an older server deployment (API v1.0.x) does not recognise.
  // While the capability probe reports an old server, these are served as
  // empty lists WITHOUT a request — no 400s in the console, no lag.
  const NEWER_ENTITIES = new Set(["insemination", "dryOff", "death", "groups"]);

  // Farm API defaults baked into the code, so every device connects with zero
  // setup. Settings can still override them (localStorage wins when present).
  const DEFAULT_ENDPOINT = "https://jagt-farm-api.onrender.com";
  const DEFAULT_TOKEN = "jagt-farm-secret-9271-kxnq";

  class MongoApiAdapter extends Interface {
    constructor() {
      super();
      // Only trust a stored endpoint that is a bare origin (https://host or
      // https://host/). Anything with a path tail means someone pasted the URL
      // and token into one field - ignore it and use the baked-in default.
      const stored = (() => { try { return localStorage.getItem("jf_api_endpoint"); } catch (e) { return null; } })();
      const clean = String(stored || "").trim();
      this.endpoint = /^https?:\/\/[^/]+\/?$/.test(clean) ? clean : DEFAULT_ENDPOINT;
      const storedTok = (() => { try { return localStorage.getItem("jf_api_token"); } catch (e) { return null; } })();
      this.token = storedTok != null ? storedTok : DEFAULT_TOKEN;
      this.listeners = new Map();
      this.lastStatus = null;
      // Real whenever the endpoint is usable (the baked-in default qualifies),
      // so homeOf() reports "mongo" and the boot log shows the true backend.
      this.isPlaceholder = !this._isRealEndpoint();
      // ---- Speed layer -------------------------------------------------
      // Render's free tier cold-starts after ~15 idle minutes, so every extra
      // round trip can cost seconds. The whole boot payload (rules, params,
      // animals, entries, reminders...) is fetched in ONE "bootstrap" call at
      // page load and served from a short-lived in-memory cache afterwards;
      // any write drops that entity's cache entry. A localStorage snapshot
      // per entity keeps the app usable when the API is unreachable.
      this._cache = new Map(); // entity -> { at, rows }
      this._cacheTTL = 30000; // 30s of instant navigation
      this._serverCapabilities = null; // set by warmup()'s version probe
    }

    _cacheGet(entity) {
      const c = this._cache.get(entity);
      if (!c) return null;
      if (Date.now() - c.at > this._cacheTTL) { this._cache.delete(entity); return null; }
      return c.rows.map((r) => ({ ...r })); // copies: callers may mutate freely
    }
    _cacheSet(entity, rows) { if (Array.isArray(rows)) this._cache.set(entity, { at: Date.now(), rows }); }
    _cacheDrop(entity) { this._cache.delete(entity); }
    _snapshot(entity, rows) { try { localStorage.setItem(`jf_snap_${entity}`, JSON.stringify(rows)); } catch (e) { /* quota — ignore */ } }
    _snapshotGet(entity) {
      try {
        const rows = JSON.parse(localStorage.getItem(`jf_snap_${entity}`) || "null");
        return Array.isArray(rows) ? rows.map((r) => ({ ...r })) : null;
      } catch (e) { return null; }
    }

    /**
     * Warm the server AND the cache with a single round trip. Called at page
     * parse time (fire and forget) so the Render cold start overlaps with
     * font/CSS/JS loading instead of blocking the first view.
     */
    async warmup() {
      try {
        // Version gate: ask GET / (always 200, never a console error) whether
        // this deployment knows the bootstrap action (1.1.0+). On an older
        // server we skip straight to the ping fallback — no 400 in the console.
        let supportsBootstrap = true;
        try {
          const res = await fetch(this.endpoint, { method: "GET" });
          const info = await res.json();
          const v = String(info?.data?.version || "1.0.0");
          supportsBootstrap = v.split(".").map(Number)[1] >= 1 || Number(v.split(".")[0]) > 1;
        } catch (e) { /* opaque — optimistically try bootstrap anyway */ }
        this._serverCapabilities = { bootstrap: supportsBootstrap };
        if (!supportsBootstrap) {
          await this._call("ping", {}, { quiet: true });
          return {};
        }
        const data = await this._call("bootstrap", {}, { quiet: true });
        if (data && typeof data === "object") {
          Object.entries(data).forEach(([entity, rows]) => {
            if (Array.isArray(rows)) { this._cacheSet(entity, rows); this._snapshot(entity, rows); }
          });
          console.info(`[JF] Bootstrap: ${Object.keys(data).length} collections fetched in ONE round trip.`);
        }
        return data;
      } catch (e) {
        // Old server without the bootstrap action? A successful ping still
        // proves the API is alive (return {} so the caller stays in mongo mode).
        try { await this._call("ping", {}, { quiet: true }); return {}; } catch (e2) { return null; }
      }
    }

    configure({ endpoint, token } = {}) {
      if (endpoint !== undefined) {
        // Store only bare origins; anything with a path tail (a URL+token paste)
        // is replaced by the baked-in default so it can never poison the app.
        const clean = String(endpoint || "").trim();
        this.endpoint = /^https?:\/\/[^/]+\/?$/.test(clean) ? clean : DEFAULT_ENDPOINT;
        try { localStorage.setItem("jf_api_endpoint", this.endpoint); } catch (e) {}
      }
      if (token !== undefined) { this.token = token; try { localStorage.setItem("jf_api_token", token); } catch (e) {} }
      this.isPlaceholder = !this._isRealEndpoint();
      this._serverCapabilities = null; // re-probe the (possibly new) server on next warmup
    }

    _isRealEndpoint() {
      const ep = String(this.endpoint || "");
      return !!ep && !/YOUR_API_URL|localhost-placeholder/i.test(ep);
    }

    async _call(action, payload = {}, { quiet = false } = {}) {
      if (!this._isRealEndpoint()) {
        if (!quiet) console.warn(`[MongoApi] Offline stub mode (${action}) - configure the farm API URL in Settings to go live.`);
        return this._fallback(action, payload);
      }
      try {
        const res = await fetch(this.endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, payload, token: this.token || "" }),
        });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch (parseErr) {
          if (/<\s*(!doctype|html|body)/i.test(text)) throw new Error("The API URL answered with a web page instead of JSON - check that it points at the farm API (e.g. https://jagt-api.onrender.com).");
          throw new Error("The API URL answered with something the app cannot read (status " + res.status + ").");
        }
        if (!json.success) throw new Error(json.error || "Farm API call failed");
        return json.data;
      } catch (err) {
        // Known, handled degradations (old server missing a newer entity/action)
        // get ONE short line — the call sites already cope, so a full stack
        // trace would be noise, not signal.
        if (/Unknown (entity|action)/i.test(String(err.message))) {
          console.warn(`[MongoApi:${action}] ${err.message} (older server deploy — the site degrades gracefully; redeploying the API removes this).`);
        } else if (!quiet) {
          console.error(`[MongoApi:${action}]`, err);
        }
        throw err;
      }
    }

    async _fallback(action, payload) {
      if (action === "list" || action === "listFiles") return [];
      if (action === "get") return null;
      if (action === "create") return { ...(payload?.data || {}), id: "offline_" + Date.now() };
      if (action === "update") return { ...(payload?.patch || {}) };
      if (action === "delete") return true;
      return null;
    }

    /** Ping the farm API: connection + collection counts. */
    async testConnection() {
      if (!this._isRealEndpoint()) throw new Error("No farm API URL configured yet. Deploy the Node API (server/) and paste its URL first.");
      const status = await this._call("ping");
      this.lastStatus = status;
      return status;
    }

    /** End-to-end health check: a real write/read/delete round trip in MongoDB. */
    async verify() {
      const res = await this._call("verify");
      this.lastStatus = res;
      return res;
    }

    on(evt, fn) {
      if (!this.listeners.has(evt)) this.listeners.set(evt, new Set());
      this.listeners.get(evt).add(fn);
    }

    emit(evt, p) { (this.listeners.get(evt) || []).forEach((fn) => fn(p)); }

    async list(entity) {
      // Old server deployment: entities it does not know are served as empty
      // straight away — no request, no 400, no console noise. The capability
      // flag refreshes on every boot (warmup), so redeploying the API simply
      // turns this branch off.
      if (this._serverCapabilities && !this._serverCapabilities.bootstrap && NEWER_ENTITIES.has(entity)) return [];
      const hit = this._cacheGet(entity);
      if (hit) return hit;
      try {
        const rows = await this._call("list", { entity });
        this._cacheSet(entity, rows);
        this._snapshot(entity, rows);
        return rows.map((r) => ({ ...r }));
      } catch (err) {
        // API unreachable (cold start timeout, network drop): serve the last
        // known rows so the farm stays readable. Writes will still fail —
        // exactly as before — but the screen is never blank.
        const snap = this._snapshotGet(entity);
        if (snap && snap.length) {
          console.warn(`[MongoApi:list] ${entity} unreachable — showing last-known snapshot (${snap.length} rows).`);
          return snap;
        }
        // "Unknown entity" = the server is older than the site code (needs a
        // Render redeploy). Log ONE short line instead of a full error stack —
        // the app already degrades gracefully on every call site.
        if (/Unknown entity/i.test(String(err.message))) {
          console.warn(`[MongoApi] server does not know "${entity}" yet (older deploy) — treating as empty.`);
          return [];
        }
        throw err;
      }
    }
    async get(entity, id) { return this._call("get", { entity, id }); }

    async create(entity, data) {
      const r = await this._call("create", { entity, data });
      this._cacheDrop(entity);
      this.emit(`${entity}:created`, r);
      this.emit("change", { entity, action: "create", record: r });
      return r;
    }

    async update(entity, id, patch) {
      const r = await this._call("update", { entity, id, patch });
      this._cacheDrop(entity);
      this.emit(`${entity}:updated`, r);
      this.emit("change", { entity, action: "update", id, record: r });
      return r;
    }

    async delete(entity, id) {
      const r = await this._call("delete", { entity, id });
      this._cacheDrop(entity);
      this.emit(`${entity}:deleted`, r);
      this.emit("change", { entity, action: "delete", id, record: r });
      return r;
    }

    async seed(data) { return this._call("seed", { data }); }

    /** Install the farm's default rulebook (upsert mode: edits are preserved). */
    async seedRules(book) {
      const src = book || (JF.RuleBook && JF.RuleBook.seedPayload()) || {};
      return this._call("seedRules", {
        rules: src.rules || [],
        params: src.ruleParameters || src.params || src.parameters || [],
        overrides: src.overrides || [],
        upsert: true,
      });
    }

    /** Push this device's full rule configuration into MongoDB (update mode). */
    async syncRules(book) { return this.seedRules(book); }

    /**
     * Upload a file (photo/document) to the farm API - stored in MongoDB
     * GridFS so image bytes live with the records they belong to.
     */
    async uploadFile({ dataUrl, animalId = "", kind = "Profile", category = "", fileName = "file", recordId = "" } = {}) {
      if (!dataUrl) throw new Error("No file data provided");
      const m = String(dataUrl).match(/^data:([\w.+-]+\/[\w.+-]+);base64,(.+)$/);
      if (!m) throw new Error("File must be a base64 data URL");
      return this._call("uploadFile", { mimeType: m[1], base64: m[2], animalId, kind, category, recordId, fileName });
    }

    async exportBackup() { return this._call("exportBackup"); }
    async clear() { return this._call("clear", {}); }
  }

  return MongoApiAdapter;
})();

  <script>
JF.Store = (function () {
  let adapter;
  let dataAdapter; // farm DATA adapter (MongoDB farm API or the local mock)
  let backend = "mock";
  let bridged = false; // set true once app.js bridges events to the CascadeEngine

  /**
   * SINGLE BACKEND: farm data (animals, heat, milk, expenses, reminders...)
   * AND the three rule entities (Rules / Rule_Parameters / Rule_Overrides)
   * all live in the same adapter - MongoDB through the farm API, or this
   * device in offline mode. The former Google Sheet rulebook layer has been
   * removed; rules are edited in the app's Rules screen and saved to MongoDB.
   */
  const RULE_ENTITIES = new Set(["rules", "ruleParameters", "ruleOverrides"]);
  const makeComposite = (data, sheet) => {
    const routed = (entity) => (RULE_ENTITIES.has(entity) ? sheet : data);
    return {
      // Identity/behaviour used by views and the RuleEngine
      isPlaceholder: data.isPlaceholder,
      get dataBackend() { return data; },
      get sheetBackend() { return sheet; },
      // CRUD is routed per entity
      list: (entity) => routed(entity).list(entity),
      get: (entity, id) => routed(entity).get(entity, id),
      create: (entity, rec) => routed(entity).create(entity, rec),
      update: (entity, id, patch) => routed(entity).update(entity, id, patch),
      delete: (entity, id) => routed(entity).delete(entity, id),
      // Whole-store operations stay with the DATA adapter (never wipe the sheet)
      seed: (d) => data.seed(d),
      clear: () => data.clear(),
      exportBackup: () => data.exportBackup ? data.exportBackup() : Promise.reject(new Error("not supported")),
      // Diagnostics for both halves
      testConnection: () => data.testConnection(),
      verify: () => data.verify ? data.verify() : Promise.reject(new Error("not supported")),
      testRuleSheet: () => sheet.testConnection(),
      verifyRuleSheet: () => sheet.verify(),
      // Bulk rule installs still make sense on both sides (the sheet adapter
      // falls through to data when no sheet URL is set)
      seedRules: (payload) => sheet.seedRules(payload),
      syncRules: (payload) => sheet.syncRules(payload),
      // Event bus (events flow through the data adapter like before)
      on: (...a) => data.on(...a),
      emit: (...a) => data.emit(...a),
    };
  };

  const init = (type) => {
    const savedType = type || localStorage.getItem("jf_backend") || "mock";
    backend = savedType;
    if (savedType === "mongo") dataAdapter = new JF.Data.MongoApiAdapter();
    else dataAdapter = new JF.Data.MockAdapter();
    adapter = makeComposite(dataAdapter, dataAdapter);
    return adapter;
  };

  const isBridged = () => bridged;
  const markBridged = () => { bridged = true; };

  const getAdapter = () => adapter;
  const setBackend = (type) => {
    try { localStorage.setItem("jf_backend_user", "1"); } catch (e) {} // pins the user's choice against self-heal
    try { localStorage.setItem("jf_backend", type); } catch (e) {}
    return init(type); // rebuilds the adapter
  };
  /** Kept for compatibility - the Google Sheet rulebook layer is removed. */
  const configureRuleSheet = () => {};
  const getRuleSheetAdapter = () => null;
  /** Which adapter actually holds a given entity right now (for UI hints). */
  const homeOf = (entity) => (backend === "mongo" && dataAdapter && !dataAdapter.isPlaceholder ? "mongo" : "device");
  const on = (...a) => adapter.on(...a);
  const emit = (...a) => adapter.emit(...a);

  const wrapEntity = (entity) => ({
    list: () => adapter.list(entity),
    get: (id) => adapter.get(entity, id),
    find: (pred) => typeof adapter.find === "function" ? adapter.find(entity, pred) : adapter.list(entity).then((xs) => xs.filter(pred)),
    create: (data) => adapter.create(entity, data),
    update: (id, patch) => adapter.update(entity, id, patch),
    delete: (id) => adapter.delete(entity, id),
  });

  const bus = {
    publish: (event, payload) => adapter.emit(event, payload),
    subscribe: (event, fn) => adapter.on(event, fn),
  };

  const stats = {
    herd: async () => {
      const list = await adapter.list("animals");
      const active = list.filter((a) => a.CurrentStatus !== "Sold" && a.CurrentStatus !== "Deceased");
      return {
        total: active.length,
        female: active.filter((a) => a.Gender === "Female").length,
        male: active.filter((a) => a.Gender === "Male").length,
        calves: active.filter((a) => a.CurrentStatus === "Calf" || (a.DateOfBirth && JF.Utils.ageInYears(a.DateOfBirth) < 1)).length,
        pregnant: active.filter((a) => a.CurrentStatus === "Pregnant").length,
        open: active.filter((a) => a.CurrentStatus === "Open").length,
        inHeat: active.filter((a) => a.CurrentStatus === "In Heat").length,
        sick: active.filter((a) => a.CurrentStatus === "Sick" || a.CurrentStatus === "Under Treatment").length,
      };
    },
  };

  const seed = (data) => adapter.seed(data);
  const clearAll = () => adapter.clear();

  /**
   * Erase all operational records but KEEP configuration (settings + backend prefs).
   * Used by Settings > "Start Fresh" so the user gets a clean farm without losing config.
   */
  const eraseRecords = async () => {
    const keep = await adapter.list("settings");
    await adapter.clear();
    for (const s of keep) await adapter.create("settings", s);
  };

  // Force a fresh seed run on next boot (used by verification tooling).
  const forceReseed = () => { try { localStorage.setItem("jf_force_seed", "1"); } catch (e) {} };
  // Consume the force-seed flag (called once by app bootstrap).
  const consumeForceSeed = () => {
    try {
      const on = localStorage.getItem("jf_force_seed") === "1";
      if (on) localStorage.removeItem("jf_force_seed");
      return on;
    } catch (e) { return false; }
  };

  // Backend preference accessors - the ONLY place browser storage is touched
  // outside the adapter itself, so UI modules never import localStorage.
  const getConfig = (key) => { try { return localStorage.getItem(`jf_${key}`); } catch (e) { return null; } };
  const setConfig = (key, val) => { try { localStorage.setItem(`jf_${key}`, val); } catch (e) {} };

  // Entity accessors
  const api = {
    init, setBackend, getAdapter, on, emit, bus, stats, seed, clearAll, eraseRecords,
    isBridged, markBridged, forceReseed, consumeForceSeed, getConfig, setConfig,
    configureRuleSheet, getRuleSheetAdapter, homeOf,
    animals: wrapEntity("animals"),
    heat: wrapEntity("heat"),
    insemination: wrapEntity("insemination"),
    pregnancy: wrapEntity("pregnancy"),
    calving: wrapEntity("calving"),
    health: wrapEntity("health"),
    deworming: wrapEntity("deworming"),
    vaccination: wrapEntity("vaccination"),
    death: wrapEntity("death"),
    purchases: wrapEntity("purchases"),
    sales: wrapEntity("sales"),
    milkSales: wrapEntity("milkSales"),
    expenses: wrapEntity("expenses"),
    journal: wrapEntity("journal"),
    reminders: wrapEntity("reminders"),
    files: wrapEntity("files"),
    dryOff: wrapEntity("dryOff"),
    rules: wrapEntity("rules"),
    ruleParameters: wrapEntity("ruleParameters"),
    ruleOverrides: wrapEntity("ruleOverrides"),
    audit: wrapEntity("audit"),
    // Raw settings-entity CRUD (the typed settings.{get,set,allMap} API sits alongside).
    settingsEntity: wrapEntity("settings"),
    settings: {
      async list() { return adapter.list("settings"); },
      async get(key) { const all = await adapter.list("settings"); return all.find((s) => s.key === key); },
      async set(key, value) {
        const all = await adapter.list("settings");
        const existing = all.find((s) => s.key === key);
        if (existing) return adapter.update("settings", existing.id, { value });
        return adapter.create("settings", { key, value });
      },
      async allMap() { const all = await adapter.list("settings"); return Object.fromEntries(all.map((s) => [s.key, s.value])); },
    },
    groups: wrapEntity("groups"),
  };

  // Auto-initialize from localStorage preference. Default is the MongoDB farm
  // API (endpoint+token are baked into MongoApiAdapter), falling back to the
  // device store only when the API is unreachable - checked asynchronously.
  //
  // SELF-HEALING: a "mock" preference that was written automatically (no user
  // choice recorded) is retried against MongoDB on every boot — a Render cold
  // start once sent a device to mock mode and it must come back on its own.
  const savedBackend = localStorage.getItem("jf_backend");
  const userChoseBackend = localStorage.getItem("jf_backend_user") === "1";
  if (savedBackend && userChoseBackend) {
    init(savedBackend);
    if (savedBackend === "mongo") dataAdapter.warmup?.();
  } else {
    // Auto path: always try MongoDB first, drop to device only while offline.
    init("mongo");
    // One-shot boot fetch: warms the entity cache AND checks reachability in
    // the same round trip (the old boot fired an expensive ping that counted
    // every collection). If the baked-in API cannot be reached at all, drop
    // to the offline device store — without recording it as a user choice,
    // so the next boot tries MongoDB again.
    Promise.resolve(dataAdapter.warmup?.()).then((data) => {
      if (!data && !localStorage.getItem("jf_backend_user")) {
        init("mock");
        try { localStorage.setItem("jf_backend", "mock"); } catch (e) {}
      }
    }).catch(() => {});
  }

  return api;
})();

      id: "CALV-001", CalvingID: "CALV-001", AnimalID: "COW-005",
      Date: daysAgo(5), Time: "02:15",
      CalvingType: "Normal", AssistanceRequired: false, Complications: "None",
      CalfID: "CALF-2026-001", CalfGender: "Male", CalfWeight: 34, CalfHealth: "Healthy",
      Veterinarian: "Dr. Sharma",
      PhotoURL: photoPrompt("newborn calf with mother in maternity barn straw bedding, editorial lighting"),

    // Recent AI + pregnancy check due for COW-005 again
    aivecs.push({
      id: "AI-002", InseminationID: "AI-002", AnimalID: "COW-005",
      HeatRecordID: "HEAT-004", Date: daysAgo(30), Time: "10:30",

      Cost: aiCosts[1], Notes: "",
    });
    // 5 more AIs
    for (let i = 1; i <= 5; i++) {
      const cow = cows[2 + i];
      if (!cow) continue;
      const day = 5 + i * 12;
      aivecs.push({
        id: `AI-10${i}`, InseminationID: `AI-10${i}`, AnimalID: cow.AnimalID,
        HeatRecordID: null, Date: daysAgo(day), Time: "09:30",

        Technician: pick(["Dr. Sharma","Dr. Iyer","Dr. Patel","Senior Tech"]),

      if (i % 2 === 0) {

          id: `PREG-10${i}`, PregnancyCheckID: `PREG-10${i}`, AnimalID: cow.AnimalID,
          InseminationID: `AI-10${i}`, Date: daysAgo(Math.max(1, day - 30)),

  const healths = [];

  const generateHealth = () => {

        TreatmentCost: cost,

    // Dewormings — COW-005 last 25 Aug + 11 more

    for (let i = 0; i < 14; i++) {

  const deaths = [];

  const generateTransactions = () => {

  // Milk income: two collections a day (morning/evening) for the last ~5 months,
  // mirrored into the journal like every other entry. Demo data only — a fresh
  // farm starts with zero rows and everything on Finance pages computes from
  // whatever the user actually records.
  const milkSales = [];
  const generateMilkSales = () => {
    let n = 0;
    for (let back = 150; back >= 0; back -= 1) {
      const d = daysAgo(back);
      ["Morning", "Evening"].forEach((shift, si) => {
        if (back > 30 && Math.random() < 0.06) return; // occasional missed collection
        n++;
        const litres = Math.round((shift === "Morning" ? 20 + Math.random() * 9 : 15 + Math.random() * 7) * 10) / 10;
        const rate = Math.round((40 + (150 - back) * 0.012 + Math.random() * 1.6) * 10) / 10;
        const amount = Math.round(litres * rate * 100) / 100;
        const pm = pick(["UPI", "UPI", "Bank Transfer", "Cash"]);
        const id = `MILK-${String(n).padStart(4, "0")}`;
        milkSales.push({
          id, MilkSaleID: id, Date: d, Time: shift === "Morning" ? "06:30" : "18:10",
