            : (ageDays >= wean ? "weaning age reached" : `${wean - ageDays}d to weaning`)),
        ])),
        JF.Utils.el("td", {}, JF.Utils.el("span", { class: `badge ${ageDays !== null && ageDays >= wean ? "badge--success" : "badge--info"}` },
          ageDays === null ? "Age unknown" : (ageDays >= wean ? "Wean now" : "Suckling"))),
      ]);
    });
    return dataTable(["Calf", "Sex / Breed", "Age", "Birth weight", "Weaning progress", "Status"],
      rows, "No active calves. Births appear here automatically.");
  };

  /* ---------- Growth (SVG line chart) ---------- */
  const growthPage = (calves, calvings) => {
    if (!calves.length) return JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-7)" } }, "No calves to chart yet.");
    const W = 640, H = 260, PAD = 44;
    const byId = {};
    calves.forEach((c) => { byId[c.AnimalID] = []; });
    calvings.forEach((cv) => { if (byId[cv.CalfID]) byId[cv.CalfID].push({ d: new Date(cv.Date), w: Number(cv.CalfWeight || 0), label: "Birth" }); });
    // Synthetic weigh-in points: birth weight doubling by 60d, tripling by 180d (typical curve)
    const series = calves.map((c, idx) => {
      const pts = byId[c.AnimalID] || [];
      const birth = pts[0]?.w || 35;
      const dobAge = JF.Utils.daysBetween(c.DateOfBirth, JF.Utils.today());
      const age = Number.isFinite(dobAge) ? Math.max(0, dobAge) : 0;
      const w = (ageDays) => Math.round(birth * (1 + (ageDays / 60) * 0.9 + Math.pow(ageDays / 180, 1.6) * 0.6));
      const marks = [0, Math.min(age, 30), Math.min(age, 60), Math.min(age, 120), age].filter((v, i, a) => v === a[i]);
      return {
        id: c.AnimalID,
        color: ["#225830", "#8a3324", "#b58a3c", "#3d5a80"][idx % 4],
        points: marks.map((m) => ({ x: m, y: w(m) })),
      };
    });
    const maxX = Math.max(90, ...series.flatMap((s) => s.points.map((p) => p.x)));
    const maxY = Math.max(80, ...series.flatMap((s) => s.points.map((p) => p.y)));
    const X = (v) => PAD + (v / maxX) * (W - PAD - 12);
    const Y = (v) => H - PAD - (v / maxY) * (H - PAD - 16);
    const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => {
      const y = Y(maxY * f);
      return `<line x1="${PAD}" y1="${y}" x2="${W - 12}" y2="${y}" stroke="var(--color-ink-100)" stroke-width="1"/><text x="8" y="${y + 4}" font-size="10" fill="var(--color-ink-400)">${Math.round(maxY * f)}</text>`;
    }).join("");
    const xTicks = [0, 30, 60, 90, 120, 150, 180].filter((t) => t <= maxX).map((t) =>
      `<text x="${X(t)}" y="${H - PAD + 16}" font-size="10" text-anchor="middle" fill="var(--color-ink-400)">${t}d</text>`).join("");
    const lines = series.map((s) => {
      const path = s.points.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
      const dots = s.points.map((p) => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${s.color}"/>`).join("");
      return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${X(s.points[0].x).toFixed(1)}" cy="${Y(s.points[0].y).toFixed(1)}" r="2" fill="${s.color}" opacity=".5"/>${dots}`;
    }).join("");
    const legend = series.map((s) =>
      `<span class="chip" style="gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block"></span>${s.id}</span>`).join(" ");

    const svg = JF.Utils.el("div", { class: "card", style: { padding: "var(--space-5)" } }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "WEIGHT FOR AGE"),
      JF.Utils.el("div", { style: { margin: "10px 0" }, html: legend }),
      JF.Utils.el("div", { html: `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Calf growth chart">${grid}${lines}${xTicks}<line x1="${PAD}" y1="${H - PAD}" x2="${W - 12}" y2="${H - PAD}" stroke="var(--color-ink-400)" stroke-width="1"/><line x1="${PAD}" y1="12" x2="${PAD}" y2="${H - PAD}" stroke="var(--color-ink-400)" stroke-width="1"/></svg>` }),
      JF.Utils.el("div", { class: "field__hint", style: { marginTop: "8px" } }, "Age in days (x) vs weight in kg (y). Points interpolate a standard growth curve between birth weight and today."),
    ]);
    return svg;
  };

  /* ---------- Calf History ---------- */
  const historyPage = async (calves) => {
    const wrap = JF.Utils.el("div", { class: "card", style: { padding: "var(--space-5)" } }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "LIFECYCLE TIMELINE"),
    ]);
    let added = 0;
    for (const c of calves) {
      const evts = await JF.Timeline.animalFor(c.AnimalID);
      if (!evts.length) continue;
      added++;
      const block = JF.Utils.el("div", { style: { marginTop: "var(--space-4)" } }, [
        JF.Utils.el("a", { class: "chip", href: `#animal/${c.AnimalID}/overview`, style: { marginBottom: "8px" } }, `${c.AnimalID} · ${c.Name || ""}`),
        JF.Utils.el("div", { class: "timeline", style: { marginTop: "8px" } }, evts.slice(0, 8).map((ev) =>
          JF.Utils.el("div", { class: "timeline__item" }, [
            JF.Utils.el("div", { class: `timeline__dot ${ev.DotClass || ""}`, html: JF.Utils.svgIcon(ev.Icon, 10, 10) }),
            JF.Utils.el("div", { class: "timeline__date" }, JF.Utils.formatDate(ev.Date)),
            JF.Utils.el("div", { class: "timeline__title" }, ev.Title),
            JF.Utils.el("div", { class: "timeline__desc" }, ev.Subtitle || ""),
          ]))),
      ]);
      wrap.appendChild(block);
    }
    if (!added) wrap.appendChild(JF.Utils.el("div", { class: "search-empty", style: { padding: "var(--space-4)" } }, "No calf events recorded yet."));
    return wrap;
  };

  /* ---------- Render ---------- */
  const render = async (path = []) => {
    const sub = path?.[1] || "births";
    const root = $();
    JF.Utils.clear(root);
    const [animals, calvings] = await Promise.all([JF.Store.animals.list(), JF.Store.calving.list()]);
    const calves = animals.filter((a) => a.CurrentStatus === "Calf" || (a.DateOfBirth && JF.Utils.ageInYears(a.DateOfBirth) < 1));
    const name = { births: "Birth Records", manage: "Calf Management", growth: "Growth Tracking", history: "Calf History" }[sub] || "Birth Records";

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "👶 Calves"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, name),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Births, colostrum, weaning progress and growth tracking for the youngest members of the herd."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", { class: "btn btn--primary btn--icon-label btn--sm", html: `${JF.Utils.svgIcon("plus", 14, 14)} Register Birth`, onclick: () => JF.QuickEntry?.openPicker() }),
      ]),
    ]));
    page.appendChild(subNav(sub));
    page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
      stat("ACTIVE CALVES", calves.length),
      stat("BIRTHS RECORDED", calvings.length),
      stat("WEANING AGE (d)", 180),
      stat("YOUNGEST", (() => {
        const ages = calves.map((c) => JF.Utils.daysBetween(c.DateOfBirth, JF.Utils.today())).filter(Number.isFinite);
        return ages.length ? Math.min(...ages) + "d" : "—";
      })()),
    ]));

    if (sub === "births") page.appendChild(birthsPage(calvings, animals));
    else if (sub === "manage") page.appendChild(managePage(calves, calvings));
    else if (sub === "growth") page.appendChild(growthPage(calves, calvings));
    else page.appendChild(await historyPage(calves));

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Finance = (function () {
  const $ = () => document.getElementById("view-container");
  const money = (n) => JF.Utils.money(n || 0);

  const SUB = {
    overview:     { label: "Overview",      icon: "reports" },
    expenses:     { label: "Expenses",      icon: "money" },
    purchases:    { label: "Purchases",     icon: "purchase" },
    sales:        { label: "Cattle Sales",  icon: "sale" },
    journal:      { label: "Journal",       icon: "document" },
    ledger:       { label: "Ledger",        icon: "docs" },
    trialbalance: { label: "Trial Balance", icon: "check" },
    pl:           { label: "Profit & Loss", icon: "reports" },
    balancesheet: { label: "Balance Sheet", icon: "finance" },
    cashbook:     { label: "Cash Book",     icon: "money" },
    bankbook:     { label: "Bank Book",     icon: "finance" },
  };

  const subNav = (active) => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)", flexWrap: "wrap" } });
    Object.entries(SUB).forEach(([k, v]) => row.appendChild(JF.Utils.el("a", {
      class: `tab ${active === k ? "is-active" : ""}`, href: `#finance/${k}`,
    }, v.label)));
    return row;
  };

  const TD = (html) => { const td = document.createElement("td"); td.innerHTML = html; return td; };

  const table = (headers, rows, footers, emptyMsg = "No transactions recorded.") => {
    if (!rows.length && !footers) return JF.Utils.el("div", { class: "card search-empty", style: { padding: "var(--space-7)" } }, emptyMsg);
    const t = JF.Utils.el("table", { class: "table" });
    t.appendChild(JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, headers.map((h) => JF.Utils.el("th", {}, h)))));
    t.appendChild(JF.Utils.el("tbody", {}, rows.length ? rows : [JF.Utils.el("tr", {}, JF.Utils.el("td", { colspan: String(headers.length), style: "text-align:center;padding:24px;color:var(--color-ink-400)" }, emptyMsg))]));
    if (footers) t.appendChild(JF.Utils.el("tfoot", {}, JF.Utils.el("tr", { style: "font-weight:bold;background:var(--color-bg-soft)" }, footers.map((f) => JF.Utils.el("td", { html: String(f) })))));
    return JF.Utils.el("div", { class: "table-container card" }, t);
  };

  const statCard = (label, value) => JF.Utils.el("div", { class: "card card--stat" }, [
    JF.Utils.el("div", { class: "stat-number" }, String(value ?? "—")),
    JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
  ]);

  const badge = (txt, cls) => `<span class="badge ${cls}">${txt}</span>`;

  const render = async (path = []) => {
    const sub = path?.[1] || "overview";
    const root = $();
    JF.Utils.clear(root);

    const [expenses, purchases, sales, journal, milkSales] = await Promise.all([
      JF.Store.expenses.list().catch(() => []),
      JF.Store.purchases.list().catch(() => []),
      JF.Store.sales.list().catch(() => []),
      JF.Store.journal.list().catch(() => []),
      JF.Store.milkSales.list().catch(() => []),
    ]);

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "💰 Finance & Accounting"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "Expenses"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Double-entry bookkeeping — every operational entry posts a balanced Dr/Cr journal pair automatically."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", {
          class: "btn btn--primary btn--icon-label btn--sm",
          html: `${JF.Utils.svgIcon("plus", 14, 14)} New Entry`,
          onclick: () => JF.QuickEntry?.openPicker(),
        }),
      ]),
    ]));
    page.appendChild(subNav(sub));

    /* ---------- Overview: graphs + milk income + asset value (all from entries) ---------- */
    if (sub === "overview") {
      const milk = JF.FinanceCalc.milkAnalytics(milkSales);
      const series = JF.FinanceCalc.monthlySeries(journal, 6);
      const p = JF.FinanceCalc.pnl(journal);
      const b = JF.FinanceCalc.balanceSheet(journal);

      const maxBar = Math.max(1, ...series.map((s) => Math.max(s.income, s.expense)));
      const barChart = (data, h = 120) => JF.Utils.el("div", { style: { display: "flex", alignItems: "flex-end", gap: "10px", height: `${h}px`, padding: "0 4px" } },
        data.map((s) => JF.Utils.el("div", { style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: "4px", height: "100%", justifyContent: "flex-end" } }, [
          JF.Utils.el("div", { style: { display: "flex", gap: "3px", alignItems: "flex-end", height: "100%", width: "100%", justifyContent: "center" } }, [
            JF.Utils.el("div", { title: `Income ${money(s.income)}`, style: { width: "38%", height: `${Math.max(2, (s.income / maxBar) * (h - 24))}px`, background: "var(--color-success-500)", borderRadius: "4px 4px 0 0", minHeight: "2px" } }),
            JF.Utils.el("div", { title: `Expense ${money(s.expense)}`, style: { width: "38%", height: `${Math.max(2, (s.expense / maxBar) * (h - 24))}px`, background: "var(--color-oxblood-500)", borderRadius: "4px 4px 0 0", minHeight: "2px" } }),
          ]),
          JF.Utils.el("div", { class: "field__hint", style: { fontSize: "10px" } }, s.label),
        ])));

      // Category doughnut (expense mix this FY): simple stacked bar, no libs.
      const byCat = {};
      expenses.forEach((e) => { byCat[e.Category || "Other"] = (byCat[e.Category || "Other"] || 0) + Number(e.Amount || 0); });
      const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
      const catTotal = cats.reduce((s, [, v]) => s + v, 0) || 1;
      const catColors = ["#27407e", "#b92473", "#cf9110", "#2e8a4f", "#a33327", "#6f4a26", "#4164b5", "#86184f", "#59452f", "#a58d6f"];
      const catBar = JF.Utils.el("div", { style: { display: "flex", height: "18px", borderRadius: "9px", overflow: "hidden", marginTop: "8px" } },
        cats.map(([k, v], i) => JF.Utils.el("div", { title: `${k}: ${money(v)}`, style: { width: `${(v / catTotal) * 100}%`, background: catColors[i % catColors.length] } })));

      const milkThisMonth = (() => {
        const key = new Date().toISOString().slice(0, 7);
        const m = milk.monthly.find((x) => x.month === key);
        return m || { litres: 0, amount: 0, entries: 0 };
      })();
      const maxMilkBar = Math.max(1, ...milk.monthly.map((m) => m.amount));

      const cashBank = (() => {
        const t = JF.FinanceCalc.accountTotals(journal);
        const acc = (n) => t[n] || { dr: 0, cr: 0 };
        return acc("Cash").dr - acc("Cash").cr + acc("Bank").dr - acc("Bank").cr;
      })();
      page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        statCard("NET PROFIT / (LOSS)", money(p.net)),
        statCard("MILK INCOME (TOTAL)", money(milk.totalAmount)),
        statCard("ASSET VALUE", money(b.totalAssets)),
        statCard("CASH + BANK", money(cashBank)),
      ]));

      page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-2", style: { marginBottom: "var(--space-5)" } }, [
        JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
          JF.Utils.el("div", { class: "card__eyebrow", style: { color: "var(--color-accent-700)" } }, "INCOME VS EXPENSE · LAST 6 MONTHS"),
          JF.Utils.el("div", { style: { marginTop: "10px", display: "flex", gap: "14px", fontSize: "11px" } }, [
            JF.Utils.el("span", { style: { color: "var(--color-success-700)" } }, "■ Income"),
            JF.Utils.el("span", { style: { color: "var(--color-oxblood-700)" } }, "■ Expense"),
          ]),
          barChart(series),
        ]),
        JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
          JF.Utils.el("div", { class: "card__eyebrow", style: { color: "var(--color-oxblood-700)" } }, "EXPENSE MIX BY CATEGORY"),
          cats.length ? catBar : JF.Utils.el("div", { class: "field__hint", style: { marginTop: "8px" } }, "No expenses recorded yet."),
          JF.Utils.el("div", { style: { marginTop: "10px", display: "flex", flexWrap: "wrap", gap: "6px" } },
            cats.slice(0, 8).map(([k, v], i) => JF.Utils.el("span", { class: "badge badge--neutral", style: { fontSize: "10px" } }, `${k} · ${Math.round((v / catTotal) * 100)}%`))),
        ]),
      ]));

      // Milk production panel — the heart of a dairy business
      page.appendChild(JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)", marginBottom: "var(--space-5)" } }, [
        JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "8px" } }, [
          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "card__eyebrow", style: { color: "var(--color-accent-700)" } }, "🥛 MILK INCOME · FROM PAYMENT ENTRIES"),
            JF.Utils.el("div", { style: { fontWeight: 700, fontSize: "var(--fs-lg)" } }, `${milk.totalLitres} L sold · avg ₹${milk.avgRate}/L${milk.pending ? ` · ⚠ ${money(milk.pending)} pending` : ""}`),
          ]),
          JF.Utils.el("button", { class: "btn btn--accent btn--sm", onclick: () => JF.QuickEntry.openForm("milk") }, "+ Milk Payment"),
        ]),
        JF.Utils.el("div", { class: "grid grid--cols-3", style: { margin: "12px 0" } }, [
          statCard("THIS MONTH", money(milkThisMonth.amount)),
          statCard("LITRES THIS MONTH", String(milkThisMonth.litres || 0)),
          statCard("MORNING / EVENING SPLIT", `${money(milk.shiftSplit.Morning)} / ${money(milk.shiftSplit.Evening)}`),
        ]),
        milk.monthly.length ? JF.Utils.el("div", { style: { display: "flex", alignItems: "flex-end", gap: "8px", height: "90px" } },
          milk.monthly.slice(-6).map((m) => JF.Utils.el("div", { style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%", gap: "4px" } }, [
            JF.Utils.el("div", { title: `${m.month}: ${money(m.amount)} · ${m.litres}L`, style: { width: "70%", height: `${Math.max(3, (m.amount / maxMilkBar) * 66)}px`, background: "linear-gradient(180deg, #4164b5, #27407e)", borderRadius: "5px 5px 0 0" } }),
            JF.Utils.el("div", { class: "field__hint", style: { fontSize: "10px" } }, m.month.slice(5) + "/" + m.month.slice(2, 4)),
          ]))) : JF.Utils.el("div", { class: "field__hint" }, "Record your first milk payment to see monthly production here."),
      ]));

      page.appendChild(JF.Utils.el("div", { class: "field__hint" },
        "Everything on this page is computed from your entries only — no estimates, no dummy data. Post a milk payment, expense, purchase or sale from Quick Entry and this page updates instantly."));
    }

    /* ---------- Expenses ---------- */
    if (sub === "expenses") {
      const byCat = {};
      expenses.forEach((e) => { byCat[e.Category || "Other"] = (byCat[e.Category || "Other"] || 0) + Number(e.Amount || 0); });
      page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-4", style: { marginBottom: "var(--space-5)" } }, [
        statCard("TOTAL EXPENSES", money(expenses.reduce((s, e) => s + Number(e.Amount || 0), 0))),
        statCard("ENTRIES", expenses.length),
        statCard("CATEGORIES", Object.keys(byCat).length),
        statCard("THIS MONTH", money(expenses.filter((e) => new Date(e.Date).getMonth() === new Date().getMonth()).reduce((s, e) => s + Number(e.Amount || 0), 0))),
      ]));

      /* ---- MEDICAL COST PER ANIMAL — which cow is not paying her way ---- */
      let medRows = [];
      try { medRows = await JF.LifeCycle.medicalEconomics(); } catch (e) { console.warn(e); }
      if (medRows.length) {
        const verdictBadge = (v) => ({ "cost-watch": "badge--danger", watch: "badge--warning", ok: "badge--success" }[v] || "badge--neutral");
        const verdictLabel = (v) => ({ "cost-watch": "⚠ Cost watch", watch: "Watch", ok: "OK" }[v] || "—");
        const section = JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)" } }, [
          JF.Utils.el("div", { class: "card__header" }, [
            JF.Utils.el("div", {}, [
              JF.Utils.el("div", { class: "card__eyebrow" }, "🩺 COST-ECONOMICS"),
              JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } }, "Medical Cost per Animal"),
            ]),
          ]),
          JF.Utils.el("div", { class: "table-container" }, JF.Utils.el("table", { class: "table" }, [
            JF.Utils.el("thead", {}, JF.Utils.el("tr", {}, ["Animal", "Treatments", "Deworm/Vacc", "Med. Expenses", "Last 12 mo", "Lifetime", "Verdict"].map((h) => JF.Utils.el("th", {}, h)))),
            JF.Utils.el("tbody", {}, medRows.map(({ animal, lc }) => JF.Utils.el("tr", {
              onclick: () => JF.App.navigate(`#animal/${animal.AnimalID}/expenses`), style: { cursor: "pointer" },
            }, [
              JF.Utils.el("td", {}, [JF.Utils.el("strong", {}, animal.Name || animal.AnimalID), JF.Utils.el("div", { class: "field__hint" }, animal.AnimalID)]),
              JF.Utils.el("td", {}, money(lc.medical.parts.treatments)),
              JF.Utils.el("td", {}, money(lc.medical.parts.deworming + lc.medical.parts.vaccination)),
              JF.Utils.el("td", {}, money(lc.medical.parts.expenses)),
              JF.Utils.el("td", { html: `<strong>${money(lc.medical.last12m)}</strong>` }),
              JF.Utils.el("td", {}, money(lc.medical.total)),
              JF.Utils.el("td", { html: `<span class="badge ${verdictBadge(lc.verdict)}">${verdictLabel(lc.verdict)}</span>` }),
            ]))),
          ])),
          JF.Utils.el("div", { class: "field__hint", style: { padding: "var(--space-3) var(--space-4)" } },
            "From recorded treatments, dewormers, vaccines and medical expense entries only — no estimates. 'Cost watch' = ₹30,000+ medical spend or 5+ treatments in 12 months."),
        ]);
        page.appendChild(section);
      }

      page.appendChild(table(["Date", "Category", "Description", "Vendor", "Animal", "Payment", "Amount"],
        [...expenses].sort((a, b) => new Date(b.Date) - new Date(a.Date)).map((e) => JF.Utils.el("tr", {}, [
          TD(`<strong>${JF.Utils.formatDate(e.Date)}</strong>`),
          TD(badge(e.Category || "General", "badge--warning")),
          JF.Utils.el("td", {}, e.Description || "—"),
          JF.Utils.el("td", {}, e.Vendor || "—"),
          JF.Utils.el("td", {}, e.AnimalID ? JF.Utils.el("a", { href: `#animal/${e.AnimalID}/expenses`, style: { fontWeight: 600 } }, e.AnimalID) : "—"),
          JF.Utils.el("td", {}, e.PaymentMethod || "—"),
          JF.Utils.el("td", { html: `<strong>${money(e.Amount)}</strong>` }),
        ])),
        ["Total", "", "", "", "", "", money(expenses.reduce((s, e) => s + Number(e.Amount || 0), 0))]));
    }

    /* ---------- Purchases ---------- */
    else if (sub === "purchases") {
      page.appendChild(table(["Date", "Purchase ID", "Seller", "Animal", "Price", "Transport", "Vet Check", "Total", "Payment"],
        purchases.map((p) => JF.Utils.el("tr", {}, [
          TD(`<strong>${JF.Utils.formatDate(p.Date)}</strong>`),
          JF.Utils.el("td", {}, p.PurchaseID || p.id),
          JF.Utils.el("td", {}, p.Seller || "—"),
          JF.Utils.el("td", {}, p.AnimalID ? JF.Utils.el("a", { href: `#animal/${p.AnimalID}/overview` }, p.AnimalID) : "—"),
          JF.Utils.el("td", {}, money(p.PurchasePrice)),
          JF.Utils.el("td", {}, money(p.TransportationCost)),
          JF.Utils.el("td", {}, money(p.VeterinaryCheckCost)),
          JF.Utils.el("td", { html: `<strong>${money(p.TotalCost)}</strong>` }),
          JF.Utils.el("td", {}, p.PaymentMethod || "—"),
        ])),
        ["Total", "", "", "", "", "", "", money(purchases.reduce((s, p) => s + Number(p.TotalCost || 0), 0)), ""]));
    }

    /* ---------- Sales ---------- */
    else if (sub === "sales") {
      page.appendChild(table(["Date", "Sale ID", "Buyer", "Animal", "Price", "Transport", "Commission", "Net", "Payment"],
        sales.map((s) => JF.Utils.el("tr", {}, [
          TD(`<strong>${JF.Utils.formatDate(s.Date)}</strong>`),
          JF.Utils.el("td", {}, s.SaleID || s.id),
          JF.Utils.el("td", {}, s.Buyer || "—"),
          JF.Utils.el("td", {}, s.AnimalID ? JF.Utils.el("a", { href: `#animal/${s.AnimalID}/overview` }, s.AnimalID) : "—"),
          JF.Utils.el("td", {}, money(s.SalePrice)),
          JF.Utils.el("td", {}, money(s.Transportation)),
          JF.Utils.el("td", {}, money(s.Commission)),
          JF.Utils.el("td", { html: `<strong>${money(s.NetSale)}</strong>` }),
          JF.Utils.el("td", {}, s.PaymentMethod || "—"),
        ])),
        ["Total", "", "", "", "", "", "", money(sales.reduce((s, x) => s + Number(x.NetSale || 0), 0)), ""]));
    }

    /* ---------- Journal ---------- */
    else if (sub === "journal") {
      page.appendChild(table(["Date", "Journal ID", "Description", "Debit (Dr)", "Credit (Cr)", "Amount", "Reference"],
        [...journal].sort((a, b) => new Date(b.Date) - new Date(a.Date)).map((j) => JF.Utils.el("tr", {}, [
          TD(`<strong>${JF.Utils.formatDate(j.Date)}</strong>`),
          JF.Utils.el("td", {}, j.JournalID || j.id),
          JF.Utils.el("td", {}, j.Description || j.TransactionType || "Entry"),
          TD(`<span style="color:var(--color-oxblood-700)">${j.DebitAccount || "—"}</span>`),
          TD(`<span style="color:var(--color-accent-700)">${j.CreditAccount || "—"}</span>`),
          JF.Utils.el("td", { html: `<strong>${money(j.Amount)}</strong>` }),
          JF.Utils.el("td", {}, j.ReferenceID || "—"),
        ])),
        ["Total", "", "", "", "", money(journal.reduce((s, j) => s + Number(j.Amount || 0), 0)), ""]));
    }

    /* ---------- Ledger ---------- */
    else if (sub === "ledger") {
      let account = "Cash";
      const draw = () => {
        const led = JF.FinanceCalc.ledger(journal, account);
        const wrap = JF.Utils.el("div", {});
        wrap.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3", style: { marginBottom: "var(--space-5)" } }, [
          statCard("OPENING", money(led.opening)),
          statCard(`MOVEMENT (Dr − Cr)`, money(led.closing - led.opening)),
          statCard("CLOSING", money(led.closing)),
        ]));
        wrap.appendChild(table(["Date", "Particulars", "Ref", "Debit", "Credit", "Balance"],
          led.rows.map((r) => JF.Utils.el("tr", {}, [
            TD(`<strong>${JF.Utils.formatDate(r.date)}</strong>`),
            JF.Utils.el("td", {}, r.particulars),
            JF.Utils.el("td", {}, r.ref || "—"),
            JF.Utils.el("td", {}, r.dr ? money(r.dr) : ""),
            JF.Utils.el("td", {}, r.cr ? money(r.cr) : ""),
            JF.Utils.el("td", { html: `<strong>${money(r.balance)}</strong>` }),
          ])),
          ["Totals", "", "", money(led.totalDr), money(led.totalCr), money(led.closing)],
          `No postings to ${account} yet.`));
        return wrap;
      };
      const selector = JF.Utils.el("select", { class: "select", style: { maxWidth: "320px", marginBottom: "var(--space-5)" }, onchange: (e) => { account = e.target.value; container.replaceChildren(draw()); } },
        JF.FinanceCalc.accountList().map((a) => JF.Utils.el("option", { value: a }, a)));
      const container = JF.Utils.el("div", {}, draw());
      page.appendChild(selector);
      page.appendChild(container);
    }

    /* ---------- Trial Balance ---------- */
    else if (sub === "trialbalance") {
      const tb = JF.FinanceCalc.trialBalance(journal);
      page.appendChild(JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)", padding: "var(--space-5)", display: "flex", justifyContent: "space-between", alignItems: "center" } }, [
        JF.Utils.el("div", {}, [
          JF.Utils.el("div", { class: "card__eyebrow" }, "VERIFICATION"),
          JF.Utils.el("div", { style: { fontWeight: 700, fontSize: "var(--fs-lg)" } }, tb.balanced ? "✓ Balanced" : `⚠ Difference: ${money(Math.abs(tb.difference))}`),
        ]),
        JF.Utils.el("span", { html: badge(tb.balanced ? "BALANCED" : "IMBALANCE DETECTED", tb.balanced ? "badge--success" : "badge--danger") }),
      ]));
      page.appendChild(table(["Account", "Debit (Dr)", "Credit (Cr)"],
        tb.rows.map((r) => JF.Utils.el("tr", {}, [
          JF.Utils.el("td", { html: `<strong>${r.account}</strong>` }),
          JF.Utils.el("td", {}, r.dr ? money(r.dr) : "—"),
          JF.Utils.el("td", {}, r.cr ? money(r.cr) : "—"),
        ])),
        ["Grand Totals", money(tb.totalDr), money(tb.totalCr)]));
    }

    /* ---------- P&L ---------- */
    else if (sub === "pl") {
      const p = JF.FinanceCalc.pnl(journal);
      const section = (title, items, total, color) => JF.Utils.el("div", { style: { marginBottom: "var(--space-5)" } }, [
        JF.Utils.el("div", { class: "card__eyebrow", style: { color, marginBottom: "8px" } }, title),
        ...items.map((x) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "9px 0", borderBottom: "1px solid var(--color-ink-100)" } }, [
          JF.Utils.el("span", {}, x.account), JF.Utils.el("span", { style: { fontWeight: 600 } }, money(x.amount)),
        ])),
        JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "10px 0", fontWeight: 700, borderTop: "2px solid var(--color-ink-300)" } }, [
          JF.Utils.el("span", {}, `Total ${title.toLowerCase()}`), JF.Utils.el("span", {}, money(total)),
        ]),
      ]);
      page.appendChild(JF.Utils.el("div", { class: "card", style: { padding: "var(--space-6)" } }, [
        JF.Utils.el("h2", { style: { marginBottom: "var(--space-5)" } }, "Statement of Profit & Loss"),
        section("INCOME", p.income, p.totalIncome, "var(--color-accent-700)"),
        section("EXPENSES", p.expenses, p.totalExpense, "var(--color-oxblood-700)"),
        JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "var(--space-4)", background: p.net >= 0 ? "var(--color-success-100)" : "var(--color-danger-100)", borderRadius: "var(--radius-md)", fontWeight: 700, fontSize: "var(--fs-lg)" } }, [
          JF.Utils.el("span", {}, "NET PROFIT / (LOSS)"),
          JF.Utils.el("span", { style: { color: p.net >= 0 ? "var(--color-success-700)" : "var(--color-danger-700)" } }, money(p.net)),
        ]),
        JF.Utils.el("div", { class: "field__hint", style: { marginTop: "var(--space-3)" } },
          "Income = milk payments + cattle sales recorded through Quick Entry; expenses come from the auto-posted journal. Post more entries to grow the picture."),
      ]));
    }

    /* ---------- Balance Sheet ---------- */
    else if (sub === "balancesheet") {
      const b = JF.FinanceCalc.balanceSheet(journal);
      const col = (title, items, total, color) => JF.Utils.el("div", {}, [
        JF.Utils.el("h3", { style: { color, borderBottom: `2px solid ${color}`, paddingBottom: "8px" } }, title),
        ...items.map((x) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--color-ink-100)" } }, [
          JF.Utils.el("span", {}, x.account), JF.Utils.el("span", { style: { fontWeight: 600 } }, money(x.amount)),
        ])),
        JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "10px 0", fontWeight: 700 } }, [
          JF.Utils.el("span", {}, `Total ${title.toLowerCase()}`), JF.Utils.el("span", {}, money(total)),
        ]),
      ]);
      page.appendChild(JF.Utils.el("div", { class: "card", style: { padding: "var(--space-6)" } }, [
        JF.Utils.el("h2", { style: { marginBottom: "var(--space-5)" } }, "Balance Sheet"),
        JF.Utils.el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--space-6)" } }, [
          col("ASSETS", b.assets, b.totalAssets, "var(--color-accent-700)"),
          JF.Utils.el("div", {}, [
            col("LIABILITIES", b.liabilities, b.totalLiabilities, "var(--color-oxblood-700)"),
            JF.Utils.el("div", { style: { height: "var(--space-5)" } }),
            col("EQUITY", b.equity, b.totalEquity, "var(--color-oxblood-700)"),
          ]),
        ]),
        JF.Utils.el("div", { style: { marginTop: "var(--space-5)", padding: "var(--space-4)", borderRadius: "var(--radius-md)", textAlign: "center", fontWeight: 700, background: b.balanced ? "var(--color-success-100)" : "var(--color-danger-100)", color: b.balanced ? "var(--color-success-700)" : "var(--color-danger-700)" } },
          b.balanced ? "✓ Balanced — Assets = Liabilities + Equity" : `⚠ Difference: ${money(Math.abs(b.difference))}`),
      ]));
    }

    /* ---------- Cash Book / Bank Book ---------- */
    else if (sub === "cashbook" || sub === "bankbook") {
      const account = sub === "cashbook" ? "Cash" : "Bank";
      const cb = JF.FinanceCalc.cashBook(journal, account);
      const contraRow = (r) => r.contra ? ` <span class="badge badge--info" style="font-size:10px">contra</span>` : "";
      page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3", style: { marginBottom: "var(--space-5)" } }, [
        statCard("OPENING", money(cb.opening)),
        statCard(`RECEIPTS − PAYMENTS`, money(cb.totalReceipts - cb.totalPayments)),
        statCard("CLOSING", money(cb.closing)),
      ]));
      page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
          JF.Utils.el("div", { class: "card__eyebrow", style: { color: "var(--color-accent-700)" } }, "RECEIPTS (DR)"),
          ...cb.receipts.map((r) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--color-ink-100)" } }, [
            JF.Utils.el("span", { html: `${JF.Utils.formatDate(r.date)} · ${r.particulars}${contraRow(r)}` }),
            JF.Utils.el("span", { style: { fontWeight: 600 } }, money(r.amount)),
          ])),
          JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "10px 0", fontWeight: 700, borderTop: "2px solid var(--color-ink-300)" } }, [
            JF.Utils.el("span", {}, "Total receipts"), JF.Utils.el("span", {}, money(cb.totalReceipts)),
          ]),
        ]),
        JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
          JF.Utils.el("div", { class: "card__eyebrow", style: { color: "var(--color-oxblood-700)" } }, "PAYMENTS (CR)"),
          ...cb.payments.map((r) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid var(--color-ink-100)" } }, [
            JF.Utils.el("span", { html: `${JF.Utils.formatDate(r.date)} · ${r.particulars}${contraRow(r)}` }),
            JF.Utils.el("span", { style: { fontWeight: 600 } }, money(r.amount)),
          ])),
          JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", padding: "10px 0", fontWeight: 700, borderTop: "2px solid var(--color-ink-300)" } }, [
            JF.Utils.el("span", {}, "Total payments"), JF.Utils.el("span", {}, money(cb.totalPayments)),
          ]),
        ]),
      ]));
    }

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Documents = (function () {
  const $ = () => document.getElementById("view-container");

  const SUB = {
    animal:     { label: "Animal",       icon: "animals" },
    veterinary: { label: "Veterinary",   icon: "health" },
    purchase:   { label: "Purchase",     icon: "purchase" },
    sale:       { label: "Sale",         icon: "sale" },
    invoices:   { label: "Invoices",     icon: "money" },
    certs:      { label: "Certificates", icon: "check" },
    other:      { label: "Other",        icon: "docs" },
  };
  // Settings/chart keys -> sub-route keys
  const CAT_KEY = { Animal: "animal", Veterinary: "veterinary", Purchase: "purchase", Sale: "sale", Invoices: "invoices", Certificates: "certs", Other: "other" };

  const subNav = (active) => {
    const row = JF.Utils.el("div", { class: "tabs", style: { marginBottom: "var(--space-5)" } });
    Object.entries(SUB).forEach(([k, v]) => row.appendChild(JF.Utils.el("a", {
      class: `tab ${active === k ? "is-active" : ""}`,
      href: `#documents/${k}`,
      onclick: () => {},
    }, v.label)));
    return row;
  };

  const docCard = (f) => {
    const thumb = JF.Utils.portraitSVG(f.FileName || f.id, "doc");
    return JF.Utils.el("div", { class: "card doc-card", style: { padding: "var(--space-4)" } }, [
      JF.Utils.el("div", { style: { display: "flex", gap: "12px", alignItems: "center" } }, [
        JF.Utils.el("div", {
          class: "stat-icon", style: { width: "46px", height: "46px", flexShrink: 0 },
          html: `<img src="${thumb}" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-md)"/>`,
        }),
        JF.Utils.el("div", { style: { minWidth: 0 } }, [
          JF.Utils.el("div", { style: { fontWeight: 600, fontSize: "var(--fs-sm)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, f.FileName || f.id),
          JF.Utils.el("div", { class: "field__hint" }, [
            f.AnimalID ? `${f.AnimalID} · ` : "",
            f.RecordType ? `${f.RecordType} · ` : "",
            JF.Utils.formatDate(f.UploadDate),
          ].join("")),
        ]),
      ]),
      JF.Utils.el("div", { style: { display: "flex", gap: "6px", marginTop: "var(--space-3)" } }, [
        JF.Utils.el("button", {
          class: "btn btn--ghost btn--sm", onclick: () => JF.Modal.open({
            title: f.FileName || f.id, size: "md",
            body: JF.Utils.el("div", {}, [
              JF.Utils.el("img", { src: thumb, style: { width: "100%", borderRadius: "var(--radius-md)" } }),
              JF.Utils.el("dl", { style: { marginTop: "var(--space-4)", fontSize: "var(--fs-sm)", lineHeight: 1.9 } }, [
                ["File ID", f.FileID || f.id], ["Category", f.Category], ["Linked animal", f.AnimalID || "—"],
                ["Record", f.RecordID ? `${f.RecordType} ${f.RecordID}` : "—"], ["Upload date", JF.Utils.formatDate(f.UploadDate)],
                ["File URL", f.DriveURL || f.url || "stored with the record"],
              ].map(([k, v]) => JF.Utils.el("div", { style: { display: "flex", justifyContent: "space-between", borderBottom: "1px solid var(--color-ink-100)" } }, [
                JF.Utils.el("dt", { class: "field__hint" }, k), JF.Utils.el("dd", { style: { margin: 0, fontWeight: 600 } }, String(v ?? "")),
              ]))),
            ]),
          }),
        }, "Preview"),
        JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => JF.Toast.show("Download will be served by the farm API once connected.", "success") }, "Download"),
      ]),
      f.Notes ? JF.Utils.el("div", { class: "field__hint", style: { marginTop: "8px" } }, f.Notes) : null,
    ].filter(Boolean));
  };

  const uploadModal = () => {
    const wrap = JF.Utils.el("div", { class: "form-stack" });
    const mkField = (label, id, opts = {}) => JF.Utils.el("div", { class: "field" }, [
      JF.Utils.el("label", { class: "field__label" }, label),
      opts.options
        ? JF.Utils.el("select", { class: "select", id }, opts.options.map((o) => JF.Utils.el("option", { value: o }, o)))
        : JF.Utils.el("input", { class: "input", type: opts.type || "text", id, placeholder: opts.ph || "" }),
    ]);
    wrap.appendChild(mkField("Category", "up-cat", { options: Object.keys(CAT_KEY) }));
    wrap.appendChild(mkField("File name", "up-name", { ph: "e.g. vaccination-cert-VAC-101.pdf" }));
    wrap.appendChild(mkField("Linked animal (optional)", "up-animal", { ph: "e.g. COW-005" }));
    wrap.appendChild(mkField("Record reference (optional)", "up-ref", { ph: "e.g. VAC-101" }));
    wrap.appendChild(mkField("Notes", "up-notes"));
    const live = JF.PhotoUpload.backendLive();
    const fileInput = JF.Utils.el("input", { class: "input", type: "file", id: "up-file" });
    wrap.appendChild(JF.Utils.el("div", { class: "field" }, [
      JF.Utils.el("label", { class: "field__label" }, live ? "File (uploads straight to the server)" : "File (backend not connected - metadata only)"),
      fileInput,
      JF.Utils.el("div", { class: "field__hint" },
        live
          ? "The file is stored on the server alongside its record and its link is saved here."
          : "Connect the farm API in Settings to store the actual file."),
    ]));
    JF.Modal.open({
      title: "Upload Document", size: "md", body: wrap,
      footer: [
        JF.Utils.el("button", { class: "btn btn--ghost", onclick: () => JF.Modal.close() }, "Cancel"),
        JF.Utils.el("button", {
          class: "btn btn--primary", onclick: async (ev) => {
            const btn = ev.currentTarget;
            const category = document.getElementById("up-cat").value;
            const animalId = document.getElementById("up-animal").value.trim();
            const recordId = document.getElementById("up-ref").value.trim();
            const notes = document.getElementById("up-notes").value.trim();
            const picked = document.getElementById("up-file").files?.[0] || null;
            const name = document.getElementById("up-name").value.trim() || (picked ? picked.name : "");
            if (!name) { JF.Toast.show("Give the document a name or choose a file.", "danger"); return; }

            if (picked && live) {
              btn.disabled = true;
              btn.textContent = "Uploading...";
              try {
                const res = await JF.PhotoUpload.uploadDocument(picked, { category, animalId, recordId, kind: "Document" });
                JF.Toast.show(res.mode === "drive" ? "Document uploaded to the server." : "Upload failed - metadata saved only.", res.mode === "drive" ? "success" : "warning");
              } catch (err) {
                JF.Toast.show(`Upload failed: ${err.message}`, "danger");
              } finally {
                btn.disabled = false;
                btn.textContent = "Upload Document";
              }
            } else {
              await JF.Store.files.create({
                FileID: `FILE-${JF.Utils.uid()}`, FileName: name,
                Category: category,
                AnimalID: animalId || null,
                RecordID: recordId || null,
                RecordType: null, DriveURL: null, UploadDate: JF.Utils.todayISO(),
                Notes: notes,
              });
              JF.Toast.show(picked ? "Document registered. Connect the farm API to store the file itself." : "Document registered.", "success");
            }
            JF.Modal.close();
            render();
          },
        }, "Upload Document"),
      ],
    });
  };

  const render = async (path = []) => {
    const sub = path?.[1] || "animal";
    const root = $();
    JF.Utils.clear(root);

    const files = (await JF.Store.files.list().catch(() => [])) || [];
    const norm = (c) => CAT_KEY[c] || "other";
    const inCat = files.filter((f) => norm(f.Category) === sub);
    const counts = {};
    files.forEach((f) => { const k = norm(f.Category); counts[k] = (counts[k] || 0) + 1; });

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "📄 Documents"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, SUB[sub]?.label || "Animal Documents"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Metadata registry: every file carries FileID, URL, animal link, record link, filename and upload date. Physical upload waits for the farm API backend."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => JF.Toast.show("Document search lives in the top search bar.", "success") }, "Search"),
        JF.Utils.el("button", { class: "btn btn--primary btn--icon-label btn--sm", html: `${JF.Utils.svgIcon("plus", 14, 14)} Upload Files`, onclick: uploadModal }),
      ]),
    ]));
    page.appendChild(subNav(sub));

    page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3" },
      inCat.length ? inCat.map(docCard) : [JF.Utils.el("div", { class: "card search-empty", style: { gridColumn: "1 / -1", padding: "var(--space-7)" } },
        `No documents in ${SUB[sub]?.label || "this"} category yet.`)]));

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Calendar = (function () {
  const $ = () => document.getElementById("view-container");

  const iso = (d) => JF.Utils.formatDate(d, "yyyy-MM-dd");
  let viewDate = JF.Utils.today();
  let mode = "month"; // month | week | day

  /* ---------- Event extraction ---------- */
  const buildEventMap = async () => {
    const map = {}; // yyyy-MM-dd -> [{type, color, animal, label, icon, href}]
    const add = (dateStr, ev) => {
      if (!dateStr) return;
      const key = iso(JF.Utils.parseDate(dateStr));
      if (isNaN(new Date(key))) return;
      (map[key] = map[key] || []).push(ev);
    };
    const [heats, ais, pregs, calvs, vax, dews, rems, animals, settingsMap, milk, expenses, purchases, sales] = await Promise.all([
      JF.Store.heat.list().catch(() => []),
      JF.Store.insemination.list().catch(() => []),
      JF.Store.pregnancy.list().catch(() => []),
      JF.Store.calving.list().catch(() => []),
      JF.Store.vaccination.list().catch(() => []),
      JF.Store.deworming.list().catch(() => []),
      JF.Store.reminders.list().catch(() => []),
      JF.Store.animals.list().catch(() => []),
      JF.Store.settings.allMap().catch(() => ({})),
      JF.Store.milkSales.list().catch(() => []),
      JF.Store.expenses.list().catch(() => []),
      JF.Store.purchases.list().catch(() => []),
      JF.Store.sales.list().catch(() => []),
    ]);
    const nameOf = (id) => { const a = animals.find((x) => x.AnimalID === id); return a ? (a.Name || id) : (id || ""); };

    heats.forEach((h) => add(h.HeatDate, { type: "Heat", color: "badge--danger", animal: h.AnimalID, label: nameOf(h.AnimalID), icon: "fire", href: `#animal/${h.AnimalID}/heat` }));
    ais.forEach((x) => add(x.Date, { type: "AI", color: "badge--oxblood", animal: x.AnimalID, label: nameOf(x.AnimalID), icon: "heart", href: `#animal/${x.AnimalID}/insemination` }));
    pregs.forEach((p) => add(p.Date, { type: "PD Check", color: "badge--accent", animal: p.AnimalID, label: nameOf(p.AnimalID), icon: "pregnancy", href: `#animal/${p.AnimalID}/pregnancy` }));
    vax.forEach((v) => add(v.DateGiven, { type: "Vaccination", color: "badge--info", animal: v.AnimalID, label: nameOf(v.AnimalID), icon: "syringe", href: `#animal/${v.AnimalID}/vaccination` }));
    dews.forEach((d) => add(d.Date, { type: "Deworming", color: "badge--warning", animal: d.AnimalID, label: nameOf(d.AnimalID), icon: "drop", href: `#animal/${d.AnimalID}/deworming` }));
    calvs.forEach((c) => add(c.Date, { type: "Calving", color: "badge--success", animal: c.AnimalID, label: nameOf(c.AnimalID), icon: "baby2", href: `#animal/${c.AnimalID}/calving` }));
    // Money days: milk income, expenses, purchases and sales are events too —
    // the calendar doubles as the farm's day book.
    milk.forEach((m) => add(m.Date, { type: `🥛 Milk ${m.QuantityLitres ? m.QuantityLitres + "L" : ""}`, color: "badge--success", animal: null, label: "Farm", icon: "drop", href: "#finance/overview" }));
    expenses.forEach((e) => add(e.Date, { type: `💰 ${e.Category || "Expense"}`, color: "badge--warning", animal: e.AnimalID, label: e.Vendor || "Farm", icon: "money", href: "#finance/expenses" }));
    purchases.forEach((p) => add(p.Date, { type: "🧾 Cattle Purchase", color: "badge--info", animal: p.AnimalID, label: p.Seller || "Farm", icon: "purchase", href: "#finance/purchases" }));
    sales.forEach((s) => add(s.Date, { type: "🏷 Cattle Sale", color: "badge--oxblood", animal: s.AnimalID, label: s.Buyer || "Farm", icon: "sale", href: "#finance/sales" }));
    rems.filter((r) => !["Completed", "Dismissed"].includes(r.Status)).forEach((r) =>
      add(r.DueDate, { type: r.ReminderType || "Reminder", color: r.Priority === "High" ? "badge--danger" : "badge--neutral", animal: r.AnimalID, label: nameOf(r.AnimalID) || "Herd", icon: "bell", href: r.AnimalID ? `#animal/${r.AnimalID}/overview` : "#reminders" }));

    // Expected heat windows: last heat + avg cycle, banded across min..max days
    const expC = Number(settingsMap.ExpectedCycleLength ?? 21);
    const before = Number(settingsMap.ReminderDaysBefore ?? 3);
    const byAnimal = {};
    heats.forEach((h) => { if (h.AnimalID) (byAnimal[h.AnimalID] = byAnimal[h.AnimalID] || []).push(h); });
    Object.entries(byAnimal).forEach(([animalId, list]) => {
      const dates = list.map((h) => new Date(h.HeatDate)).filter((d) => !isNaN(d)).sort((a, b) => b - a);
      if (!dates.length) return;
      const last = dates[0];
      const intervals = [];
      for (let i = 1; i < dates.length; i++) intervals.push(Math.round((dates[i - 1] - dates[i]) / 86400000));
      const avg = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : expC;
      const peak = JF.Utils.addDays(last, Math.round(avg));
      const status = animals.find((a) => a.AnimalID === animalId)?.CurrentStatus;
      if (["Pregnant", "Sold", "Deceased"].includes(status)) return;
      for (let off = -before; off <= before; off++) {
        add(iso(JF.Utils.addDays(peak, off)), {
          type: "Expected Heat", color: "badge--warning", animal: animalId, label: nameOf(animalId),
          icon: "fire", href: `#animal/${animalId}/heat`, dashed: off === 0 ? false : true,
        });
      }
    });
    return map;
  };

  /* ---------- Rendering helpers ---------- */
  const navBtns = () => JF.Utils.el("div", { style: { display: "flex", gap: "var(--space-2)", alignItems: "center" } }, [
    JF.Utils.el("button", { class: "icon-btn", "aria-label": "Previous", onclick: () => { shift(-1); render(); }, html: JF.Utils.svgIcon("arrowRight", 16, 16) ? "‹" : "‹" }),
    JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => { viewDate = JF.Utils.today(); render(); } }, "Today"),
    JF.Utils.el("button", { class: "icon-btn", "aria-label": "Next", onclick: () => { shift(1); render(); } }, "›"),
  ]);

  const shift = (dir) => {
    const d = new Date(viewDate);
    if (mode === "month") d.setDate(1), d.setMonth(d.getMonth() + dir);
    else if (mode === "week") d.setDate(d.getDate() + dir * 7);
    else d.setDate(d.getDate() + dir);
    viewDate = d;
  };

  const titleFor = () => {
    const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    if (mode === "month") return `${months[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
    if (mode === "week") {
      const start = weekStart(viewDate), end = JF.Utils.addDays(start, 6);
      return `${months[start.getMonth()]} ${start.getDate()} – ${months[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}`;
    }
    return JF.Utils.formatDate(viewDate, "EEEE, dd MMM yyyy").replace("EEEE, ", "") + ` (${weekdayName(viewDate)})`;
  };

  const weekdayName = (d) => ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
  const weekStart = (d) => { const s = new Date(d); s.setDate(s.getDate() - ((s.getDay() + 6) % 7)); return s; }; // Monday-first

  const chip = (ev) => {
    const ICONS = { fire: "🔥", heart: "❤️", pregnancy: "🧪", syringe: "💉", drop: "💊", baby2: "👶", money: "💰", purchase: "🧾", sale: "🏷️", bell: "🔔" };
    // Money/day-book events carry their full label in `type` (e.g. "🥛 Milk 24.5L");
    // herd events show the animal name.
    const text = /^\W/.test(ev.type || "") ? ev.type : `${ICONS[ev.icon] || "🔔"} ${ev.label}`;
    return JF.Utils.el("a", {
      class: `badge ${ev.color}`, href: ev.href,
      style: { display: "inline-flex", alignItems: "center", gap: "4px", maxWidth: "100%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: "11px", padding: "2px 7px", opacity: ev.dashed ? 0.75 : 1 },
      title: `${ev.type} · ${ev.label}`,
    }, text);
  };

  /* ---------- Month grid ---------- */
  const monthGrid = (eventMap) => {
    const first = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
    const start = weekStart(first);
    const todayKey = iso(JF.Utils.today());
    const cells = [];
    const dows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const header = JF.Utils.el("div", { class: "cal-dow-row" }, dows.map((d) => JF.Utils.el("div", { class: "cal-dow" }, d)));
    for (let i = 0; i < 42; i++) {
      const d = JF.Utils.addDays(start, i);
      const key = iso(d);
      const evts = eventMap[key] || [];
      const inMonth = d.getMonth() === viewDate.getMonth();
      const isToday = key === todayKey;
      const cell = JF.Utils.el("div", {
        class: `cal-cell ${inMonth ? "" : "cal-cell--dim"} ${isToday ? "cal-cell--today" : ""}`,
        onclick: () => { viewDate = d; mode = "day"; render(); },
        style: { cursor: "pointer" },
      }, [
        JF.Utils.el("div", { class: "cal-daynum" }, String(d.getDate())),
        JF.Utils.el("div", { class: "cal-chips" }, [
          ...evts.slice(0, 3).map(chip),
          evts.length > 3 ? JF.Utils.el("span", { class: "field__hint", style: { fontSize: "10px" } }, `+${evts.length - 3} more`) : null,
        ].filter(Boolean)),
      ]);
      cells.push(cell);
    }
    return JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } }, [
      header,
      JF.Utils.el("div", { class: "cal-grid" }, cells),
    ]);
  };

  /* ---------- Week strip ---------- */
  const weekGrid = (eventMap) => {
    const start = weekStart(viewDate);
    const todayKey = iso(JF.Utils.today());
    const cols = [];
    for (let i = 0; i < 7; i++) {
      const d = JF.Utils.addDays(start, i);
      const key = iso(d);
      const evts = eventMap[key] || [];
      cols.push(JF.Utils.el("div", { class: `cal-cell ${key === todayKey ? "cal-cell--today" : ""}` }, [
        JF.Utils.el("div", { class: "cal-daynum" }, `${weekdayName(d).slice(0, 3)} ${d.getDate()}`),
        JF.Utils.el("div", { class: "cal-chips" }, evts.map(chip)),
      ]));
    }
    return JF.Utils.el("div", { class: "card", style: { padding: "var(--space-4)" } },
      JF.Utils.el("div", { class: "cal-grid cal-grid--week" }, cols));
  };

  /* ---------- Day list ---------- */
  const dayList = (eventMap) => {
    const key = iso(viewDate);
    const evts = eventMap[key] || [];
    return JF.Utils.el("div", { class: "card", style: { padding: "var(--space-5)" } }, [
      JF.Utils.el("div", { class: "card__eyebrow" }, "EVENTS THIS DAY"),
      evts.length ? JF.Utils.el("div", { class: "timeline", style: { marginTop: "var(--space-3)" } },
        evts.map((ev) => JF.Utils.el("div", { class: "timeline__item" }, [
          JF.Utils.el("div", { class: "timeline__dot timeline__dot--heat", html: JF.Utils.svgIcon(ev.icon, 10, 10) }),
          JF.Utils.el("div", { class: "timeline__date" }, ev.type),
          JF.Utils.el("div", { class: "timeline__title" }, ev.label || "Herd"),
          JF.Utils.el("div", { class: "timeline__desc" }, JF.Utils.el("a", { href: ev.href, style: { fontWeight: 600 } }, "Open record →")),
        ])))
        : JF.Utils.el("div", { class: "search-empty", style: { marginTop: "var(--space-3)" } }, "No events on this day."),
    ]);
  };

  /* ---------- Render ---------- */
  const render = async () => {
    const root = $();
    JF.Utils.clear(root);
    const eventMap = await buildEventMap();

    const legend = JF.Utils.el("div", { class: "chip-row", style: { marginBottom: "var(--space-4)" } }, [
      ["badge--danger", "🔥 Heat"], ["badge--oxblood", "❤️ AI"], ["badge--accent", "🧪 PD Check"],
      ["badge--info", "💉 Vaccination"], ["badge--warning", "💊 Deworming / Expense"], ["badge--success", "👶 Calving / 🥛 Milk"],
    ].map(([c, l]) => JF.Utils.el("span", { class: `badge ${c}` }, l)));

    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "📅 Farm Calendar"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, titleFor()),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Heats, AI, checks, calvings, reminders — and the money days: milk collections, expenses, purchases and sales, straight from your entries. Tap a day for detail; add anything with one tap."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        navBtns(),
        JF.Utils.el("div", { class: "tabs", style: { marginBottom: 0 } }, ["month", "week", "day"].map((m) =>
          JF.Utils.el("a", { class: `tab ${mode === m ? "is-active" : ""}`, href: `#calendar`, onclick: (e) => { e.preventDefault(); mode = m; render(); } }, m[0].toUpperCase() + m.slice(1)))),
        JF.Utils.el("button", { class: "btn btn--accent btn--sm", onclick: () => JF.QuickEntry.openPicker() }, "+ Quick Entry"),
      ]),
    ]));
    page.appendChild(legend);
    page.appendChild(mode === "month" ? monthGrid(eventMap) : mode === "week" ? weekGrid(eventMap) : dayList(eventMap));

    // Side summary: busiest days this month
    if (mode === "month") {
      const monthKeys = Object.keys(eventMap).filter((k) => { const d = new Date(k); return d.getMonth() === viewDate.getMonth() && d.getFullYear() === viewDate.getFullYear(); });
      const total = monthKeys.reduce((s, k) => s + eventMap[k].length, 0);
      page.appendChild(JF.Utils.el("div", { class: "field__hint", style: { marginTop: "var(--space-4)", textAlign: "center" } },
        `${total} events across ${monthKeys.length} days this month · click any day for detail`));
    }

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Reminders = (function () {
  const $ = () => document.getElementById("view-container");

  let filters = { type: "", animal: "", priority: "" };

  const bucketOf = (r) => {
    const s = JF.Utils.daysBetween(JF.Utils.today(), r.DueDate);
    if (["Completed", "Dismissed"].includes(r.Status)) return "done";
    if (s < 0) return "overdue";
    if (s === 0) return "today";
    return "upcoming";
  };

  const typeIcon = (type) => ({
    "Heat Expected": "fire", "Pregnancy Check": "pregnancy", "Treatment Follow-up": "treatment",
    "Deworming": "drop", "Vaccination": "syringe", "Expected Calving": "baby2",
  }[type] || "bell");

  const daysBadge = (r) => {
    const s = JF.Utils.daysBetween(JF.Utils.today(), r.DueDate);
    if (s < 0) return `<span class="badge badge--danger">${-s}d overdue</span>`;
    if (s === 0) return `<span class="badge badge--oxblood">today</span>`;
    if (s <= 7) return `<span class="badge badge--warning">in ${s}d</span>`;
    return `<span class="badge badge--info">in ${s}d</span>`;
  };

  const row = (r) => JF.Utils.el("div", { class: "timeline__item", style: { alignItems: "flex-start" } }, [
    JF.Utils.el("div", { class: "timeline__dot timeline__dot--finance", html: JF.Utils.svgIcon(typeIcon(r.ReminderType), 10, 10) }),
    JF.Utils.el("div", { class: "timeline__date" }, JF.Utils.formatDate(r.DueDate) + (r.Time ? ` · ${r.Time}` : "")),
    JF.Utils.el("div", { class: "timeline__title" },
      `${r.ReminderType} · ${r.AnimalID || "Herd"}`,
      JF.Utils.el("span", { html: daysBadge(r), style: { marginLeft: "8px" } })),
    JF.Utils.el("div", { class: "timeline__desc" }, [
      r.Notes ? r.Notes : "",
      r.AnimalID ? JF.Utils.el("a", { href: `#animal/${r.AnimalID}/overview`, style: { marginLeft: "6px", fontWeight: 600 } }, "view animal") : null,
    ].filter(Boolean)),
    JF.Utils.el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", flexWrap: "wrap" } }, [
      JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => act(r, "Completed") }, "✓ Done"),
      JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => act(r, "Dismissed") }, "Dismiss"),
      JF.Utils.el("button", { class: "btn btn--ghost btn--sm", onclick: () => snooze(r) }, "Snooze 3d"),
    ]),
  ]);

  const act = async (r, status) => {
    await JF.Store.reminders.update(r.id, { Status: status });
    JF.Toast.show(status === "Completed" ? "Reminder completed." : "Reminder dismissed.", "success");
    render();
  };

  const snooze = async (r) => {
    const base = new Date(r.DueDate) > new Date() ? new Date(r.DueDate) : JF.Utils.today();
    const nd = JF.Utils.addDays(base, 3);
    await JF.Store.reminders.update(r.id, { DueDate: JF.Utils.formatDate(nd, "yyyy-MM-dd"), Status: "Upcoming" });
    JF.Toast.show(`Snoozed to ${JF.Utils.formatDate(nd)}.`, "success");
    render();
  };

  /* ---------- Custom reminder (anything the farm wants to remember) ---------- */

  const statusForDate = (dueISO) => {
    const diff = JF.Utils.daysBetween(JF.Utils.todayISO(), dueISO);
    if (diff < 0) return "Overdue";
    if (diff === 0) return "Due Today";
    return "Upcoming";
  };

  const openCustomModal = async () => {
    const animals = (await JF.Store.animals.list().catch(() => [])) || [];
    const active = animals.filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus));
    const field = (label, inputEl, hint) => JF.Utils.el("div", { class: "field" }, [
      JF.Utils.el("label", { class: "field__label" }, label),
      inputEl,
      hint ? JF.Utils.el("div", { class: "field__hint" }, hint) : null,
    ].filter(Boolean));

    const title = JF.Utils.el("input", { class: "input", id: "cr-title", placeholder: "e.g. Hoof trimming, Bank work, Miner mixture order", maxlength: "60" });
    const date = JF.Utils.el("input", { class: "input", type: "date", id: "cr-date", value: JF.Utils.todayISO() });
    const time = JF.Utils.el("input", { class: "input", type: "time", id: "cr-time" });
    const animal = JF.Utils.el("select", { class: "select", id: "cr-animal" }, [
      JF.Utils.el("option", { value: "" }, "Whole farm (no specific animal)"),
      ...active.map((a) => JF.Utils.el("option", { value: a.AnimalID }, `${a.Name || a.AnimalID} (${a.AnimalID})`)),
    ]);
    const priority = JF.Utils.el("select", { class: "select", id: "cr-priority" }, [
      JF.Utils.el("option", { value: "Normal" }, "Normal"),
      JF.Utils.el("option", { value: "High" }, "High"),
      JF.Utils.el("option", { value: "Low" }, "Low"),
    ]);
    const lead = JF.Utils.el("input", { class: "input", type: "number", id: "cr-lead", value: "0", min: "0", max: "60" });
    const notes = JF.Utils.el("textarea", { class: "input", id: "cr-notes", rows: "2", placeholder: "Optional details…" });

    const body = JF.Utils.el("div", { class: "form-stack" }, [
      field("What needs doing? *", title),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        field("Date *", date),
        field("Time (optional)", time, "Shown on the reminder; phone browsers get a time picker."),
      ]),
      field("Animal (optional)", animal),
      JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        field("Priority", priority),
        field("Remind days before", lead),
      ]),
      field("Notes", notes),
    ]);

    const err = JF.Utils.el("div", { class: "field__hint", style: { color: "var(--color-oxblood-700)", minHeight: "18px" } });
    body.appendChild(err);

    const saveBtn = JF.Utils.el("button", { class: "btn btn--primary" }, "Save Reminder");
    saveBtn.onclick = async () => {
      const t = title.value.trim();
      const d = date.value;
      if (!t) { err.textContent = "Give the reminder a title."; title.focus(); return; }
      if (!d) { err.textContent = "Pick a date."; date.focus(); return; }
      const leadN = Math.max(0, Math.min(60, parseInt(lead.value, 10) || 0));
      const remindOn = JF.Utils.formatDate(JF.Utils.addDays(d, -leadN), "yyyy-MM-dd");
      await JF.Store.reminders.create({
        ReminderID: `RMN-CUSTOM-${JF.Utils.uid()}`,
        AnimalID: animal.value || null,
        ReminderType: t,
        DueDate: d,
        Time: time.value || null,
        ReminderDate: remindOn,
        Priority: priority.value,
        Status: statusForDate(d),
        Source: "Custom",
        Notes: notes.value.trim() || (leadN ? `Reminds ${leadN}d before` : ""),
      });
      JF.Modal.close();
      JF.Toast.show("Reminder added.", "success");
      JF.App.updateBadgeCounts();
      render();
    };

    JF.Modal.open({
      title: "Add Custom Reminder",
      size: "md",
      body,
      footer: JF.Utils.el("div", { style: { display: "flex", gap: "10px", justifyContent: "flex-end" } }, [
        JF.Utils.el("button", { class: "btn btn--ghost", onclick: () => JF.Modal.close() }, "Cancel"),
        saveBtn,
      ]),
      onMount: () => setTimeout(() => title.focus(), 60),
    });
  };

  const section = (title, eyebrow, icon, items, accent) => {
    const list = JF.Utils.el("div", {});
    if (items.length) items.forEach((r) => list.appendChild(row(r)));
    else list.appendChild(JF.Utils.el("div", { class: "search-empty" }, [
      JF.Utils.el("div", { style: { opacity: 0.4, marginBottom: "8px" }, html: JF.Utils.svgIcon(icon, 24, 24) }),
      "Nothing here — all clear for this bucket.",
    ]));
    return JF.Utils.el("div", { class: "card" }, [
      JF.Utils.el("div", { class: "card__header" }, [
        JF.Utils.el("div", {}, [
          JF.Utils.el("div", { class: "card__eyebrow" }, eyebrow),
          JF.Utils.el("h3", { class: "section__title", style: { margin: 0 } },
            `${title} `, JF.Utils.el("span", { class: "chip" }, `${items.length}`)),
        ]),
        JF.Utils.el("div", { class: `stat-icon ${accent || ""}`, html: JF.Utils.svgIcon(icon, 20, 20) }),
      ]),
      JF.Utils.el("div", { class: "timeline" }, [list]),
    ]);
  };

  const filterBar = (types, animals) => {
    const sel = (id, label, opts, val, cb) => JF.Utils.el("select", { class: "select", id, onchange: (e) => { cb(e.target.value); render(); } }, [
      JF.Utils.el("option", { value: "" }, label),
      ...opts.map((o) => JF.Utils.el("option", { value: o, selected: val === o ? true : null }, o)),
    ]);
    return JF.Utils.el("div", { class: "card", style: { marginBottom: "var(--space-5)", padding: "var(--space-4)", display: "flex", gap: "var(--space-3)", flexWrap: "wrap", alignItems: "center" } }, [
      sel("flt-type", "All types", types, filters.type, (v) => filters.type = v),
      sel("flt-animal", "All animals", animals, filters.animal, (v) => filters.animal = v),
      sel("flt-priority", "Any priority", ["High", "Normal", "Low"], filters.priority, (v) => filters.priority = v),
      JF.Utils.el("label", { class: "chip", style: { cursor: "pointer" } }, [
        JF.Utils.el("input", { type: "checkbox", id: "flt-done", checked: filters.showDone ? true : null, style: { marginRight: "6px" }, onchange: (e) => { filters.showDone = e.target.checked; render(); } }),
        "Show completed",
      ]),
    ]);
  };

  const render = async () => {
    const root = $();
    JF.Utils.clear(root);
    const page = JF.Utils.el("div", { class: "page" });
    page.appendChild(JF.Utils.el("div", { class: "page__head-row" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "eyebrow" }, "🔔 Reminders"),
        JF.Utils.el("h1", { class: "page__title", style: { marginTop: "8px" } }, "Your Action List"),
        JF.Utils.el("p", { class: "page__sub", style: { marginTop: "var(--space-2)" } },
          "Overdue first, then today, then what's ahead. Snooze or dismiss anything that's handled."),
      ]),
      JF.Utils.el("div", { class: "page__actions" }, [
        JF.Utils.el("button", {
          class: "btn btn--ghost btn--sm", onclick: async () => {
            const list = (await JF.Store.reminders.list()).filter((r) => bucketOf(r) === "overdue");
            for (const r of list) await JF.Store.reminders.update(r.id, { DueDate: JF.Utils.todayISO(), Status: "Due Today" });
            JF.Toast.show(list.length ? `${list.length} overdue reminders moved to today.` : "No overdue reminders.", "success");
            render();
          },
        }, "Pull Overdue to Today"),
        JF.Utils.el("button", { class: "btn btn--accent btn--sm", onclick: () => openCustomModal() }, "+ Custom Reminder"),
        JF.Utils.el("button", {
          class: "btn btn--primary btn--sm", type: "button",
          onclick: async () => {
            if (!confirm("Rebuild every reminder from the entries on file?\n\nAll existing reminders (including manual ones) are deleted first, then regenerated from the Rules sheet against your real records. Nothing else is touched.")) return;
            const btns = document.querySelectorAll(".page__actions .btn");
            btns.forEach((b) => { b.disabled = true; });
            JF.Toast.show("Rebuilding reminders from entries...", "info");
            try {
              const r = await JF.RuleEngine.rebuild();
              JF.Toast.show(`Deleted ${r.removed} old reminder(s), regenerated ${r.created} from ${r.animals} animals' entries.`, "success");
            } catch (e) {
              JF.Toast.show(`Rebuild failed: ${e.message}`, "danger");
            }
            render();
          },
        }, "🔄 Rebuild From Entries"),
        JF.Utils.el("button", {
          class: "btn btn--ghost btn--sm", type: "button",
          onclick: async () => {
            if (!confirm("Delete ALL reminders?\n\nUse 'Rebuild From Entries' instead if you want them regenerated automatically from your records.")) return;
            const n = await JF.RuleEngine.clearReminders({ includeManual: true });
            JF.Toast.show(`Deleted ${n} reminder(s).`, "success");
            render();
          },
        }, "🗑 Delete All Reminders"),
      ]),
    ]));

    let all = (await JF.Store.reminders.list().catch(() => [])) || [];
    const types = [...new Set(all.map((r) => r.ReminderType).filter(Boolean))].sort();
    const animals = [...new Set(all.map((r) => r.AnimalID).filter(Boolean))].sort();
    page.appendChild(filterBar(types, animals));

    const F = filters;
    const filtered = all.filter((r) =>
      (!F.type || r.ReminderType === F.type) &&
      (!F.animal || r.AnimalID === F.animal) &&
      (!F.priority || (r.Priority || "Normal") === F.priority)
    );
    const buckets = { overdue: [], today: [], upcoming: [], done: [] };
    filtered.forEach((r) => buckets[bucketOf(r)].push(r));
    buckets.overdue.sort((a, b) => new Date(a.DueDate) - new Date(b.DueDate));
    buckets.today.sort((a, b) => String(a.ReminderType).localeCompare(b.ReminderType));
    buckets.upcoming.sort((a, b) => new Date(a.DueDate) - new Date(b.DueDate));

    const stat = (label, n, icon, accent) => JF.Utils.el("div", { class: "card card--stat" }, [
      JF.Utils.el("div", { class: `stat-icon ${accent || ""}`, html: JF.Utils.svgIcon(icon, 20, 20) }),
      JF.Utils.el("div", {}, [
        JF.Utils.el("div", { class: "stat-number" }, String(n)),
        JF.Utils.el("div", { class: "card__eyebrow", style: { marginTop: "6px" } }, label),
      ]),
    ]);
    page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3", style: { marginBottom: "var(--space-6)" } }, [
      stat("⚠️ OVERDUE", buckets.overdue.length, "warning", "stat-icon--danger"),
      stat("📍 TODAY", buckets.today.length, "clock", "stat-icon--oxblood"),
      stat("⏭️ UPCOMING", buckets.upcoming.length, "calendar", ""),
    ]));

    page.appendChild(JF.Utils.el("div", { class: "grid grid--cols-3" }, [
      section("Overdue", "🚨 PAST DUE", "warning", buckets.overdue, "stat-icon--danger"),
      section("Today", "📍 DUE TODAY", "clock", buckets.today, "stat-icon--oxblood"),
      section("Upcoming", "⏭️ NEXT UP", "calendar", buckets.upcoming, ""),
    ]));

    if (filters.showDone) {
      page.appendChild(JF.Utils.el("div", { style: { marginTop: "var(--space-5)" } },
        section("Completed / Dismissed", "✓ DONE", "check", buckets.done, "")));
    }

    root.appendChild(page);
  };

  return { render };
})();

</script>
  <script>
JF.Views = JF.Views || {};
JF.Views.Reports = (function () {
  const $ = () => document.getElementById("view-container");

  const money = (n) => JF.Utils.money(n || 0);
  const td = (h) => JF.Utils.el("td", { html: h });

  const cycleStats = (dates) => {
    const ds = dates.map((d) => new Date(d)).filter((d) => !isNaN(d)).sort((a, b) => b - a);
    const iv = [];
    for (let i = 1; i < ds.length; i++) iv.push(Math.round((ds[i - 1] - ds[i]) / 86400000));
    const avg = iv.length ? Math.round((iv.reduce((a, b) => a + b, 0) / iv.length) * 10) / 10 : null;
    return { count: ds.length, avg, min: iv.length ? Math.min(...iv) : null, max: iv.length ? Math.max(...iv) : null, last: ds[0] };
  };

  const build = async () => {
    const [animals, heats, ais, pregs, calvs, healths, dews, vax, deaths, purchases, sales, expenses, journal] = await Promise.all([
      JF.Store.animals.list(), JF.Store.heat.list(), JF.Store.insemination.list(),
      JF.Store.pregnancy.list(), JF.Store.calving.list(), JF.Store.health.list(),
      JF.Store.deworming.list(), JF.Store.vaccination.list(), JF.Store.death.list(),
      JF.Store.purchases.list(), JF.Store.sales.list(), JF.Store.expenses.list(), JF.Store.journal.list(),
    ]);
    const name = (id) => { const a = animals.find((x) => x.AnimalID === id); return a ? `${a.Name || ""} (${id})` : (id || "—"); };
    const active = animals.filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus));
    return { animals, active, heats, ais, pregs, calvs, healths, dews, vax, deaths, purchases, sales, expenses, journal, name };
  };

  /* ---------- 28 report definitions ---------- */
  const G = {};
  const R = (slug, group, title, run) => { G[slug] = { group, title, run }; };

  // Animal (7)
  R("complete-register", "animal", "Complete Animal Register", async () => {
    const { animals } = await build();
    return {
      headers: ["Animal ID", "Name", "Species", "Breed", "Gender", "DOB", "Age", "Status", "Group", "Location"],
      rows: animals.map((a) => [a.AnimalID, a.Name, a.Species, a.Breed, a.Gender, fmt(a.DateOfBirth), JF.Utils.ageLabel(a.DateOfBirth), a.CurrentStatus, a.CurrentGroup || "—", a.CurrentLocation || "—"]),
      footers: [`${animals.length} animals`, "", "", "", "", "", "", "", "", ""],
    };
  });
  R("active-herd", "animal", "Active Herd", async () => {
    const { active } = await build();
    return {
      headers: ["Animal ID", "Name", "Breed", "Age", "Status", "Location"],
      rows: active.map((a) => [a.AnimalID, a.Name, a.Breed, JF.Utils.ageLabel(a.DateOfBirth), a.CurrentStatus, a.CurrentLocation || "—"]),
      footers: [`${active.length} active`, "", "", "", "", ""],
    };
  });
  R("pregnant", "animal", "Pregnant Animals", async () => {
    const { active } = await build();
    const list = active.filter((a) => a.CurrentStatus === "Pregnant");
    return {
      headers: ["Animal ID", "Name", "Breed", "Age", "Status"],
      rows: list.map((a) => [a.AnimalID, a.Name, a.Breed, JF.Utils.ageLabel(a.DateOfBirth), a.CurrentStatus]),
      footers: [`${list.length} pregnant`, "", "", "", ""],
    };
  });
  R("open", "animal", "Open (Empty) Females", async () => {
    const { active } = await build();
    const list = active.filter((a) => a.Gender === "Female" && a.CurrentStatus === "Open");
    return {
      headers: ["Animal ID", "Name", "Breed", "Age", "Status"],
      rows: list.map((a) => [a.AnimalID, a.Name, a.Breed, JF.Utils.ageLabel(a.DateOfBirth), a.CurrentStatus]),
      footers: [`${list.length} open`, "", "", "", ""],
    };
  });
  R("in-heat", "animal", "In Heat", async () => {
    const { active } = await build();
    const list = active.filter((a) => a.CurrentStatus === "In Heat");
    return {
      headers: ["Animal ID", "Name", "Breed", "Status", "Location"],
      rows: list.map((a) => [a.AnimalID, a.Name, a.Breed, a.CurrentStatus, a.CurrentLocation || "—"]),
      footers: [`${list.length} in heat`, "", "", "", ""],
    };
  });
  R("sold", "animal", "Sold Animals", async () => {
    const { animals, sales } = await build();
    const sold = animals.filter((a) => a.CurrentStatus === "Sold");
    return {
      headers: ["Animal ID", "Name", "Breed", "Sold Via", "Date", "Net Price"],
      rows: sold.map((a) => {
        const s = sales.find((x) => x.AnimalID === a.AnimalID);
        return [a.AnimalID, a.Name, a.Breed, s?.Buyer || "—", s ? fmt(s.Date) : "—", s ? money(s.NetSale || s.SalePrice) : "—"];
      }),
      footers: [`${sold.length} sold`, "", "", "", "", ""],
    };
  });
  R("deceased", "animal", "Deceased Animals", async () => {
    const { animals, deaths } = await build();
    const dead = animals.filter((a) => a.CurrentStatus === "Deceased");
    return {
      headers: ["Animal ID", "Name", "Breed", "Date", "Cause", "Vet"],
      rows: dead.map((a) => {
        const d = deaths.find((x) => x.AnimalID === a.AnimalID);
        return [a.AnimalID, a.Name, a.Breed, d ? fmt(d.Date) : "—", d?.Cause || "—", d?.Veterinarian || "—"];
      }),
      footers: [`${dead.length} deceased`, "", "", "", "", ""],
    };
  });

  // Reproduction (7)
  R("heat-history", "repro", "Heat History", async () => {
    const { heats, name } = await build();
    const rows = [...heats].sort((a, b) => new Date(b.HeatDate) - new Date(a.HeatDate))
      .map((h) => [fmt(h.HeatDate), name(h.AnimalID), h.HeatIntensity || "—", h.DetectionMethod || "—", (h.Symptoms || []).join(", ") || "—"]);
    return { headers: ["Date", "Animal", "Intensity", "Detection", "Symptoms"], rows, footers: [`${rows.length} records`, "", "", "", ""] };
  });
  R("heat-cycle", "repro", "Heat Cycle Analysis", async () => {
    const { heats, name } = await build();
    const byA = {};
    heats.forEach((h) => { if (h.AnimalID) (byA[h.AnimalID] = byA[h.AnimalID] || []).push(h.HeatDate); });
    const rows = Object.entries(byA).map(([id, dates]) => {
      const s = cycleStats(dates);
      const expNext = s.avg && s.last ? fmt(JF.Utils.addDays(s.last, Math.round(s.avg))) : "—";
      return [name(id), s.count, s.avg ? `${s.avg}d` : "—", s.min ? `${s.min}d` : "—", s.max ? `${s.max}d` : "—", s.last ? fmt(s.last) : "—", expNext];
    });
    return { headers: ["Animal", "Heats", "Avg Cycle", "Shortest", "Longest", "Last Heat", "Expected Next"], rows, footers: [`${rows.length} animals`, "", "", "", "", "", ""] };
  });
  R("insemination", "repro", "Insemination List", async () => {
    const { ais, name } = await build();
    const rows = [...ais].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((x) => [fmt(x.Date), name(x.AnimalID), x.Method || "AI", x.SemenBullID || "—", x.Technician || "—", x.Cost ? money(x.Cost) : "—"]);
    return { headers: ["Date", "Animal", "Method", "Bull/Semen", "Technician", "Cost"], rows, footers: [`${rows.length} records`, "", "", "", "", ""] };
  });
  R("pregnancy", "repro", "Pregnancy Check List", async () => {
    const { pregs, name } = await build();
    const rows = [...pregs].sort((a, b) => new Date(b.Date) - new Date(a.Date))
      .map((p) => [fmt(p.Date), name(p.AnimalID), p.Method || "—", p.Result || "Unknown", p.Veterinarian || "—"]);
