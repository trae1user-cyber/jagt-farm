  <script>
window.JF = window.JF || {};

/**
 * ReproIntel — observation-driven reproductive intelligence.
 *
 * Everything here is descriptive analytics on records the farm actually logged.
 * Nothing is a veterinary diagnosis: every number carries a plain-language
 * explanation (why()), and confidence reflects how complete the observations are.
 *
 * Core concepts
 * -------------
 * Episode     : all heat observations + AIs + treatments for one cow within a
 *               clustering window, forming one reproductive story.
 * Evidence    : weighted observations (standing heat, mucus, mounting, ...).
 * Onset est.  : earliest evidence → first strong standing evidence → best estimate.
 * Ovulation   : probability band derived from onset + configured biology window.
 * Coverage    : how each AI sits inside the high/probable/possible bands.
 * Return heat : heat observed 18–24d after an AI without a positive PD → flag.
 */
JF.ReproIntel = (function () {

  /* ---------------- Evidence model ---------------- */

  // Observation weights (0..1). Standing heat dominates; others corroborate.
  const EVIDENCE = {
    "Standing Heat":        { w: 1.0, strong: true,  label: "Standing to be mounted" },
    "Standing while mounted": { w: 1.0, strong: true, label: "Standing while mounted" },
    "Clear Mucus":          { w: 0.6, strong: false, label: "Clear mucus discharge" },
    "Mucus Discharge":      { w: 0.6, strong: false, label: "Mucus discharge" },
    "Mounting":             { w: 0.5, strong: false, label: "Mounting other cows" },
    "Restlessness":         { w: 0.3, strong: false, label: "Restless / bawling" },
    "Increased Vocalization": { w: 0.3, strong: false, label: "More vocal than usual" },
    "Vulvar Swelling":      { w: 0.4, strong: false, label: "Swollen vulva" },
    "Reduced Intake":       { w: 0.2, strong: false, label: "Off feed" },
    "Tail Raising":         { w: 0.4, strong: false, label: "Tail raising / switching" },
    "Chin Resting":         { w: 0.3, strong: false, label: "Chin resting" },
  };

  const evKey = (label) => {
    const k = String(label || "").toLowerCase();
    for (const name in EVIDENCE) if (name.toLowerCase() === k) return name;
    if (/stand/.test(k)) return "Standing Heat";
    if (/muc/.test(k)) return "Clear Mucus";
    if (/mount/.test(k)) return "Mounting";
    if (/restl/.test(k)) return "Restlessness";
    if (/vocal/.test(k)) return "Increased Vocalization";
    if (/vulv|swell/.test(k)) return "Vulvar Swelling";
    if (/tail/.test(k)) return "Tail Raising";
    if (/chin/.test(k)) return "Chin Resting";
    if (/appetit|intake|feed/.test(k)) return "Reduced Intake";
    return null;
  };

  /* ---------------- Small date helpers (UTC-safe) ---------------- */

  const dayStart = (d) => { const x = JF.Utils.parseDate(d); x.setHours(0, 0, 0, 0); return x; };
  const addMin = (d, m) => new Date(d.getTime() + m * 60000);
  const timeOf = (r) => {
    const t = r.HeatTime || r.Time || "";
    const m = String(t).match(/^(\d{1,2}):(\d{2})/);
    return m ? { h: +m[1], min: +m[2] } : null;
  };
  const momentOf = (rec, dateKey) => {
    const d = dayStart(rec[dateKey] || rec.Date || rec.CreatedAt);
    const t = timeOf(rec);
    if (t) d.setHours(t.h, t.min, 0, 0);
    return d;
  };

  /* ---------------- Episode clustering ---------------- */

  // Events fold into one episode when gaps stay under the window (hours).
  const CLUSTER_HOURS = 96; // 4 days

  /**
   * Build reproductive episodes for one animal from raw records.
   * Observations come from heat records (with Symptoms[], HeatTime) and
   * optional standalone observation rows; AIs from insemination.
   */
  const episodesFor = (animalId, { heats = [], inseminations = [], healths = [], animals = [] } = {}) => {
    const animal = animals.find((a) => a.AnimalID === animalId || a.id === animalId);
    const obs = [];
    (heats || []).filter((h) => h.AnimalID === animalId).forEach((h) => {
      const syms = Array.isArray(h.Symptoms) ? h.Symptoms : String(h.Symptoms || "").split(",").map((s) => s.trim()).filter(Boolean);
      const moment = momentOf(h, "HeatDate");
      obs.push({
        at: moment,
        dateKey: JF.Utils.formatDate(h.HeatDate || "", "yyyy-MM-dd"),
        time: h.HeatTime || "",
        signs: syms,
        raw: h,
        kind: "obs",
      });
    });
    const ais = (inseminations || [])
      .filter((x) => x.AnimalID === animalId)
      .map((x) => ({ at: momentOf(x, "Date"), dateKey: JF.Utils.formatDate(x.Date || "", "yyyy-MM-dd"), time: x.Time || "", raw: x, kind: "ai" }))
      .sort((a, b) => a.at - b.at);

    // No observations at all → synthesize "assumed heat" episodes at AI dates so
    // legacy data still gets coverage analysis.
    if (!obs.length && ais.length) {
      ais.forEach((ai) => obs.push({ at: new Date(ai.at.getTime() - 12 * 3600e3), dateKey: ai.dateKey, time: "", signs: [], raw: null, kind: "assumed" }));
    }
    obs.sort((a, b) => a.at - b.at);

    // Cluster observations into episodes.
    const episodes = [];
    let cur = null;
    obs.forEach((o) => {
      if (!cur || (o.at - cur.end) > CLUSTER_HOURS * 3600e3) {
        cur = { start: o.at, end: o.at, obs: [], ais: [] };
        episodes.push(cur);
      }
      cur.end = o.at > cur.end ? o.at : cur.end;
      cur.obs.push(o);
    });
    // Attach AIs to the episode whose window [start-12h, end+72h] contains them.
    ais.forEach((ai) => {
      let best = null, bestGap = Infinity;
      episodes.forEach((ep) => {
        const lo = ep.start.getTime() - 12 * 3600e3;
        const hi = ep.end.getTime() + 72 * 3600e3;
        if (ai.at.getTime() >= lo && ai.at.getTime() <= hi) {
          const mid = (ep.start.getTime() + ep.end.getTime()) / 2;
          const gap = Math.abs(ai.at.getTime() - mid);
          if (gap < bestGap) { bestGap = gap; best = ep; }
        }
      });
      (best || episodes[episodes.length - 1] || { obs: [], ais: [] }).ais.push(ai);
      if (!episodes.length) episodes.push({ start: ai.at, end: ai.at, obs: [], ais: [ai] });
    });

    const built = episodes.map((ep, idx) => buildEpisode(animalId, animal, ep, idx));
    // Cross-episode return-to-heat: a NEW heat episode starting 18–24d after the
    // previous episode's last AI (no positive PD between) → flag, never diagnose.
    for (let i = 1; i < built.length; i++) {
      if (built[i].returnHeat && built[i].returnHeat.possible) continue;
      const prev = built[i - 1];
      const prevAI = prev.aiCoverage[prev.aiCoverage.length - 1];
      if (!prevAI) continue;
      const gap = Math.round((built[i].start.getTime() - prevAI.at.getTime()) / 86400e3);
      if (gap >= 18 && gap <= 24) {
        built[i].returnHeat = {
          possible: true,
          crossEpisode: true,
          afterAI: prevAI.ai.InseminationID || prevAI.ai.id,
          intervalDays: gap,
          note: `New heat ~${gap} days after the previous AI (${JF.Utils.formatDate(prevAI.at, "d MMM")}) — possible return to heat after AI. Not a diagnosis: confirm with a pregnancy check.`,
        };
        built[i].actions.push({ icon: "fire", text: `Possible return to heat after AI — ${gap}-day interval from ${JF.Utils.formatDate(prevAI.at, "d MMM")}. Review with a pregnancy check.`, tone: "warn" });
      }
    }
    return built;
  };

  const buildEpisode = (animalId, animal, ep, idx) => {
    const events = [...ep.obs, ...ep.ais].sort((a, b) => a.at - b.at);

    // --- Evidence scoring ---
    const perSign = {};
    let totalW = 0, maxW = 1.6; // standing heat alone ≈ 62%; two strong signs cap
    let strongSeen = null;
    ep.obs.forEach((o) => {
      o.signs.forEach((s) => {
        const name = evKey(s);
        if (!name) return;
        const e = EVIDENCE[name];
        perSign[name] = perSign[name] || { label: e.label, score: 0, seen: 0 };
        perSign[name].seen++;
        if (perSign[name].score < e.w) perSign[name].score = e.w;
      });
    });
    Object.values(perSign).forEach((p) => { totalW += p.score; if (EVIDENCE[p.label]?.strong || p.score >= 0.9) strongSeen = strongSeen || p; });
    const evidenceScore = Math.min(1, totalW / maxW);

    // First strong standing-heat observation (or highest-weighted as fallback).
    const strongObs = ep.obs.find((o) => o.signs.some((s) => { const k = evKey(s); return k && EVIDENCE[k].strong; }));
    const firstEvidence = ep.obs[0] || null;
    const onset = strongObs || firstEvidence;

    // --- Onset estimate ---
    const onsetEstimate = onset ? {
      earliest: firstEvidence ? firstEvidence.at : null,
      earliestLabel: firstEvidence ? describeObs(firstEvidence) : "",
      firstStrong: strongObs ? strongObs.at : null,
      firstStrongLabel: strongObs ? describeObs(strongObs) : "",
      best: onset.at,
      bestLabel: describeObs(onset),
      basis: strongObs ? "first strong standing-heat evidence" : (firstEvidence ? "earliest recorded observation" : ""),
    } : null;

    // --- Ovulation window (probability cloud) ---
    // Biology: ovulation ≈ 24–32h after standing-heat onset. Bands widen when
    // the evidence is thin (no standing heat observed).
    const standingSeen = !!strongObs;
    const baseAfter = standingSeen ? 24 : 30;  // hours after onset
    const spanBefore = standingSeen ? 4 : 8;
    const spanAfter = standingSeen ? 8 : 14;
    const ovulLo = addMin(onset ? onset.at : ep.start, (baseAfter - spanBefore) * 60);
    const ovulHi = addMin(onset ? onset.at : ep.start, (baseAfter + spanAfter) * 60);
    const ovulCoreLo = addMin(onset ? onset.at : ep.start, baseAfter * 60 - 60);
    const ovulCoreHi = addMin(onset ? onset.at : ep.start, baseAfter * 60 + 120);

    // --- AI timing coverage ---
    // Fertile window ≠ ovulation moment: sperm needs ~4-6h capacitation, so
    // well-timed AIs land BEFORE ovulation (classic AM/PM rule: AI 2-20h after
    // standing-heat onset). Bands are therefore earlier-shifted, not ± around ovulation.
    const fertileLo = addMin(onset.at, standingSeen ? 2 * 60 : 0);
    const fertileHi = addMin(onset.at, standingSeen ? 28 * 60 : 40 * 60);
    const primeLo = addMin(onset.at, standingSeen ? 4 * 60 : 6 * 60);
    const primeHi = addMin(onset.at, standingSeen ? 20 * 60 : 28 * 60);
    const aiCoverage = ep.ais.map((ai) => {
      const t = ai.at.getTime();
      const lo = fertileLo.getTime(), hi = fertileHi.getTime();
      const coreLo = primeLo.getTime(), coreHi = primeHi.getTime();
      let band, note;
      if (t >= coreLo && t <= coreHi) { band = "prime"; note = "Inside the highest-fertility window after heat onset"; }
      else if (t >= lo && t <= hi) { band = "good"; note = "Within the fertile window (AM/PM rule)"; }
      else if (t < lo) { band = "early"; note = "Very soon after heat onset — well before the peak window"; }
      else { band = "late"; note = "Later than the fertile window — return heat watch recommended"; }
      const offsetH = Math.round((((t - primeLo.getTime()) / 3600e3) - (primeHi - primeLo) / 7200e3) * 10) / 10;
      return {
        ai: ai.raw,
        at: ai.at,
        band,
        note,
        offsetHours: offsetH,
        label: `${JF.Utils.formatDate(ai.at, "dd MMM")} ${ai.time || ""}`.trim(),
      };
    });

    // --- Return-to-heat detection (18-24d after AI, no positive PD) ---
    let returnHeat = null;
    const lastAI = ep.ais[ep.ais.length - 1];
    const nextHeatEp = null; // resolved by caller if needed
    if (lastAI) {
      const gapDays = (ep.end.getTime() - lastAI.at.getTime()) / 86400e3;
      const lateAIs = ep.ais.slice(0, -1).filter((a2) => (lastAI.at - a2.at) / 86400e3 >= 16 && (lastAI.at - a2.at) / 86400e3 <= 26);
      if (ep.ais.length >= 2 && lateAIs.length) {
        returnHeat = {
          possible: true,
          afterAI: lastAI.raw.InseminationID || lastAI.raw.id,
          intervalDays: Math.round((lastAI.at - lateAIs[lateAIs.length - 1].at) / 86400e3),
          note: "Two AIs ~3 weeks apart — possible return to heat after the first AI (no positive pregnancy check recorded in this episode).",
        };
      }
    }

    // --- Next actions (workflow assistant) ---
    const actions = nextActions({ ep, onset, standingSeen, aiCoverage, returnHeat, evidenceScore });

    return {
      id: `${animalId}-EP`,
      animalId,
      index: idx + 1,
      start: ep.start, end: ep.end,
      events,
      observations: ep.obs.filter((o) => o.kind !== "ai"),
      signs: perSign,
      evidenceScore,
      evidencePct: Math.round(evidenceScore * 100),
      standingSeen,
      onsetEstimate,
      ovulation: { lo: ovulLo, hi: ovulHi, coreLo: ovulCoreLo, coreHi: ovulCoreHi, standingSeen, fertileLo, fertileHi, primeLo, primeHi },
      aiCoverage,
      returnHeat,
      actions,
    };
  };

  const describeObs = (o) => {
    if (!o) return "";
    const sign = o.signs && o.signs.length ? o.signs[0] : "observation";
    const t = o.time ? ` at ${o.time}` : "";
    return `${sign}${t} on ${JF.Utils.formatDate(o.at, "d MMM")}`;
  };

  /* ---------------- Next actions ---------------- */

  const nextActions = ({ ep, onset, standingSeen, aiCoverage, returnHeat, evidenceScore }) => {
    const list = [];
    const covered = aiCoverage.some((c) => c.band === "prime" || c.band === "good");
    if (!aiCoverage.length && onset) {
      list.push({ icon: "syringe", text: "AI timing window being monitored — record AI when performed", tone: covered ? "good" : "warn" });
      list.push({ icon: "pregnancy", text: "Pregnancy check reminder will be created automatically after AI", tone: "info" });
    } else if (aiCoverage.length) {
      const last = aiCoverage[aiCoverage.length - 1];
      if (last.band === "late") list.push({ icon: "fire", text: "Watch for return to heat (~18–24 days after AI)", tone: "warn" });
      list.push({ icon: "pregnancy", text: "Pregnancy check due ~30 days after AI", tone: "info" });
    }
    if (!standingSeen && ep.obs.length) list.push({ icon: "animals", text: "Record standing heat if observed — sharpens the onset estimate", tone: "info" });
    if (evidenceScore < 0.5) list.push({ icon: "eye", text: "Observations are thin — log more signs for better timing guidance", tone: "info" });
    if (returnHeat && returnHeat.possible) list.push({ icon: "fire", text: "Review this episode — possible return to heat after AI", tone: "warn" });
    return list;
  };

  /* ---------------- Herd-level: traffic lights & scorecards ---------------- */

  const TRAFFIC = {
    red:      { key: "red",      label: "Action overdue",        cls: "traffic--red" },
    orange:   { key: "orange",   label: "Action needed soon",    cls: "traffic--orange" },
    yellow:   { key: "yellow",   label: "Action approaching",    cls: "traffic--yellow" },
    green:    { key: "green",    label: "Normal / monitoring",   cls: "traffic--green" },
    blue:     { key: "blue",     label: "Pregnant",              cls: "traffic--blue" },
    magenta:  { key: "magenta",  label: "In reproductive episode", cls: "traffic--magenta" },
  };

  const trafficLight = async (animal) => {
    const aID = animal.AnimalID || animal.id;
    const status = animal.CurrentStatus || "";
    if (["Sold", "Deceased"].includes(status)) return { ...TRAFFIC.green, hidden: true };
    if (status === "Pregnant") return { ...TRAFFIC.blue, next: "Calving monitoring" };

    // One unreadable entity must not break the Animals table: degrade to an
    // empty list (the traffic light just shows fewer signals) instead of
    // throwing. 404/400s from an older server version land here too.
    const safeList = async (call) => { try { return await call; } catch (e) { return []; } };
    const [heats, insem, preg, healths, calvings] = await Promise.all([
      safeList(JF.Store.heat.list()), safeList(JF.Store.insemination.list()), safeList(JF.Store.pregnancy.list()),
      safeList(JF.Store.health.list()), safeList(JF.Store.calving.list()),
    ]);
    const today = JF.Utils.todayISO();
    const since = (iso) => JF.Utils.daysBetween(iso, today);

    const lastHeat = heats.filter((h) => h.AnimalID === aID).sort((a, b) => new Date(b.HeatDate) - new Date(a.HeatDate))[0];
    const lastAI = insem.filter((x) => x.AnimalID === aID).sort((a, b) => new Date(b.Date) - new Date(a.Date))[0];
    const lastPreg = preg.filter((x) => x.AnimalID === aID).sort((a, b) => new Date(b.Date) - new Date(a.Date))[0];
    const openCase = healths.find((h) => h.AnimalID === aID && ["Open", "Under Treatment"].includes(h.RecoveryStatus || ""));

    if (openCase) {
      const follow = openCase.FollowUpDate ? since(openCase.FollowUpDate) : 0;
      return { ...TRAFFIC.red, next: follow > 0 ? "Treatment overdue" : "Treatment follow-up", record: openCase };
    }
    if (lastPreg && lastPreg.Result === "Recheck") return { ...TRAFFIC.orange, next: "Pregnancy recheck", record: lastPreg };
    if (lastAI && !lastPreg) {
      const d = since(lastAI.Date);
      if (d >= 28) return { ...TRAFFIC.orange, next: "Pregnancy check overdue", record: lastAI };
      if (d >= 22) return { ...TRAFFIC.yellow, next: "Pregnancy check due soon", record: lastAI };
      if (d >= 17 && lastHeat && since(lastHeat.HeatDate) <= 7) return { ...TRAFFIC.magenta, next: "Possible return to heat — review", record: lastHeat };
      return { ...TRAFFIC.green, next: "Post-AI monitoring", record: lastAI };
    }
    if (status === "In Heat") return { ...TRAFFIC.magenta, next: "AI window — monitor closely", record: lastHeat };
    if (lastHeat) {
      const d = since(lastHeat.HeatDate);
      const exp = 21;
      if (d > exp + 4) return { ...TRAFFIC.yellow, next: `Heat expected — cycle running long (${d}d)`, record: lastHeat };
      if (d >= exp - 3) return { ...TRAFFIC.yellow, next: `Heat expected in ${Math.max(0, exp - d)}d`, record: lastHeat };
      return { ...TRAFFIC.green, next: "Routine monitoring", record: lastHeat };
    }
    if (calvings.some((c) => c.AnimalID === aID)) return { ...TRAFFIC.green, next: "Post-calving monitoring" };
    return { ...TRAFFIC.green, next: "Routine monitoring" };
  };

  /* ---------------- Scorecard (record quality, not fertility) ---------------- */

  const scorecardFor = async (animalId) => {
    const [heats, insem, preg] = await Promise.all([
      JF.Store.heat.list(), JF.Store.insemination.list(), JF.Store.pregnancy.list(),
    ]);
    const mine = {
      heats: heats.filter((h) => h.AnimalID === animalId),
      ais: insem.filter((x) => x.AnimalID === animalId),
      pregs: preg.filter((x) => x.AnimalID === animalId),
    };
    // Heat detection: share of AIs that had a heat record within the prior 3 days.
    const withHeat = mine.ais.filter((ai) => mine.heats.some((h) => {
      const d = Math.abs(JF.Utils.daysBetween(h.HeatDate, ai.Date));
      return d <= 3;
    })).length;
    const heatDetection = mine.ais.length ? withHeat / mine.ais.length : (mine.heats.length ? 1 : 0);
    // AI timing: share of AIs landing in prime/good band of their episode.
    const eps = episodesFor(animalId, { heats: mine.heats, inseminations: mine.ais });
    const covered = eps.flatMap((e) => e.aiCoverage).filter((c) => c.band === "prime" || c.band === "good").length;
    const aiTiming = mine.ais.length ? covered / mine.ais.length : 0;
    // Observation quality: avg evidence % across episodes with observations.
    const obsEps = eps.filter((e) => e.observations.length);
    const obsQ = obsEps.length ? obsEps.reduce((s, e) => s + e.evidenceScore, 0) / obsEps.length : (mine.heats.length ? 0.4 : 0);
    // Record completeness: AIs with technician + heat-linked + PD after each AI.
    const pdAfter = mine.ais.filter((ai) => mine.pregs.some((p) => JF.Utils.daysBetween(ai.Date, p.Date) >= 20 && JF.Utils.daysBetween(ai.Date, p.Date) <= 60)).length;
    const completeness = mine.ais.length
      ? (0.4 * pdAfter / mine.ais.length) + (0.3 * mine.ais.filter((a) => a.Technician).length / mine.ais.length) + (0.3 * (withHeat / mine.ais.length))
      : (mine.heats.length ? 0.5 : 0);
    const pct = (x) => Math.round(Math.min(1, Math.max(0, x)) * 100);
    return {
      heatDetection: pct(heatDetection),
      aiTiming: pct(aiTiming),
      observationQuality: pct(obsQ),
      completeness: pct(completeness),
    };
  };

  /* ---------------- Why? explanations ---------------- */

  const why = (episode) => {
    const lines = [];
    const s = episode.signs || {};
    Object.values(s).forEach((p) => lines.push(`✓ ${p.label} recorded`));
    if (episode.onsetEstimate) lines.push(`✓ Timing of observations: ${episode.onsetEstimate.basis}`);
    if (episode.standingSeen) lines.push("✓ Standing heat observed — window narrows to 24–32h after onset");
    else lines.push("✓ No standing heat recorded — window widened and shown as less certain");
    lines.push("✓ Previous heat history (cycle averages) where available");
    return {
      basis: lines,
      confidence: episode.standingSeen ? "High" : (episode.evidencePct >= 50 ? "Medium" : "Low"),
    };
  };

  /* ---------------- Public API ---------------- */

  return {
    EVIDENCE,
    episodesFor,
    trafficLight,
    scorecardFor,
    why,
  };
})();

  <script>
JF.Timeline = (function () {
  const TYPES = [
    { entity: "heat",         Title: "🔥 Heat detected",          Icon: "fire",       DateKey: "HeatDate",    Kind: "heat",      DotClass: "timeline__dot--heat" },
    { entity: "insemination", Title: "❤️ Insemination performed", Icon: "syringe",    DateKey: "Date",        Kind: "ai" },
    { entity: "pregnancy",    Title: "🧪 Pregnancy check",        Icon: "pregnancy",   DateKey: "Date",        Kind: "pregnancy" },
    { entity: "calving",      Title: "👶 Calving",                Icon: "baby2",       DateKey: "Date",        Kind: "calving",   DotClass: "timeline__dot--birth" },
    { entity: "health",       Title: "🩺 Veterinary treatment",   Icon: "treatment",   DateKey: "Date",        Kind: "health",    DotClass: "timeline__dot--health" },
    { entity: "deworming",    Title: "💊 Deworming completed",    Icon: "drop",        DateKey: "Date",        Kind: "deworming" },
    { entity: "vaccination",  Title: "💉 Vaccination given",      Icon: "syringe",     DateKey: "DateGiven",   Kind: "vaccine" },
    { entity: "purchases",    Title: "🐄 Cattle purchase",        Icon: "purchase",    DateKey: "Date",        Kind: "finance",   DotClass: "timeline__dot--finance" },
    { entity: "sales",        Title: "🏷 Cattle sale",            Icon: "sale",        DateKey: "Date",        Kind: "finance",   DotClass: "timeline__dot--finance" },
    { entity: "death",        Title: "⚰ Death recorded",         Icon: "death",       DateKey: "Date",        Kind: "death",     DotClass: "timeline__dot--danger" },
    { entity: "expenses",     Title: "💰 Expense recorded",       Icon: "money",       DateKey: "Date",        Kind: "finance",   DotClass: "timeline__dot--finance" },
  ];

  const animalFor = async (animalId) => {
    const events = [];
    for (const t of TYPES) {
      try {
        const all = await JF.Store[t.entity].list();
        all.forEach((rec) => {
          if (rec.AnimalID && rec.AnimalID === animalId) {
            events.push({
              id: `${t.entity}-${rec.id}`,
              Kind: t.Kind,
              Title: t.Title,
              Subtitle: buildSubtitle(t.entity, rec),
              Date: rec[t.DateKey] || rec.CreatedAt,
              Record: rec,
              Entity: t.entity,
              Icon: t.Icon,
              DotClass: t.DotClass || "",
            });
          }
        });
      } catch (e) { /* noop */ }
    }
    events.sort((a, b) => {
      const da = new Date(a.Date || 0), db = new Date(b.Date || 0);
      return db.getTime() - da.getTime();
    });
    return events;
  };

  const buildSubtitle = (entity, r) => {
    switch (entity) {
      case "heat": return r.HeatIntensity ? `${r.HeatIntensity} · Symptoms: ${(r.Symptoms || []).slice(0,2).join(", ")}` : "Heat event";
      case "insemination": return [r.Method, r.SemenBullID ? `Bull/Semen: ${r.SemenBullID}` : null, r.Technician].filter(Boolean).join(" · ");
      case "pregnancy": return `Result: ${r.Result || "—"}${r.Method ? " · Method: " + r.Method : ""}`;
      case "calving": return `Calf: ${r.CalfID || "New calf"} · ${r.CalfGender || ""} · ${r.CalfWeight ? r.CalfWeight + "kg" : ""}`;
      case "health": return [r.Problem, r.Diagnosis, r.RecoveryStatus].filter(Boolean).join(" · ");
      case "deworming": return [r.Medicine, r.Dose ? r.Dose + " dose" : null, r.Weight ? r.Weight + "kg" : null].filter(Boolean).join(" · ");
      case "vaccination": return [r.Vaccine, r.BatchNumber ? "Batch " + r.BatchNumber : null].filter(Boolean).join(" · ");
      case "purchases": return `₹${r.TotalCost || r.PurchasePrice || 0} from ${r.Seller || "seller"}`;
      case "sales": return `₹${r.NetSale || r.SalePrice || 0} to ${r.Buyer || "buyer"} · ${r.Reason || ""}`;
      case "death": return [r.Cause, r.Veterinarian ? "Vet: " + r.Veterinarian : null].filter(Boolean).join(" · ");
      case "expenses": return `${r.Category || "Expense"} · ₹${r.Amount || 0}${r.Vendor ? " · " + r.Vendor : ""}`;
      default: return "";
    }
  };

  const renderNode = (list) => {
    const wrap = JF.Utils.el("div", { class: "timeline" });
    if (!list.length) {
      wrap.appendChild(JF.Utils.el("div", { class: "search-empty" }, "No timeline events yet. Events appear automatically as you record heats, treatments, vaccinations and more."));
      return wrap;
    }
    list.forEach((ev) => {
      const item = JF.Utils.el("div", { class: "timeline__item" }, [
        JF.Utils.el("div", { class: `timeline__dot ${ev.DotClass || ""}`, html: JF.Utils.svgIcon(ev.Icon, 10, 10) }),
        JF.Utils.el("div", { class: "timeline__date" }, JF.Utils.formatDate(ev.Date, "dd MMM yyyy")),
        JF.Utils.el("div", { class: "timeline__title" }, ev.Title),
        JF.Utils.el("div", { class: "timeline__desc" }, ev.Subtitle || ""),
      ]);
      wrap.appendChild(item);
    });
    return wrap;
  };

  /**
   * Synchronous variant used by the animal profile: builds the same unified event
   * list from a pre-fetched cache ({ heat: [...], health: [...], ... }) instead of
   * hitting the Store. Used when the profile already loaded all entity lists.
   */
  const animalForSync = (animalId, cache = {}) => {
    const events = [];
    TYPES.forEach((t) => {
      (cache[t.entity] || []).forEach((rec) => {
        if (rec && rec.AnimalID === animalId) {
          events.push({
            id: `${t.entity}-${rec.id}`,
            Kind: t.Kind,
            Title: t.Title,
            Subtitle: buildSubtitle(t.entity, rec),
            Date: rec[t.DateKey] || rec.CreatedAt,
            Record: rec,
            Entity: t.entity,
            Icon: t.Icon,
            DotClass: t.DotClass || "",
          });
        }
      });
    });
    events.sort((a, b) => new Date(b.Date || 0) - new Date(a.Date || 0));
    return events;
  };

  return { animalFor, animalForSync, renderNode, TYPES };
})();

  <script>
JF.Modal = (function () {
  const root = () => document.getElementById("modal-root");

  const open = ({ title = "", body = "", footer = "", size = "md", onMount = null, className = "" } = {}) => {
    const r = root();
    r.classList.add("is-open");
    r.removeAttribute("inert");

    const wrap = JF.Utils.el("div", { class: `modal modal--${size} ${className}` });
    const backdrop = JF.Utils.el("div", { class: "modal-backdrop" });

    const bodyEl = JF.Utils.el("div", { class: "modal__body" });
    if (typeof body === "string") bodyEl.innerHTML = body;
    else if (Array.isArray(body)) body.forEach((n) => n instanceof Node && bodyEl.appendChild(n));
    else if (body instanceof Node) bodyEl.appendChild(body);

    const header = JF.Utils.el("div", { class: "modal__header" }, [
      JF.Utils.el("div", {}, [
        JF.Utils.el("h2", { class: "modal__title" }, title),
      ]),
      JF.Utils.el("button", {
        class: "modal__close", "aria-label": "Close", type: "button",
        html: JF.Utils.svgIcon("close", 18, 18),
        onclick: close,
      }),
    ]);

    const footerEl = JF.Utils.el("div", { class: "modal__footer" });
    if (typeof footer === "string") footerEl.innerHTML = footer;
    else if (Array.isArray(footer)) footer.forEach((n) => n instanceof Node && footerEl.appendChild(n));
    else if (footer instanceof Node) footerEl.appendChild(footer);

    wrap.appendChild(header);
    wrap.appendChild(bodyEl);
    if (footer) wrap.appendChild(footerEl);

    JF.Utils.clear(r);
    r.appendChild(backdrop);
    r.appendChild(wrap);
    backdrop.addEventListener("click", close);

    const onKey = (e) => { if (e.key === "Escape") { close(); document.removeEventListener("keydown", onKey); } };
    document.addEventListener("keydown", onKey);

    if (typeof onMount === "function") onMount(wrap);
    setTimeout(() => r.classList.add("is-open"), 10);
    return wrap;
  };

  const close = () => {
    const r = root();
    r.classList.remove("is-open");
    r.setAttribute("inert", "");
    setTimeout(() => JF.Utils.clear(r), 300);
  };

  return { open, close };
})();

</script>
  <script>
JF.Toast = (function () {
  const root = () => document.getElementById("toast-root");

  const show = (message, opts = {}) => {
    // Accept either a type string ("success") or an options object.
    if (typeof opts === "string") opts = { type: opts };
    const { type = "default", duration = 3200, action = null } = opts;
    const t = JF.Utils.el("div", {
      class: `toast toast--${type === "default" ? "" : type}`,
      role: "status",
    });

    let iconSvg = JF.Utils.svgIcon("check", 16, 16);
    if (type === "error") iconSvg = JF.Utils.svgIcon("close", 16, 16);
    if (type === "warning") iconSvg = JF.Utils.svgIcon("warning", 16, 16);

    t.appendChild(JF.Utils.el("span", { class: "toast__icon", html: iconSvg }));
    t.appendChild(JF.Utils.el("span", {}, message));
    if (action && action.label) {
      t.appendChild(JF.Utils.el("a", {
        href: action.href || "#", style: { marginLeft: "10px", fontWeight: 700, textDecoration: "underline", whiteSpace: "nowrap" },
        onclick: () => { if (typeof action.onClick === "function") action.onClick(); },
      }, action.label));
    }

    root().appendChild(t);
    requestAnimationFrame(() => t.classList.add("is-shown"));
    setTimeout(() => {
      t.classList.remove("is-shown");
      setTimeout(() => t.remove(), 400);
    }, duration);
    return t;
  };

  const success = (m, opts) => show(m, { ...opts, type: "success" });
  const error = (m, opts) => show(m, { ...opts, type: "error" });
  const warning = (m, opts) => show(m, { ...opts, type: "warning" });

  return { show, success, error, warning };
})();

  <script>
JF.Search = (function () {
  const input = () => document.getElementById("global-search");
  const resultsEl = () => document.getElementById("search-results");
  let activeIdx = -1;
  let currentItems = [];

  const render = (groups = []) => {
    const el = resultsEl();
    if (!groups.length) { el.hidden = true; return; }
    JF.Utils.clear(el);
    currentItems = [];
    let flatIdx = 0;
    groups.forEach((g) => {
      const group = JF.Utils.el("div", { class: "search-group" });
      group.appendChild(JF.Utils.el("div", { class: "search-group__title" }, g.title));
      (g.items || []).forEach((item) => {
        const idx = flatIdx++;
        currentItems.push(item);
        const node = JF.Utils.el("div", {
          class: `search-item ${activeIdx === idx ? "is-active" : ""}`,
          "data-idx": idx,
          onclick: () => { if (typeof item.onSelect === "function") item.onSelect(item); close(); },
        }, [
          JF.Utils.el("span", { class: "icon-btn", style: { width: "32px", height: "32px" }, html: JF.Utils.svgIcon(item.icon || "search", 16, 16) }),
          JF.Utils.el("div", {}, [
            JF.Utils.el("div", { class: "search-item__title" }, item.title),
            JF.Utils.el("div", { class: "search-item__sub" }, item.subtitle || ""),
          ]),
          JF.Utils.el("span", { class: "eyebrow" }, item.meta || ""),
        ]);
        group.appendChild(node);
      });
      el.appendChild(group);
    });
    el.hidden = false;
  };

  const buildGroups = async (q) => {
    const qq = q.toLowerCase().trim();
    if (!qq) return [];
    const groups = [];

    try {
      if (JF.Store && JF.Store.animals) {
        const animals = (await JF.Store.animals.list() || []).filter((a) =>
          [a.AnimalID, a.TagNumber, a.Name, a.Breed, a.Species].filter(Boolean)
            .some((x) => String(x).toLowerCase().includes(qq))
        ).slice(0, 8);
        if (animals.length) {
          groups.push({
            title: "Animals",
            items: animals.map((a) => ({
              icon: "animals",
              title: `${a.AnimalID} — ${a.Name || ""}`,
              subtitle: [a.Breed, a.Gender, JF.Utils.ageLabel(a.DateOfBirth)].filter(Boolean).join(" · "),
              meta: a.CurrentStatus || "",
              onSelect: () => JF.App && JF.App.navigate(`#animal/${a.AnimalID}`),
            })),
          });
        }
      }
    } catch (e) { /* noop */ }

    try {
      if (JF.Store && JF.Store.reminders) {
        const rems = (await JF.Store.reminders.list() || []).filter((r) =>
          (r.AnimalID || "").toLowerCase().includes(qq) ||
          (r.ReminderType || "").toLowerCase().includes(qq) ||
          (r.Notes || "").toLowerCase().includes(qq)
        ).slice(0, 6);
        if (rems.length) {
          groups.push({
            title: "Reminders",
            items: rems.map((r) => ({
              icon: "bell",
              title: `${r.ReminderType} — ${r.AnimalID || ""}`,
              subtitle: r.DueDate ? `Due ${JF.Utils.formatDate(r.DueDate)}` : "",
              meta: r.Status || "",
              onSelect: () => JF.App && JF.App.navigate("#reminders"),
            })),
          });
        }
      }
    } catch (e) { /* noop */ }

    try {
      if (JF.Store) {
        // Operational records linked to an animal (or matching an event ID prefix)
        const SOURCES = [
          ["heat", "fire", "Heat", "heat"],
          ["insemination", "syringe", "Insemination", "insemination"],
          ["pregnancy", "pregnancy", "Pregnancy Check", "pregnancy"],
          ["calving", "baby2", "Calving", "calving"],
          ["health", "treatment", "Treatment", "health"],
          ["deworming", "drop", "Deworming", "deworming"],
          ["vaccination", "syringe", "Vaccination", "vaccination"],
        ];
        const recItems = [];
        for (const [entity, icon, label, tab] of SOURCES) {
          const rows = (await JF.Store[entity].list()) || [];
          rows.filter((r) =>
            [r.AnimalID, r.id, r.ReferenceID].filter(Boolean).some((x) => String(x).toLowerCase().includes(qq))
          ).slice(0, 3).forEach((r) => recItems.push({
            icon, title: `${label} - ${r.AnimalID || ""}`.trim(),
            subtitle: [r.Problem, r.Medicine, r.Vaccine, r.Result, r.CalfID, r.Cause, r.Diagnosis].filter(Boolean).slice(0, 2).join(" \u00b7 ") || r.id,
            meta: JF.Utils.formatDate(r.HeatDate || r.Date || r.DateGiven || ""),
            onSelect: () => JF.App && JF.App.navigate(`#animal/${r.AnimalID || ""}/${tab}`),
          }));
        }
        if (recItems.length) groups.push({ title: "Records", items: recItems.slice(0, 8) });

        // Accounting entries referencing the animal or reference
        const jnl = (await JF.Store.journal.list()) || [];
        const jItems = jnl.filter((e) =>
          [e.AnimalID, e.ReferenceID, e.Description].filter(Boolean).some((x) => String(x).toLowerCase().includes(qq))
        ).slice(0, 5).map((e) => ({
          icon: "money",
          title: `${e.JournalID} - ${e.Description || e.TransactionType}`,
          subtitle: `Dr ${e.DebitAccount} / Cr ${e.CreditAccount}`,
          meta: JF.Utils.money(e.Amount || 0),
          onSelect: () => JF.App && JF.App.navigate("#finance/journal"),
        }));
        if (jItems.length) groups.push({ title: "Accounting", items: jItems });

        // Documents by filename or animal link
        const files = (await JF.Store.files.list()) || [];
        const fItems = files.filter((f) =>
          [f.FileName, f.AnimalID, f.RecordID, f.Category].filter(Boolean).some((x) => String(x).toLowerCase().includes(qq))
        ).slice(0, 5).map((f) => ({
          icon: "document",
          title: f.FileName || f.id,
          subtitle: [f.Category, f.AnimalID].filter(Boolean).join(" \u00b7 "),
          meta: JF.Utils.formatDate(f.UploadDate || ""),
          onSelect: () => JF.App && JF.App.navigate(`#documents/${(f.Category || "other").toLowerCase()}`),
        }));
        if (fItems.length) groups.push({ title: "Documents", items: fItems });
      }
    } catch (e) { /* noop */ }

    if (!groups.length) {
      groups.push({
        title: "",
        items: [{ icon: "search", title: `No results for “${q}”`, subtitle: "Try an animal ID, tag number, or event type." }],
      });
    }

    return groups;
  };

  const close = () => { const r = resultsEl(); if (r) r.hidden = true; activeIdx = -1; };
  const go = (dir) => {
    if (!currentItems.length) return;
    activeIdx = (activeIdx + dir + currentItems.length) % currentItems.length;
    const items = document.querySelectorAll(".search-item");
    items.forEach((n, i) => n.classList.toggle("is-active", i === activeIdx));
    if (items[activeIdx]) items[activeIdx].scrollIntoView({ block: "nearest" });
  };
  const activate = () => {
    if (activeIdx >= 0 && currentItems[activeIdx]) {
      const it = currentItems[activeIdx];
      if (typeof it.onSelect === "function") { it.onSelect(it); close(); }
    }
  };

  const init = () => {
    const inp = input();
    if (!inp) return;
    const run = JF.Utils.debounce(async (q) => render(await buildGroups(q)), 250);
    inp.addEventListener("input", (e) => run(e.target.value));
    inp.addEventListener("focus", (e) => { if (e.target.value) run(e.target.value); });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); go(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); go(-1); }
      else if (e.key === "Enter") { e.preventDefault(); activate(); }
      else if (e.key === "Escape") { e.preventDefault(); close(); inp.blur(); }
    });
    document.addEventListener("click", (e) => {
      if (!inp.contains(e.target) && !resultsEl().contains(e.target)) close();
    });
  };

  return { init, close, render, buildGroups };
})();

  <script>
JF.QuickEntry = (function () {
  const OPTIONS = [

    { id: "document", label: "Document",        icon: "document",  key: "📄" },
    { id: "reminder", label: "Custom Reminder", icon: "bell",      key: "🔔" },

  const $v = (id) => document.getElementById(id)?.value?.trim() || "";

  const field = (label, id, opts = {}) => JF.Utils.el("div", { class: "field" }, [
    JF.Utils.el("label", { class: "field__label" }, label),
    opts.options
      ? JF.Utils.el("select", { class: "select", id }, opts.options.map((o) => JF.Utils.el("option", { value: o }, o)))
      : JF.Utils.el("input", { class: "input", type: opts.type || "text", id, value: opts.value ?? "", placeholder: opts.ph || "" }),
  ]);

  const animalSelect = async (id) => {
    const animals = ((await JF.Store.animals.list()) || []).filter((a) => !["Sold", "Deceased"].includes(a.CurrentStatus));
    const sel = JF.Utils.el("select", { class: "select", id }, [
      JF.Utils.el("option", { value: "" }, "-- Select animal --"),
      ...animals.map((a) => JF.Utils.el("option", { value: a.AnimalID }, `${a.Name} (${a.AnimalID})`)),
    ]);
    return JF.Utils.el("div", { class: "field" }, [JF.Utils.el("label", { class: "field__label" }, "Animal *"), sel]);
  };

  const dateField = (id = "qe-date") => field("Date *", id, { type: "date", value: JF.Utils.todayISO() });

  const ok = (checks) => {
    const bad = checks.filter(([v]) => !v);
    if (bad.length) { JF.Toast.show(`Missing: ${bad.map(([, n]) => n).join(", ")}`, "warning"); return false; }
    return true;
  };

  const num = (id) => { const v = $v(id); return v ? Number(v) : 0; };

  // Values that must be a positive number (quantities, money). Zero or negative
  // gets rejected with the field's display name - a real save can never produce
  // a "₹-576 milk payment" style record.
  const positive = (checks) => {
    const bad = checks.filter(([v]) => !(typeof v === "number" && v > 0 && Number.isFinite(v)));
    if (bad.length) { JF.Toast.show(`Must be a positive number: ${bad.map(([, n]) => n).join(", ")}`, "warning"); return false; }
    return true;
  };

  /* ---------- One save() per operation. Each returns {label, id, tab} for the toast link. ---------- */
  const SAVE = {
    async animal(formEl) {
      if (!ok([[$v("qe-name"), "Name"]])) return null;
      const species = $v("qe-species") || "Cattle";
      const prefix = species === "Buffalo" ? "BUFF" : ($v("qe-gender") === "Male" ? "BULL" : "COW");
      const all = await JF.Store.animals.list();
      let n = all.filter((a) => a.AnimalID?.startsWith(prefix)).length + 1;
      let id = `${prefix}-${String(n).padStart(3, "0")}`;
      while (all.some((a) => a.AnimalID === id)) { n++; id = `${prefix}-${String(n).padStart(3, "0")}`; }
      const uploaded = await JF.PhotoUpload.consume(formEl && formEl._photoField, { animalId: "", kind: "Profile" });
      await JF.Store.animals.create({
        id, AnimalID: id, Name: $v("qe-name"), TagNumber: $v("qe-tag") || null,
        Species: species, Breed: $v("qe-breed") || null, Gender: $v("qe-gender") || "Female",
        DateOfBirth: $v("qe-dob") || null, PurchaseDate: $v("qe-pdate") || null,
        PurchasePrice: num("qe-pprice") || null, CurrentStatus: "Open",
        CurrentGroup: $v("qe-group") || "Main Herd", CurrentLocation: $v("qe-loc") || "Barn A",
        PhotoURL: uploaded || JF.Utils.portraitSVG($v("qe-name") || id, species === "Buffalo" ? "buffalo" : "cattle"),
      });
      if (uploaded) {
        try { await JF.PhotoUpload.attachToAnimal({ animalId: id, url: uploaded, kind: "Profile", fileName: $v("qe-name") + "-profile.jpg" }); } catch (e) { console.warn(e); }
      }
      return { label: "Animal", id, tab: "overview" };
    },

    async heat() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      await JF.Store.heat.create({
        HeatRecordID: `HEAT-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), HeatDate: $v("qe-date"),
        HeatTime: $v("qe-time") || null, HeatIntensity: $v("qe-int") || "Moderate",
        DetectionMethod: $v("qe-det") || "Visual",
        Symptoms: [...document.querySelectorAll(".qe-symptom:checked")].map((c) => c.value),
        PhotoURL: JF.Utils.portraitSVG(`heat-${$v("qe-animal")}-${$v("qe-date")}`, "cattle"),
      });
      return { label: "Heat record", id: $v("qe-animal"), tab: "heat" };
    },

    async ai() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      await JF.Store.insemination.create({
        InseminationID: `AI-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        Method: $v("qe-method") || "Artificial Insemination", SemenBullID: $v("qe-bull") || null,
        Technician: $v("qe-tech") || null, Cost: num("qe-cost"),
      });
      return { label: "Insemination", id: $v("qe-animal"), tab: "insemination" };
    },

    async preg() {
      if (!ok([[$v("qe-animal"), "Animal"], [$v("qe-result"), "Result"]])) return null;
      await JF.Store.pregnancy.create({
        PregnancyCheckID: `PREG-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        Method: $v("qe-pmethod") || "Rectal Palpation", Result: $v("qe-result"),
        Veterinarian: $v("qe-vet") || null, InseminationID: $v("qe-ai") || null,
      });
      return { label: "Pregnancy check", id: $v("qe-animal"), tab: "pregnancy" };
    },

    async calving() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      const animals = await JF.Store.animals.list();
      const year = new Date($v("qe-date")).getFullYear();
      const n = animals.filter((a) => a.AnimalID?.startsWith(`CALF-${year}-`)).length + 1;
      const calfID = `CALF-${year}-${String(n).padStart(3, "0")}`;
      const calfGender = $v("qe-cgender") || "Female";
      const mother = await JF.Store.animals.get($v("qe-animal"));
      await JF.Store.calving.create({
        CalvingID: `CALV-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        CalvingType: $v("qe-ctype") || "Normal", AssistanceRequired: false, Complications: "None",
        CalfID: calfID, CalfName: $v("qe-cname") || null, CalfGender: calfGender, CalfWeight: num("qe-cweight") || null,
        CalfHealth: $v("qe-chealth") || "Healthy", Veterinarian: $v("qe-vet") || null,
        PhotoURL: JF.Utils.portraitSVG(`calving-${calfID}`, "calf"),
      });
      // NOTE: the calf master record (with MotherID/FatherID + care-plan reminders) is
      // created by the cascade engine's calving:created handler, so every entry path
      // behaves identically.
      return { label: `Calving · calf ${calfID}`, id: calfID, tab: "overview" };
    },

    async treat() {
      if (!ok([[$v("qe-animal"), "Animal"], [$v("qe-problem"), "Problem"]])) return null;
      const meds = [...document.querySelectorAll(".qe-med-row")].map((row) => ({
        name: row.querySelector(".qe-med-name")?.value?.trim(),
        dose: row.querySelector(".qe-med-dose")?.value?.trim(),
        duration: row.querySelector(".qe-med-dur")?.value?.trim(),
      })).filter((m) => m.name);
      const animals = await JF.Store.animals.list();
      const cur = animals.find((x) => x.AnimalID === $v("qe-animal"));
      await JF.Store.health.create({
        HealthRecordID: `HEA-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        Problem: $v("qe-problem"), Diagnosis: $v("qe-diag") || null,
        Treatment: $v("qe-treat") || null, Medicine: meds[0]?.name || null, Dose: meds[0]?.dose || null,
        Medicines: meds, Veterinarian: $v("qe-vet") || null, TreatmentCost: num("qe-cost"),
        FollowUpDate: $v("qe-followup") || null,
        RecoveryStatus: $v("qe-status") || "Under Treatment",
      });
      // Remember the pre-illness status so recovery can restore it (only when the
      // animal is newly entering care — don't clobber a stored value).
      if (cur && !["Under Treatment", "Sick"].includes(cur.CurrentStatus)) {
        await JF.Store.animals.update(cur.id, { PreviousStatus: cur.CurrentStatus, UpdatedAt: new Date().toISOString() });
      }
      return { label: "Treatment", id: $v("qe-animal"), tab: "health" };
    },

    async vaccine() {
      if (!ok([[$v("qe-animal"), "Animal"], [$v("qe-vaccine"), "Vaccine"]])) return null;
      await JF.Store.vaccination.create({
        VaccinationID: `VAC-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"),
        Vaccine: $v("qe-vaccine"), DateGiven: $v("qe-date"), BatchNumber: $v("qe-batch") || null,
        NextDueDate: $v("qe-next") || null, Veterinarian: $v("qe-vet") || null, Cost: num("qe-cost"),
      });
      return { label: "Vaccination", id: $v("qe-animal"), tab: "vaccination" };
    },

    async deworm() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      await JF.Store.deworming.create({
        DewormingID: `DEW-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        Medicine: $v("qe-med") || "Albendazole", Dose: $v("qe-dose") || null,
        Weight: num("qe-weight") || null, Veterinarian: $v("qe-vet") || null, Cost: num("qe-cost"),
        NextDueDate: $v("qe-next") || null,
      });
      return { label: "Deworming", id: $v("qe-animal"), tab: "deworming" };
    },

    async dryoff() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      const animals = await JF.Store.animals.list();
      const a = animals.find((x) => x.AnimalID === $v("qe-animal"));
      const dim = a && a.LactationStart ? JF.Utils.daysBetween(a.LactationStart, $v("qe-date")) : null;
      await JF.Store.dryOff.create({
        DryOffID: `DRY-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        ExpectedCalvingDate: $v("qe-nextcalv") || null, DaysInMilkAtDry: dim, Reason: $v("qe-dryreason") || "Scheduled dry-off",
      });
      return { label: `Dry-off · ${$v("qe-animal")}`, id: $v("qe-animal"), tab: "overview" };
    },

    async death() {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      await JF.Store.death.create({
        DeathID: `DEATH-${JF.Utils.uid()}`, AnimalID: $v("qe-animal"), Date: $v("qe-date"),
        Cause: $v("qe-cause") || "Unknown", Veterinarian: $v("qe-vet") || null,
        EstimatedValue: num("qe-value") || null, Notes: $v("qe-notes") || null,
      });
      return { label: "Death record", id: $v("qe-animal"), tab: "overview" };
    },

    async expense() {
      if (!positive([[num("qe-amount"), "Amount"]])) return null;
      await JF.Store.expenses.create({
        ExpenseID: `EXP-${JF.Utils.uid()}`, Date: $v("qe-date"), Category: $v("qe-cat") || "Other Farm Expense",
        Description: $v("qe-desc") || null, Amount: num("qe-amount"),
        PaymentMethod: $v("qe-pay") || "Cash", Vendor: $v("qe-vendor") || null,
        AnimalID: $v("qe-animal-x") || null,
      });
      return { label: "Expense", id: $v("qe-animal-x"), tab: "expenses" };
    },

    /** Milk payment received: the dairy's main income. Posts Dr Cash/Bank · Cr Milk Sales. */
    async milk() {
      if (!positive([[num("qe-milk-qty"), "Quantity"], [num("qe-milk-rate"), "Rate"]])) return null;
      const qty = num("qe-milk-qty"), rate = num("qe-milk-rate");
      const amount = Math.round(qty * rate * 100) / 100;
      await JF.Store.milkSales.create({
        MilkSaleID: `MILK-${JF.Utils.uid("m")}`, Date: $v("qe-date"), Time: $v("qe-milk-time") || null,
        Shift: $v("qe-milk-shift") || "Morning", Buyer: $v("qe-milk-buyer") || null,
        QuantityLitres: qty, FatPercent: num("qe-milk-fat") || null, RatePerLitre: rate,
        Amount: amount, PaymentMethod: $v("qe-milk-pay") || "Cash",
        PaymentStatus: $v("qe-milk-status") || "Received",
        AnimalNotes: $v("qe-milk-notes") || null,
      });
      return { label: `Milk payment · ₹${amount}`, id: null, tab: null };
    },

    async purchase() {
      if (!ok([[$v("qe-seller"), "Seller"], []]) || !positive([[num("qe-price"), "Price"]])) return null;
      const species = $v("qe-species") || "Cattle";
      const prefix = species === "Buffalo" ? "BUFF" : ($v("qe-gender") === "Male" ? "BULL" : "COW");
      const all = await JF.Store.animals.list();
      let n = all.filter((a) => a.AnimalID?.startsWith(prefix)).length + 1;
      let id = `${prefix}-${String(n).padStart(3, "0")}`;
      while (all.some((a) => a.AnimalID === id)) { n++; id = `${prefix}-${String(n).padStart(3, "0")}`; }
      const total = num("qe-price") + num("qe-transport") + num("qe-vetcheck");
      await JF.Store.animals.create({
        id, AnimalID: id, Name: $v("qe-name") || id, Species: species,
        Breed: $v("qe-breed") || null, Gender: $v("qe-gender") || "Female",
        DateOfBirth: $v("qe-dob") || null, PurchaseDate: $v("qe-date"),
        PurchasePrice: num("qe-price"), CurrentStatus: "Open",
        PhotoURL: JF.Utils.portraitSVG($v("qe-name") || id, species === "Buffalo" ? "buffalo" : "cattle"),
      });
      await JF.Store.purchases.create({
        PurchaseID: `PUR-${JF.Utils.uid()}`, Date: $v("qe-date"), Seller: $v("qe-seller"),
        AnimalID: id, Species: species, Breed: $v("qe-breed") || null, Age: null, Weight: num("qe-weight") || null,
        PurchasePrice: num("qe-price"), TransportationCost: num("qe-transport"),
        VeterinaryCheckCost: num("qe-vetcheck"), OtherCost: 0, TotalCost: total,
        PaymentMethod: $v("qe-pay") || "Cash",
      });
      return { label: `Purchase · ${id}`, id, tab: "overview" };
    },

    async sale() {
      if (!ok([[$v("qe-animal"), "Animal"], []]) || !positive([[num("qe-price"), "Sale price"]])) return null;
      const price = num("qe-price"), trans = num("qe-trans"), comm = num("qe-comm");
      await JF.Store.sales.create({
        SaleID: `SALE-${JF.Utils.uid()}`, Date: $v("qe-date"), AnimalID: $v("qe-animal"),
        Buyer: $v("qe-buyer") || null, SalePrice: price, Transportation: trans, Commission: comm,
        OtherCost: 0, NetSale: price - trans - comm, PaymentMethod: $v("qe-pay") || "Cash",
        Reason: $v("qe-reason") || null,
      });
      return { label: "Sale", id: $v("qe-animal"), tab: "overview" };
    },

    async observe(formEl) {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;
      const signs = [...document.querySelectorAll(".qe-obs-sign:checked")].map((c) => c.value);
      if (!signs.length) { ok([["", "At least one observed sign"]]); return null; }
      const animalId = $v("qe-animal");
      let photoURL = null;
      try {
        const url = await JF.PhotoUpload.consume(formEl && formEl._photoField, { animalId, kind: "Heat" });
        if (url) photoURL = url;
      } catch (e) { /* photo optional */ }
      await JF.Store.heat.create({
        HeatRecordID: `HEAT-${JF.Utils.uid()}`, AnimalID: animalId,
        HeatDate: $v("qe-date") || JF.Utils.todayISO(), HeatTime: $v("qe-time") || "",
        HeatIntensity: signs.some((s) => /standing/i.test(s)) ? "Standing" : "Observed",
        DetectionMethod: "Observation Sheet", Symptoms: signs,
        PhotoURL: photoURL || null,
        Notes: "Recorded via observation sheet",
      });
      return { label: "Observation", id: animalId, tab: "heat" };
    },

    async photo(formEl) {
      if (!ok([[$v("qe-animal"), "Animal"]])) return null;

      let url = fallback, mode = "local";
      try {
        const res = await JF.PhotoUpload.consume(formEl && formEl._photoField, { animalId, kind });
        if (res) { url = res; mode = JF.PhotoUpload.isDriveLink(res) ? "drive" : "local"; }
      } catch (e) { console.warn(e); }
      await JF.Store.files.create({
        FileID: `FILE-${JF.Utils.uid()}`, FileName: `photo-${animalId}-${$v("qe-date")}.jpg`,

        RecordType: kind, RecordID: animalId,

        UploadDate: JF.Utils.todayISO(),
        Notes: mode === "drive" ? "Uploaded to the farm server" : "Stored on this device (backend not connected)",

      if (kind === "Profile" || kind === "Identification") {

        const a = animals.find((x) => x.AnimalID === animalId || x.id === animalId);
        if (a) await JF.Store.animals.update(a.id, { PhotoURL: url });

      JF.Toast.show(mode === "drive" ? "Photo uploaded to the server." : "Photo saved on this device (connect the farm API in Settings to sync).", mode === "drive" ? "success" : "warning");

        field("Batch number", "qe-batch", { ph: "optional" }),

    deworm: async () => JF.Utils.el("div", { class: "form-stack" }, [
      await animalSelect("qe-animal"), dateField(),
      field("Medicine", "qe-med", { options: ["Albendazole", "Ivermectin", "Fenbendazole", "Oxyclozanide"] }),
      field("Dose", "qe-dose", { ph: "e.g. 60 ml" }),
      field("Weight (kg)", "qe-weight", { type: "number" }),
      field("Next due date", "qe-next", { type: "date" }),
      field("Veterinarian", "qe-vet", { ph: "optional" }),
      field("Cost (₹)", "qe-cost", { type: "number" }),

    death: async () => JF.Utils.el("div", { class: "form-stack" }, [
      await animalSelect("qe-animal"), dateField(),

      field("Rate per litre (₹) *", "qe-milk-rate", { type: "number", step: "0.5", ph: "e.g. 42" }),
      field("Buyer", "qe-milk-buyer", { ph: "e.g. Verka Dairy / local vendor" }),
      field("Payment method", "qe-milk-pay", { options: ["Cash", "Bank Transfer", "UPI", "Cheque", "Card"] }),
      field("Payment status", "qe-milk-status", { options: ["Received", "Pending"] }),
      field("Notes", "qe-milk-notes", { ph: "optional" }),
    ]),

    expense: async () => JF.Utils.el("div", { class: "form-stack" }, [
      dateField(),
      field("Category", "qe-cat", { options: ["Veterinary", "Medicine", "Vaccination", "Deworming", "Labor", "Electricity", "Water", "Fuel", "Transportation", "Maintenance", "Equipment", "Raw Material Purchase", "Other Farm Expense"] }),
      field("Amount (₹) *", "qe-amount", { type: "number", ph: "e.g. 5000" }),
      field("Vendor", "qe-vendor", { ph: "optional" }),
      field("Payment method", "qe-pay", { options: ["Cash", "Bank Transfer", "UPI", "Cheque", "Card"] }),

    ]),

    purchase: async () => JF.Utils.el("div", { class: "form-stack" }, [
      dateField(),
      field("Seller *", "qe-seller", { ph: "e.g. Ramesh Kumar Dairy Farm" }),
      field("Name", "qe-name", { ph: "animal name (optional)" }),
      field("Species", "qe-species", { options: ["Cattle", "Buffalo"] }),
      field("Breed", "qe-breed", { options: ["HF Cross", "Jersey Cross", "Sahiwal", "Gir", "Red Sindhi", "Tharparkar", "Murrah Buffalo", "Nili-Ravi Buffalo"] }),
      field("Gender", "qe-gender", { options: ["Female", "Male"] }),
      field("Purchase price (₹) *", "qe-price", { type: "number" }),
      field("Transportation (₹)", "qe-transport", { type: "number" }),
      field("Vet check (₹)", "qe-vetcheck", { type: "number" }),

    ]),

    sale: async () => JF.Utils.el("div", { class: "form-stack" }, [
      await animalSelect("qe-animal"), dateField(),
      field("Buyer", "qe-buyer", { ph: "optional" }),
      field("Sale price (₹) *", "qe-price", { type: "number" }),

      field("Payment method", "qe-pay", { options: ["Cash", "Bank Transfer", "UPI", "Cheque", "Card"] }),
      field("Reason", "qe-reason", { ph: "e.g. Cull, transfer" }),
    ]),

    photo: async () => {
      const photo = JF.PhotoUpload.photoField({ inputId: "qe-photo-file", label: "Choose photo", animalId: $v("qe-animal") || undefined });
      const wrap = JF.Utils.el("div", { class: "form-stack" }, [
        await animalSelect("qe-animal"),
        photo,
        field("Kind", "qe-photo-kind", { options: ["Profile", "Identification", "Heat", "Calving", "Health", "Other"] }),
        dateField("qe-date"),
      ]);
      wrap._photoField = photo;
      return wrap;
    },

    /* ---- Heat observation sheet: signs → live evidence meter ---- */
    observe: async () => {
      const SIGNS = [
        "Standing Heat", "Mounting", "Clear Mucus", "Restlessness",
        "Increased Vocalization", "Vulvar Swelling", "Reduced Intake", "Tail Raising",
      ];
      const wrap = JF.Utils.el("div", { class: "form-stack" });
      wrap.appendChild(await animalSelect("qe-animal"));
      wrap.appendChild(JF.Utils.el("div", { class: "grid grid--cols-2" }, [
        field("Date", "qe-date", { type: "date", value: JF.Utils.todayISO() }),
        field("Time", "qe-time", { type: "time", value: new Date().toTimeString().slice(0, 5) }),
      ]));
      const chipBox = JF.Utils.el("div", { class: "chip-row", id: "qe-obs-signs" });
      SIGNS.forEach((s) => {
        chipBox.appendChild(JF.Utils.el("label", { class: "chip chip--toggle", style: { cursor: "pointer" } }, [
          JF.Utils.el("input", { type: "checkbox", class: "qe-obs-sign", value: s, style: { marginRight: "5px" }, onchange: updateMeter }), s,
        ]));
      });
      wrap.appendChild(JF.Utils.el("div", { class: "field" }, [
        JF.Utils.el("label", { class: "field__label" }, "Observed signs"),
        chipBox,
      ]));

      // Live evidence meter
      const meter = JF.Utils.el("div", { class: "live-meter" });
      function updateMeter() {
        const chosen = [...document.querySelectorAll(".qe-obs-sign:checked")].map((c) => c.value);
        let total = 0, standing = false;
        chosen.forEach((s) => {
          const e = JF.ReproIntel.EVIDENCE[s];
          if (!e) return;
          total += e.w;
          if (e.strong) standing = true;
        });
        const pct = Math.round(Math.min(1, total / 1.6) * 100);
        const conf = standing ? "HIGH" : pct >= 45 ? "MEDIUM" : pct > 0 ? "LOW" : "—";
        JF.Utils.clear(meter);
        meter.appendChild(JF.Utils.el("div", { class: "live-meter__bar" }, [
          JF.Utils.el("div", { class: "live-meter__fill", style: { width: `${pct}%` } }),
        ]));
        meter.appendChild(JF.Utils.el("div", { class: "live-meter__caption" },
          `Standing-heat evidence: ${pct}% · ${conf} confidence${standing ? " · window will be tight (24–32h)" : chosen.length ? " · window widened" : ""}`));
      }
      updateMeter();
      wrap.appendChild(JF.Utils.el("div", { class: "field" }, [
        JF.Utils.el("label", { class: "field__label" }, "Evidence strength (live)"),
        meter,
      ]));

      // Optional photo evidence
      const photo = JF.PhotoUpload.photoField({ inputId: "qe-obs-photo", label: "Photo evidence (optional)", label2: null });
      wrap.appendChild(photo);
      wrap._photoField = photo;

      // Voice note capture (best-effort; transcription only on Chrome/Android)
      try {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
          const btn = JF.Utils.el("button", { type: "button", class: "btn btn--ghost btn--sm", style: { marginTop: "4px" } }, "🎤 Speak observation");
          const out = JF.Utils.el("div", { class: "field__hint", style: { marginTop: "4px" } });
          btn.addEventListener("click", () => {
            try {
              const rec = new SR();
              rec.lang = "en-IN"; rec.interimResults = false;
              btn.textContent = "... listening";
              rec.onresult = (e2) => {
                const text = e2.results[0][0].transcript;
                out.textContent = `Heard: "${text}" — tick the matching signs above to confirm.`;
                const lower = text.toLowerCase();
                [...document.querySelectorAll(".qe-obs-sign")].forEach((c) => {
                  const s = c.value.toLowerCase();
                  const hit = s.split(/\s+/).some((word) => word.length > 3 && lower.includes(word));
                  if (hit) { c.checked = true; }
                });
                updateMeter();
                btn.textContent = "🎤 Speak again";
              };
              rec.onerror = () => { btn.textContent = "🎤 Try again"; };
              rec.onend = () => { if (btn.textContent.startsWith("...")) btn.textContent = "🎤 Speak observation"; };
              rec.start();
            } catch (e2) { out.textContent = "Voice capture unavailable here."; }
          });
          wrap.appendChild(JF.Utils.el("div", { class: "field" }, [btn, out]));
        }
      } catch (e) { /* no speech API */ }

      return wrap;
    },

    document: async () => JF.Utils.el("div", { class: "form-stack" }, [
      field("File name *", "qe-docname", { ph: "e.g. purchase-bill-PUR-001.pdf" }),
      field("Category", "qe-doccat", { options: ["Animal", "Veterinary", "Purchase", "Sale", "Invoices", "Certificates", "Other"] }),
      field("Linked animal (optional)", "qe-animal", { ph: "e.g. COW-005" }),
      field("Record reference (optional)", "qe-docref", { ph: "e.g. PUR-001" }),
      field("Notes", "qe-docnotes"),
    ]),

    reminder: async () => JF.Utils.el("div", { class: "form-stack" }, [
      field("Type *", "qe-remtype", { options: ["Heat Expected", "Pregnancy Check", "Treatment Follow-up", "Deworming", "Vaccination", "Expected Calving", "Custom"] }),
      field("Due date", "qe-remdue", { type: "date", value: JF.Utils.todayISO() }),
      field("Animal (optional)", "qe-animal", { ph: "e.g. COW-005" }),
      field("Priority", "qe-rempri", { options: ["High", "Normal", "Low"] }),
      field("Notes", "qe-remnotes"),
    ]),
  };

  const medRow = () => JF.Utils.el("div", { class: "qe-med-row", style: { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: "6px", marginBottom: "6px" } }, [
    JF.Utils.el("input", { class: "input qe-med-name", placeholder: "Medicine" }),
    JF.Utils.el("input", { class: "input qe-med-dose", placeholder: "Dose" }),
    JF.Utils.el("input", { class: "input qe-med-dur", placeholder: "Duration" }),
  ]);

  /* ---------- Picker + form shell ---------- */
  const openPicker = () => {
    const grid = JF.Utils.el("div", { style: { display: "grid", gridTemplateColumns: "repeat(3, minmax(0,1fr))", gap: "var(--space-3)" } });
    OPTIONS.forEach((o) => {
      grid.appendChild(JF.Utils.el("button", {
        type: "button", class: "card", style: { padding: "var(--space-4)", textAlign: "left", background: "var(--color-bg)", cursor: "pointer" },
        onclick: () => openForm(o.id),
      }, [
        JF.Utils.el("div", { class: "stat-icon", style: { marginBottom: "var(--space-2)" }, html: JF.Utils.svgIcon(o.icon, 20, 20) }),
        JF.Utils.el("div", { style: { fontSize: "var(--fs-sm)", fontWeight: 600 } }, `${o.key} ${o.label}`),
      ]));
    });
    JF.Modal.open({ title: "Quick Entry", size: "lg", body: grid, footer: [
      JF.Utils.el("button", { type: "button", class: "btn btn--ghost", onclick: () => JF.Modal.close() }, "Cancel"),
    ] });
  };

  const openForm = async (id) => {
    const body = await (FORMS[id] || (async () => JF.Utils.el("div", {}, "Form unavailable.")))();
    const saveBtn = JF.Utils.el("button", { type: "button", class: "btn btn--primary" }, "Save Record");
    saveBtn.addEventListener("click", async () => {
      saveBtn.disabled = true; saveBtn.textContent = "Saving...";
      try {
        const res = await (SAVE[id] || (async () => null))(body);
        if (!res) { saveBtn.disabled = false; saveBtn.textContent = "Save Record"; return; }
        JF.Toast.show(`${res.label} saved successfully!`, { type: "success", action: res.id ? { label: "Go to record", href: res.tab ? `#animal/${res.id}/${res.tab}` : (res.id.startsWith?.("C") ? `#animal/${res.id}` : "#reminders"), onClick: () => { JF.Modal.close(); JF.App.navigate(res.tab ? `#animal/${res.id}/${res.tab}` : (res.id.startsWith?.("C") ? `#animal/${res.id}` : "#reminders")); } } : null });
        JF.Modal.close();
      } catch (e) {
        console.error(e);
        JF.Toast.show("Failed to save record.", "danger");
        saveBtn.disabled = false; saveBtn.textContent = "Save Record";
      }
    });
    JF.Modal.open({ title: OPTIONS.find((o) => o.id === id)?.label || id, size: "md", body, footer: [
      JF.Utils.el("button", { type: "button", class: "btn btn--ghost", onclick: openPicker }, "← Back"),
      saveBtn,
    ] });
  };

  const init = () => {
    const btn = document.getElementById("btn-quick-entry");
    if (btn) btn.addEventListener("click", openPicker);
  };

  /**
   * One-tap observe: pre-seeded modal for a single sign (used by animal profile
   * quick chips). Opens the observation form with that sign pre-ticked.
   */
  const openObserve = async (animalId, sign = "Standing Heat") => {
    await openForm("observe");
    await new Promise((r) => setTimeout(r, 120));
    const sel = document.getElementById("qe-animal");
    if (sel) sel.value = animalId;
    const chip = [...document.querySelectorAll(".qe-obs-sign")].find((c) => c.value === sign);
    if (chip) { chip.checked = true; chip.dispatchEvent(new Event("change", { bubbles: true })); }
  };

  return { init, openPicker, openForm, openObserve, OPTIONS };
})();

  /* ---------- small helpers ---------- */
  const el = (tag, attrs, kids) => JF.Utils.el(tag, attrs, kids);

  const tint = (name) => {
    const map = {
      green:  ["var(--tint-green-bg)",  "var(--tint-green-ink)"],
      gold:   ["var(--tint-gold-bg)",   "var(--tint-gold-ink)"],
      pink:   ["var(--tint-pink-bg)",   "var(--tint-pink-ink)"],
      gray:   ["var(--tint-gray-bg)",   "var(--tint-gray-ink)"],
      purple: ["var(--tint-purple-bg)", "var(--tint-purple-ink)"],
      blue:   ["var(--tint-blue-bg)",   "var(--tint-blue-ink)"],
    };
    const [bg, ink] = map[name] || map.green;
    return `background:${bg};--tile-ink:${ink}`;
  };

  const statTile = ({ label, value, unit, delta, deltaDir = "up", tone = "green", icon, onclick }) =>
    el("div", {
      class: "stat-tile", style: tint(tone),
      onclick: onclick || (() => JF.App?.navigate("#animals")),
    }, [
      el("div", { class: "stat-tile__icon", html: JF.Utils.svgIcon(icon, 22, 22) }),
      el("div", {}, [
        el("div", { class: "stat-tile__label" }, label),
        el("div", { class: "stat-tile__value" }, unit ? `${value} ${unit}` : String(value)),
      ]),
      delta ? el("div", { class: `stat-tile__delta ${deltaDir === "down" ? "is-down" : ""}` }, `${deltaDir === "down" ? "↓" : "↑"} ${delta}`) : null,
    ].filter(Boolean));

  const cardHead = (icon, title, btnLabel, onclick) =>
    el("div", { class: "card__header", style: "display:flex;align-items:center;gap:10px;padding:14px 16px 10px" }, [
      el("span", { style: "color:var(--color-accent-600);display:grid;place-items:center", html: JF.Utils.svgIcon(icon, 18, 18) }),
      el("h3", { class: "section__title", style: { margin: 0, fontSize: "var(--fs-lg)", flex: 1 } }, title),
      btnLabel ? el("button", { class: "btn btn--ghost btn--sm", onclick }, btnLabel) : null,
    ].filter(Boolean));

  /* ---------- event row (Upcoming Events / Health Reminders / Schedule) ---------- */
  const eventRow = ({ id, tag, tagTone, when, overdue, onclick }) =>
    el("div", {
      style: "display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--color-ink-50);cursor:pointer",
      onclick,
    }, [
      el("div", { style: "width:42px;height:42px;border-radius:10px;background:var(--color-bg-sunken);display:grid;place-items:center;color:var(--color-accent-700);flex:none", html: JF.Utils.svgIcon("animals", 20, 20) }),
      el("div", { style: "flex:1;min-width:0" }, [
        el("div", { style: "font-weight:700;color:var(--color-ink-900)" }, id),
        el("div", { style: "margin-top:2px" }, tag),
      ]),
      el("div", { style: "text-align:right;font-size:var(--fs-sm);color:var(--color-ink-500);white-space:nowrap" },
        overdue ? el("span", { class: "badge badge--danger" }, overdue) : when),
      el("span", { style: "color:var(--color-ink-300)" }, "›"),
    ]);

  const tagBadge = (text, tone) => {
    const map = { danger: "badge--danger", warning: "badge--accent", success: "badge--success", info: "badge--info", violet: "badge--violet" };
    return el("span", { class: `badge ${map[tone] || "badge--info"}`, style: "padding:3px 10px" }, text);
  };

  /* ---------- donut (SVG) ---------- */
  const donut = (segments, centerLabel, centerValue) => {
    const R = 58, C = 2 * Math.PI * R;
    let offset = 0;
    const arcs = segments.map(({ n, color }) => {
      const frac = n / segments.reduce((s, x) => s + x.n, 0);
      const dash = `${frac * C} ${C}`;
      const rot = (offset / C) * 360 - 90;
      offset += frac * C;
      return `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${color}" stroke-width="26" stroke-dasharray="${dash}" transform="rotate(${rot} 70 70)"/>`;
    }).join("");
    return el("div", { style: "display:grid;place-items:center" }, [
      el("div", { style: "position:relative;width:150px;height:150px", html:
        `<svg viewBox="0 0 140 140" width="150" height="150">${arcs}
         <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="var(--color-ink-900)" font-family="var(--font-display)">${centerValue}</text>
         <text x="70" y="84" text-anchor="middle" font-size="11" fill="var(--color-ink-500)">Total</text>` }),
    ]);
  };

    const root = $();
    JF.Utils.clear(root);
    const now = new Date();
