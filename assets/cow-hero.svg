<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170">
  <!-- Standing cow with cowboy hat, side view -->
  <!-- Body -->
  <path d="M40 105 q0 -38 55 -38 q55 0 55 38 q0 18 -14 22 l-82 0 q-14 -4 -14 -22z" fill="#fdfaf3"/>
  <!-- Leather patches -->
  <path d="M60 80 q10 -8 22 -6 q-2 14 -10 20 q-10 0 -12 -14z" fill="#6f4426" opacity="0.85"/>
  <path d="M118 74 q12 -2 18 8 q-6 10 -16 8 q-6 -8 -2 -16z" fill="#6f4426" opacity="0.7"/>
  <!-- Legs -->
  <rect x="58" y="122" width="9" height="34" rx="4" fill="#fdfaf3"/>
  <rect x="80" y="124" width="9" height="32" rx="4" fill="#f3ecdf"/>
  <rect x="106" y="124" width="9" height="32" rx="4" fill="#f3ecdf"/>
  <rect x="126" y="122" width="9" height="34" rx="4" fill="#fdfaf3"/>
  <rect x="57" y="150" width="11" height="7" rx="3" fill="#54331c"/>
  <rect x="79" y="150" width="11" height="7" rx="3" fill="#54331c"/>
  <rect x="105" y="150" width="11" height="7" rx="3" fill="#54331c"/>
  <rect x="125" y="150" width="11" height="7" rx="3" fill="#54331c"/>
  <!-- Tail -->
  <path d="M148 92 q14 4 12 26 q-1 10 -8 12" stroke="#54331c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="151" cy="132" r="4.5" fill="#8f232b"/>
  <!-- Head -->
  <ellipse cx="42" cy="88" rx="20" ry="17" fill="#fdfaf3"/>
  <path d="M26 80 q-5 -11 6 -13 q3 7 4 11z" fill="#6f4426"/>
  <!-- Cowboy hat on head -->
  <path d="M20 70 q22 -9 44 0 q4 2 0 4 q-22 7 -44 0 q-4 -2 0 -4z" fill="#3d2413"/>
  <path d="M30 70 q0 -11 12 -11 q12 0 12 11 q-12 4 -24 0z" fill="#54331c"/>
  <rect x="29" y="67" width="26" height="4" rx="2" fill="#8f232b"/>
  <!-- Eyes -->
  <circle cx="35" cy="88" r="2.4" fill="#2b2018"/>
  <circle cx="49" cy="88" r="2.4" fill="#2b2018"/>
  <!-- Muzzle -->
  <ellipse cx="42" cy="98" rx="10" ry="6.5" fill="#ebcfae"/>
  <circle cx="38" cy="97" r="1.4" fill="#8a5830"/>
  <circle cx="46" cy="97" r="1.4" fill="#8a5830"/>
  <!-- Rope lasso around body -->
  <ellipse cx="97" cy="112" rx="48" ry="12" fill="none" stroke="#c98a1b" stroke-width="3" opacity="0.85"/>
</svg>
