<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Cattle Farm Management & Animal Record System — Jagt Farm" />
  <meta name="theme-color" content="#16382b" />
  <title>Jagt Farm — Cattle Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Warm the farm API connection (DNS+TCP+TLS) while the page parses: on a
       cold Render instance this saves a full TLS handshake off the first call. -->
  <link rel="preconnect" href="https://jagt-farm-api.onrender.com" crossorigin />
  <!-- hero-farm.jpg is a CSS background used only on the dashboard route; a
       <link rel=preload> here is unused on every other route and only triggers
       a console warning, so the dashboard fetches it at render instead. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css?v=20261003a" />
  <link rel="stylesheet" href="css/base.css?v=20261003a" />
  <link rel="stylesheet" href="css/components.css?v=20261003a" />
  <link rel="stylesheet" href="css/layout.css?v=20261003a" />
  <link rel="stylesheet" href="css/theme-ranch.css?v=20261003a" />
  <link rel="stylesheet" href="css/intel.css?v=20261003a" />
</head>
<body class="app-shell">

  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar__brand">
      <div class="sidebar__logo" aria-hidden="true">
        <img src="assets/logo-ranch.svg" alt="Jagt Farm Logo" onerror="this.onerror=null;this.style.display='none';" />
      </div>
      <div class="sidebar__brand-text">
        <div class="sidebar__brand-title">JAGT FARM</div>
        <div class="sidebar__brand-sub">Cattle Management</div>
      </div>
    </div>

    <nav id="nav-main" class="sidebar__nav" aria-label="Primary"></nav>
    <div class="sidebar__photo" id="sidebar-photo" aria-hidden="true">
      <div class="sidebar__photo-tagline">Healthy Cows<br>Brighter Tomorrow</div>
    </div>
  </aside>

  <div class="app-backdrop" data-sidebar-dismiss></div>

  <div class="app-main">
    <header class="topbar" role="banner">
      <button class="icon-btn topbar__menu" id="btn-toggle-sidebar" aria-label="Toggle navigation" aria-expanded="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="topbar__search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input type="search" id="global-search" placeholder="Search animal by tag, name or ID..." autocomplete="off" />
        <kbd>Ctrl K</kbd>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="topbar__actions">
        <button class="btn btn--primary btn--icon-label" id="btn-quick-entry" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          QUICK ENTRY
        </button>
        <button class="icon-btn" id="btn-notifications" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 106 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>
          </svg>
          <span class="icon-btn__badge" id="notif-count">0</span>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root" role="main" aria-live="polite">
      <section id="view-container" class="view view--fade-in"></section>
    </main>
  </div>

  <div id="modal-root" class="modal-root" inert></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <button class="fab-quick" id="fab-quick" type="button" aria-label="Quick entry">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <script defer src="js/modules/Utils.js?v=20261003a"></script>
  <script defer src="js/modules/FinanceCalc.js?v=20261003a"></script>
  <script defer src="js/modules/CareSchedule.js?v=20261003a"></script>
  <script defer src="js/modules/LifeCycle.js?v=20261003a"></script>
  <script defer src="js/modules/PhaseEngine.js?v=20261003a"></script>
  <script defer src="js/modules/RuleBook.js?v=20261003a"></script>
  <script defer src="js/modules/PhotoUpload.js?v=20261003a"></script>
  <script defer src="js/data/DataAdapter.js?v=20261003a"></script>
  <script defer src="js/data/MockAdapter.js?v=20261003a"></script>
  <script defer src="js/data/MongoApiAdapter.js?v=20261003a"></script>
  <script defer src="js/data/Store.js?v=20261003a"></script>
  <script defer src="js/data/seed.js?v=20261003a"></script>
  <script defer src="js/modules/CascadeEngine.js?v=20261003a"></script>
  <script defer src="js/modules/RuleEngine.js?v=20261003a"></script>
  <script defer src="js/modules/ReproIntel.js?v=20261003a"></script>
  <script defer src="js/modules/TimelineService.js?v=20261003a"></script>
  <script defer src="js/modules/Modal.js?v=20261003a"></script>
  <script defer src="js/modules/Toast.js?v=20261003a"></script>
  <script defer src="js/modules/Search.js?v=20261003a"></script>
  <script defer src="js/modules/QuickEntry.js?v=20261003a"></script>

  <script defer src="js/views/DashboardView.js?v=20261003a"></script>
  <script defer src="js/views/AnimalsView.js?v=20261003a"></script>
  <script defer src="js/views/AnimalProfileView.js?v=20261003a"></script>
  <script defer src="js/views/ReproductionView.js?v=20261003a"></script>
  <script defer src="js/views/HeatDetectiveView.js?v=20261003a"></script>
  <script defer src="js/views/PedigreeView.js?v=20261003a"></script>
  <script defer src="js/views/HealthView.js?v=20261003a"></script>
  <script defer src="js/views/CalvesView.js?v=20261003a"></script>
  <script defer src="js/views/FinanceView.js?v=20261003a"></script>
  <script defer src="js/views/DocumentsView.js?v=20261003a"></script>
  <script defer src="js/views/CalendarView.js?v=20261003a"></script>
  <script defer src="js/views/RemindersView.js?v=20261003a"></script>
  <script defer src="js/views/ReportsView.js?v=20261003a"></script>
  <script defer src="js/views/AnalyticsView.js?v=20261003a"></script>
  <script defer src="js/views/SettingsView.js?v=20261003a"></script>
  <script defer src="js/views/RulesView.js?v=20261003a"></script>

  <script defer src="js/app.js?v=20261003a"></script>
</body>
</html>
