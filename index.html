<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Cattle Farm Management & Animal Record System — Jagt Farm" />
  <meta name="theme-color" content="#16382b" />
  <title>Jagt Farm — Cattle Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Rye&family=Bitter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/theme-ranch.css" />
  <link rel="stylesheet" href="css/intel.css" />
</head>
<body class="app-shell">

  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="sidebar__brand">
      <div class="sidebar__logo" aria-hidden="true">
        <img src="assets/logo-ranch.svg" alt="Jagt Farm Logo" style="width:100%;height:100%;object-fit:cover;border-radius:var(--radius-md);" onerror="this.onerror=null;this.style.display='none';" />
      </div>
      <div class="sidebar__brand-text">
        <div class="sidebar__brand-title">JAGT</div>
        <div class="sidebar__brand-sub">Cattle Farm</div>
      </div>
    </div>

    <nav id="nav-main" class="sidebar__nav" aria-label="Primary"></nav>
    <div class="sidebar__footer">
      <div class="sidebar__user">
        <div class="avatar avatar--sm" aria-hidden="true">KJ</div>
        <div>
          <div class="sidebar__user-name">Karan Jagt</div>
          <div class="sidebar__user-role">Farm Owner</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="app-backdrop" data-sidebar-dismiss></div>

  <div class="app-main">
    <header class="topbar" role="banner">
      <button class="icon-btn topbar__menu" id="btn-toggle-sidebar" aria-label="Toggle navigation" aria-expanded="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="topbar__search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <input type="search" id="global-search" placeholder="Search animals, records, reports…" autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div class="topbar__actions">
        <button class="btn btn--primary btn--icon-label" id="btn-quick-entry" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          QUICK ENTRY
        </button>
        <button class="icon-btn" id="btn-notifications" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 106 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>
          </svg>
          <span class="icon-btn__badge" id="notif-count">0</span>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root" role="main" aria-live="polite">
      <section id="view-container" class="view view--fade-in"></section>
    </main>
  </div>

  <div id="modal-root" class="modal-root" inert></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

  <button class="fab-quick" id="fab-quick" type="button" aria-label="Quick entry">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <script src="js/modules/Utils.js"></script>
  <script src="js/modules/FinanceCalc.js"></script>
  <script src="js/modules/CareSchedule.js"></script>
  <script src="js/modules/LifeCycle.js"></script>
  <script src="js/modules/RuleBook.js"></script>
  <script src="js/modules/PhotoUpload.js"></script>
  <script src="js/data/DataAdapter.js"></script>
  <script src="js/data/MockAdapter.js"></script>
  <script src="js/data/MongoApiAdapter.js"></script>
  <script src="js/data/SheetRulesAdapter.js"></script>
  <script src="js/data/Store.js"></script>
  <script src="js/data/seed.js"></script>
  <script src="js/modules/CascadeEngine.js"></script>
  <script src="js/modules/RuleEngine.js"></script>
  <script src="js/modules/ReproIntel.js"></script>
  <script src="js/modules/TimelineService.js"></script>
  <script src="js/modules/Modal.js"></script>
  <script src="js/modules/Toast.js"></script>
  <script src="js/modules/Search.js"></script>
  <script src="js/modules/QuickEntry.js"></script>

  <script src="js/views/DashboardView.js"></script>
  <script src="js/views/AnimalsView.js"></script>
  <script src="js/views/AnimalProfileView.js"></script>
  <script src="js/views/ReproductionView.js"></script>
  <script src="js/views/HeatDetectiveView.js"></script>
  <script src="js/views/HealthView.js"></script>
  <script src="js/views/CalvesView.js"></script>
  <script src="js/views/FinanceView.js"></script>
  <script src="js/views/DocumentsView.js"></script>
  <script src="js/views/CalendarView.js"></script>
  <script src="js/views/RemindersView.js"></script>
  <script src="js/views/ReportsView.js"></script>
  <script src="js/views/AnalyticsView.js"></script>
  <script src="js/views/SettingsView.js"></script>
  <script src="js/views/RulesView.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
